<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
  :root{
    --ink:#111827; --ink2:#374151; --muted:#6b7280; --line:#e5e7eb;
    --surface:#ffffff; --page:#f3f4f6;
    --gross:#93c5fd; --cogs:#f87171; --opex:#fbbf24; --sd:#d55fc3; --pct:#10b981;
  }
  *{box-sizing:border-box}
  body{margin:0; padding:12px; background:var(--page); color:var(--ink);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h2{margin:2px 0 10px; font-size:18px; font-weight:700; letter-spacing:-.01em}
  h3{margin:0 0 6px; font-size:14px; font-weight:600; color:var(--ink2)}

  .filter-bar{background:var(--surface); border-radius:10px; padding:8px 14px;
              box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; align-items:center;
              gap:8px; flex-wrap:wrap; margin-bottom:6px}
  .filter-sep{width:1px; height:20px; background:var(--line); margin:0 2px}
  label{font-size:12px; color:var(--muted)}

  .btn{padding:5px 11px; border:1.5px solid #d1d5db; background:#f9fafb;
       border-radius:7px; cursor:pointer; font-size:12px; font-weight:500;
       color:var(--ink2); line-height:1.4; white-space:nowrap; user-select:none;
       transition:background .12s,border-color .12s,color .12s,box-shadow .12s,transform .08s}
  .btn:hover:not(.active):not(:disabled){background:#f3f4f6; border-color:#9ca3af}
  .btn:active:not(:disabled){transform:scale(.94); box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
  .btn.active{background:#2563eb; color:#fff; border-color:#2563eb;
              box-shadow:0 1px 4px rgba(37,99,235,.30)}
  .btn:disabled{opacity:.55; cursor:not-allowed}
  .btn.sub{padding:3px 8px; font-size:11px; border-color:var(--line);
           background:#f8fafc; color:#475569}
  .btn.sub.active{background:#2563eb; color:#fff; border-color:#2563eb}

  .crumb{display:flex; align-items:center; gap:6px; flex-wrap:wrap;
         font-size:12px; color:var(--muted); margin:2px 0 6px; padding:0 4px}
  .crumb b{color:var(--ink); font-weight:600}
  .crumb .chip{background:#e0e7ff; color:#3730a3; border-radius:999px;
               padding:2px 9px; font-weight:600}

  .box{background:var(--surface); border-radius:10px; padding:10px 12px 12px;
       box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .kpis{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px}
  .kpi{background:var(--surface); border-radius:10px; padding:8px 14px; min-width:132px;
       box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .kpi .k{font-size:11px; color:var(--muted)}
  .kpi .v{font-size:19px; font-weight:700; letter-spacing:-.02em}
  .kpi .v.neg{color:#b91c1c}

  .chart-wrap{position:relative; width:100%; height:440px}
  .hint{font-size:11px; color:var(--muted); margin-top:6px}

  table{width:100%; border-collapse:collapse; font-size:12px; margin-top:8px}
  th,td{padding:4px 8px; border-bottom:1px solid var(--line); text-align:right;
        white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted); font-weight:600; border-bottom:1.5px solid #d1d5db}
  td.neg{color:#b91c1c}
  tfoot td{font-weight:700; border-top:1.5px solid #d1d5db}
</style>
</head>
<body>

<h2 id="pageTitle">Profit</h2>

<div class="filter-bar">
  <div id="dimBtns" style="display:flex; gap:5px">
    <button class="btn active" data-dim="customer">Customer</button>
    <button class="btn" data-dim="product">Product</button>
  </div>
  <div class="filter-sep"></div>
  <label>Level:</label>
  <div id="levelBtns" style="display:flex; gap:4px"></div>
  <div class="filter-sep"></div>
  <button id="backBtn" class="btn" title="Undo the last drill-down">&#8592; Back</button>
  <button id="resetBtn" class="btn" title="Back to the view this page opens on">Reset</button>
  <div class="filter-sep"></div>
  <label>Profit:</label>
  <div id="basisBtns" style="display:flex; gap:4px">
    <button class="btn sub" data-basis="ps">Subsidiary</button>
    <button class="btn sub" data-basis="pa">Allocated</button>
  </div>
  <div class="filter-sep"></div>
  <label>Metric:</label>
  <div id="metricBtns" style="display:flex; gap:4px">
    <button class="btn sub active" data-metric="amount">Amount</button>
    <button class="btn sub" data-metric="qty">Qty</button>
  </div>
  <div class="filter-sep"></div>
  <label>Show:</label>
  <div id="topBtns" style="display:flex; gap:4px">
    <button class="btn sub" data-top="10">Top 10</button>
    <button class="btn sub" data-top="20">Top 20</button>
    <button class="btn sub active" data-top="0">All</button>
  </div>
  <div class="filter-sep"></div>
  <button id="tableBtn" class="btn sub">Table</button>
</div>

<div class="crumb" id="crumb"></div>

<div class="kpis" id="kpis"></div>

<div class="box">
  <h3 id="chartTitle">Profit</h3>
  <div class="chart-wrap"><canvas id="profitComboChart"></canvas></div>
  <div class="hint">Click a bar to drill into the next level. Bars are sorted by operating profit.</div>
  <div id="tableBox" hidden></div>
</div>

<script>
const DATA = /*__DATA__*/null;
Chart.register(ChartDataLabels);

/* Chart.js does not resolve CSS variables, so the series colours live here.
   They match the Sales Dashboard's profit chart. */
const C = { net:'#93c5fd', profit:'#fbbf24', profitNeg:'#f87171',
            pct:'#10b981', neg:'#ef4444', qty:'#a5b4fc' };

/* The page opens on the account name the build picked - the online one - with the
   rest still in the file. Back steps out of it, the breadcrumb root jumps to the
   very top, and Reset comes back here. */
const START = (DATA.start && DATA.start.customer) || [];
const state = { dim: 'customer', depth: START.length, path: START.slice(),
                top: 0, table: false,
                basis: DATA.has.ps ? 'ps' : 'pa',   // which operating profit column
                metric: 'amount' };                 // amount | qty
const fmt = n => Math.round(n).toLocaleString();
const pct = n => (n >= 0 ? '' : '') + n.toFixed(1) + '%';

document.getElementById('pageTitle').textContent = DATA.title;

/* Rows kept by the current drill path: path[i] must equal the row's level-i key. */
function slice() {
  const key = state.dim === 'customer' ? 'c' : 'p';
  return DATA.records.filter(r => state.path.every((v, i) => r[key][i] === v));
}

function aggregate() {
  const key = state.dim === 'customer' ? 'c' : 'p';
  const depth = Math.min(state.depth, DATA.levels[state.dim].length - 1);
  const out = new Map();
  for (const r of slice()) {
    const name = r[key][depth] || '(blank)';
    const a = out.get(name) || { name, q: 0, n: 0, ps: 0, pa: 0, cx: r.cx || [] };
    a.q += r.q; a.n += r.n; a.ps += r.ps; a.pa += r.pa;
    out.set(name, a);
  }
  const sortKey = state.metric === 'qty' ? 'q' : state.basis;
  let rows = [...out.values()].sort((a, b) => b[sortKey] - a[sortKey]);
  if (state.top) rows = rows.slice(0, state.top);
  return rows;
}

let chart = null;
function render() {
  const levels = DATA.levels[state.dim];
  state.depth = Math.min(state.depth, levels.length - 1);
  const rows = aggregate();

  /* ── buttons ── */
  document.querySelectorAll('#dimBtns .btn').forEach(b =>
    b.classList.toggle('active', b.dataset.dim === state.dim));
  const lv = document.getElementById('levelBtns');
  lv.innerHTML = '';
  levels.forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'btn sub' + (i === state.depth ? ' active' : '');
    b.textContent = name;
    // A level below the current drill path would show a single bar, so it is
    // only reachable by clicking through - keep it visible but disabled.
    b.disabled = i < state.path.length;
    b.onclick = () => { state.depth = i; render(); };
    lv.appendChild(b);
  });
  document.getElementById('backBtn').disabled = !state.path.length;
  const atStart = state.dim === 'customer'
    && state.path.join('\u0000') === START.join('\u0000')
    && state.depth === START.length;
  document.getElementById('resetBtn').disabled = atStart
    || (state.dim !== 'customer' && !state.path.length && !state.depth);
  document.querySelectorAll('#topBtns .btn').forEach(b =>
    b.classList.toggle('active', +b.dataset.top === state.top));
  document.querySelectorAll('#basisBtns .btn').forEach(b => {
    b.classList.toggle('active', b.dataset.basis === state.basis);
    b.disabled = !DATA.has[b.dataset.basis] || state.metric === 'qty';
    if (DATA.labels[b.dataset.basis]) b.title = DATA.labels[b.dataset.basis];
  });
  document.querySelectorAll('#metricBtns .btn').forEach(b => {
    b.classList.toggle('active', b.dataset.metric === state.metric);
    b.disabled = b.dataset.metric === 'qty' && !DATA.has.q;
  });
  document.getElementById('tableBtn').classList.toggle('active', state.table);

  /* ── breadcrumb ── */
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = `<button class="btn sub" id="rootBtn" title="Show every ${
      state.dim === 'customer' ? 'account name' : 'division'} together">${
      state.dim === 'customer' ? 'Customer' : 'Product'} (all)</button>`;
  state.path.forEach((v, i) => {
    crumb.insertAdjacentHTML('beforeend',
      ` &rsaquo; <span class="chip" title="${levels[i]}">${v}</span>`);
  });
  crumb.insertAdjacentHTML('beforeend',
    ` &rsaquo; by <b>${levels[state.depth]}</b> &middot; ${rows.length} item(s)`);
  document.getElementById('rootBtn').onclick = () => {
    state.path = []; state.depth = 0; render();
  };

  /* ── KPIs ── */
  const tot = rows.reduce((a, r) => ({
    q: a.q + r.q, n: a.n + r.n, ps: a.ps + r.ps, pa: a.pa + r.pa
  }), { q: 0, n: 0, ps: 0, pa: 0 });
  const margin = tot.n !== 0 ? (tot[state.basis] / tot.n) * 100 : 0;
  const basisName = state.basis === 'ps' ? 'Subsidiary' : 'Allocated';
  document.getElementById('kpis').innerHTML = [
    ['Net Sales Qty', fmt(tot.q), ''],
    ['Net Sales', fmt(tot.n), ''],
    ['Op Profit (Subsidiary)', fmt(tot.ps), tot.ps < 0 ? 'neg' : ''],
    ['Op Profit (Allocated)', fmt(tot.pa), tot.pa < 0 ? 'neg' : ''],
    [`Profit % (${basisName})`, pct(margin), margin < 0 ? 'neg' : ''],
  ].map(([k, v, cls]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`
  ).join('');

  document.getElementById('chartTitle').textContent = state.metric === 'qty'
    ? `${DATA.title} — Net Sales Qty by ${levels[state.depth]}`
    : `${DATA.title} — Net Sales and Op Profit (${basisName}) by ${levels[state.depth]}`;

  /* ── chart ── */
  const labels = rows.map(r => r.name);
  const profitVals = rows.map(r => r[state.basis]);
  const profitPct = rows.map(r => (r.n !== 0 ? (r[state.basis] / r.n) * 100 : 0));
  const qtyMode = state.metric === 'qty';

  // Amount view: Net Sales beside Op Profit on the selected basis, with Profit %
  // on the line. Qty view: the quantity alone - a percentage of units means
  // nothing, so the second axis and the line come off.
  const datasets = qtyMode
    ? [{ type: 'bar', label: 'Net Sales Qty', data: rows.map(r => r.q),
         yAxisID: 'y', backgroundColor: C.qty, borderRadius: 4 }]
    : [
        { type: 'bar', label: 'Net Sales', data: rows.map(r => r.n), yAxisID: 'y',
          stack: 'N', backgroundColor: C.net, borderRadius: 4 },
        { type: 'bar', label: `Op Profit (${basisName})`, data: profitVals,
          yAxisID: 'y', stack: 'P', borderRadius: 4,
          backgroundColor: profitVals.map(v => v >= 0 ? C.profit : C.profitNeg) },
        { type: 'line', label: 'Profit %', data: profitPct, yAxisID: 'y1',
          tension: .25, borderWidth: 2, pointRadius: 4, pointHoverRadius: 7,
          fill: false, borderColor: C.pct,
          pointBackgroundColor: profitPct.map(v => v >= 0 ? C.pct : C.neg),
          pointBorderColor: '#fff', pointBorderWidth: 2, order: -1,
          datalabels: {
            align: 'top', anchor: 'end', offset: 4,
            formatter: v => v == null ? '' : v.toFixed(1) + '%',
            font: { weight: 'bold', size: 10 },
            color: ctx => profitPct[ctx.dataIndex] >= 0 ? '#065f46' : '#991b1b',
            backgroundColor: 'rgba(255,255,255,.75)', borderRadius: 3,
            padding: { top: 1, bottom: 1, left: 3, right: 3 }
          } }
      ];

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('profitComboChart'), {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      // Cap the width so a two-category view does not render slab-wide bars.
      datasets: { bar: { categoryPercentage: .85, barPercentage: .95,
                         maxBarThickness: 90 } },
      onClick: (_e, els) => {
        if (!els.length) return;
        const name = labels[els[0].index];
        if (state.depth < levels.length - 1 && state.depth === state.path.length) {
          state.path.push(name);
          state.depth += 1;
          render();
        }
      },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      scales: {
        x: { stacked: true, offset: true,
             ticks: { autoSkip: false, maxRotation: 60, minRotation: 0,
                      callback(v) {
                        const s = this.getLabelForValue(v);
                        return s.length > 22 ? s.slice(0, 21) + '…' : s;
                      } },
             grid: { display: false } },
        y: { beginAtZero: true,
             title: { display: true, text: qtyMode ? 'Quantity' : 'Amount' },
             ticks: { callback: v => Number(v).toLocaleString() },
             grid: { color: '#eef2f7' } },
        y1: { display: !qtyMode, position: 'right',
              suggestedMin: -10, suggestedMax: 10,
              title: { display: true, text: 'Profit %' },
              grid: { drawOnChartArea: false },
              ticks: { callback: v => `${v}%` } }
      },
      plugins: {
        datalabels: { display: ctx => ctx.dataset.type === 'line' },
        legend: { display: true, labels: { boxWidth: 12, boxHeight: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            title: items => items.length ? labels[items[0].dataIndex] : '',
            label: ctx => ctx.dataset.yAxisID === 'y1'
              ? `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}%`
              : `${ctx.dataset.label}: ${Number(ctx.parsed.y || 0).toLocaleString()}`,
            footer: items => {
              const r = rows[items[0].dataIndex];
              return qtyMode ? '' :
                [`Qty: ${fmt(r.q)}`,
                 `Op Profit (Subsidiary): ${fmt(r.ps)}`,
                 `Op Profit (Allocated): ${fmt(r.pa)}`].join('\n');
            }
          }
        }
      }
    }
  });

  /* ── table view (same numbers, for reading and copying) ── */
  const box = document.getElementById('tableBox');
  box.hidden = !state.table;
  if (state.table) {
    // The carried attributes are properties of one account, so they only make
    // sense once the drill is at the deepest customer level.
    const carry = (state.dim === 'customer' && state.depth === levels.length - 1
                   && DATA.carry && DATA.carry.customer) ? DATA.carry.customer : [];
    box.innerHTML = `<table><thead><tr>
        <th>${levels[state.depth]}</th>${carry.map(c => `<th style="text-align:left">${c}</th>`).join('')}<th>Qty</th><th>Net Sales</th>
        <th>Op Profit (Sub)</th><th>Op Profit (Alloc)</th>
        <th>Profit % (${basisName})</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr>
        <td title="${r.name}">${r.name}</td>${
          carry.map((_, ci) => `<td style="text-align:left">${(r.cx && r.cx[ci]) || ''}</td>`).join('')
        }<td>${fmt(r.q)}</td><td>${fmt(r.n)}</td>
        <td class="${r.ps < 0 ? 'neg' : ''}">${fmt(r.ps)}</td>
        <td class="${r.pa < 0 ? 'neg' : ''}">${fmt(r.pa)}</td>
        <td class="${profitPct[i] < 0 ? 'neg' : ''}">${pct(profitPct[i])}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td>${carry.map(() => '<td></td>').join('')}<td>${fmt(tot.q)}</td><td>${fmt(tot.n)}</td>
        <td class="${tot.ps < 0 ? 'neg' : ''}">${fmt(tot.ps)}</td>
        <td class="${tot.pa < 0 ? 'neg' : ''}">${fmt(tot.pa)}</td>
        <td class="${margin < 0 ? 'neg' : ''}">${pct(margin)}</td></tr></tfoot></table>`;
  }
}

document.querySelectorAll('#dimBtns .btn').forEach(b => b.onclick = () => {
  state.dim = b.dataset.dim;
  state.path = state.dim === 'customer' ? START.slice() : [];
  state.depth = state.path.length;
  render();
});
document.querySelectorAll('#topBtns .btn').forEach(b => b.onclick = () => {
  state.top = +b.dataset.top; render();
});
document.getElementById('backBtn').onclick = () => {
  if (state.path.length) { state.path.pop(); state.depth = state.path.length; render(); }
};
document.getElementById('resetBtn').onclick = () => {
  state.path = state.dim === 'customer' ? START.slice() : [];
  state.depth = state.path.length;
  render();
};
document.querySelectorAll('#basisBtns .btn').forEach(b => b.onclick = () => {
  state.basis = b.dataset.basis; render();
});
document.querySelectorAll('#metricBtns .btn').forEach(b => b.onclick = () => {
  state.metric = b.dataset.metric; render();
});
document.getElementById('tableBtn').onclick = () => { state.table = !state.table; render(); };

render();
</script>
</body>
</html>
