<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f5f7; --surface: #fcfcfb; --line: #e3e4e8; --grid: #ecedf1;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #83827d;
  --accent: #2a78d6; --accent-ink: #ffffff; --chip: #ffffff; --neg: #d14343;
  /* A fixed hue per figure, never by rank, so a filter that drops a member
     cannot repaint the rest. */
  --c-gross: #2a78d6; --c-deduction: #eb6834; --c-cogs: #1baf7a;
  --c-opex: #eda100; --c-profit: #4a3aa7;
  /* Stack slots, in a fixed order. A ninth member folds into Other rather
     than being handed a generated hue. */
  --k1:#2a78d6; --k2:#eb6834; --k3:#1baf7a; --k4:#eda100;
  --k5:#e87ba4; --k6:#008300; --k7:#4a3aa7; --k8:#e34948; --k9:#a9a8a1;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #111110; --surface: #1a1a19; --line: #343431; --grid: #2a2a28;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8e85;
    --accent: #3987e5; --accent-ink: #0b0b0b; --chip: #232321; --neg: #f08a7a;
    --c-gross: #3987e5; --c-deduction: #d95926; --c-cogs: #199e70;
    --c-opex: #c98500; --c-profit: #9085e9;
    --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
    --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767; --k9:#6b6a64;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111110; --surface: #1a1a19; --line: #343431; --grid: #2a2a28;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8e85;
  --accent: #3987e5; --accent-ink: #0b0b0b; --chip: #232321; --neg: #f08a7a;
  --c-gross: #3987e5; --c-deduction: #d95926; --c-cogs: #199e70;
  --c-opex: #c98500; --c-profit: #9085e9;
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
  --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767; --k9:#6b6a64;
}
* { box-sizing: border-box; }
/* label.f sets display, which a class selector wins with over the browser's own
   [hidden] rule - so a hidden control would otherwise stay on screen. */
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "Malgun Gothic", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 2px; }
.sub { color: var(--ink-3); font-size: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11px;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
label.f.off > span { color: var(--ink-3); opacity: .55; }
select, .btn { font: inherit; color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
select { min-width: 140px; max-width: 220px; }
select:disabled { opacity: .5; }
.btn { cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.active { background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); }
/* "All" is where a level starts, so it is marked as current without being
   marked as a choice - otherwise an untouched page reads as eight selections. */
.btn.on { background: var(--grid); color: var(--ink-2); font-weight: 600; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; margin-left: -1px; }
.seg .btn:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg .btn:last-child { border-radius: 0 7px 7px 0; }
.scope { font-size: 12px; color: var(--ink-3); margin: 10px 0 0; }
/* A chain is one line: its levels in order, each a name and its members. The
   members are joined into a block so a level reads as one control and four of
   them fit across, rather than taking four rows of their own. */
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
  padding: 6px 0; }
.chain + .chain { border-top: 1px solid var(--grid); }
.chainName { flex: none; width: 60px; font-size: 11px; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .04em; }
.lv { display: inline-flex; align-items: center; gap: 7px; }
.lvName { background: none; border: 0; border-bottom: 2px solid transparent;
  cursor: pointer; font: inherit; font-size: 11px; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .04em; padding: 2px 0;
  white-space: nowrap; }
.lvName:hover { color: var(--accent); }
.lvName.on { color: var(--accent); font-weight: 700;
  border-bottom-color: var(--accent); }
.lvName.off { opacity: .5; }
.vals .btn { padding: 3px 9px; font-size: 13px; }
/* A level with too many members to line up gets a search box instead. */
.lv { position: relative; }
.pickBtn { max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.pickBtn::after { content: " \25be"; color: var(--ink-3); }
.pop { position: absolute; z-index: 30; top: calc(100% + 5px); left: 0;
  min-width: 240px; padding: 8px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 9px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .22); }
.pop.right { left: auto; right: 0; }
.pop input { width: 100%; font: inherit; font-size: 13px; padding: 6px 8px;
  color: var(--ink); background: var(--chip); border: 1px solid var(--line);
  border-radius: 6px; }
.pop input:focus { outline: none; border-color: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 1px; margin-top: 6px;
  max-height: 264px; overflow: auto; }
.opt { font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  color: var(--ink); background: none; border: 0; border-radius: 6px;
  padding: 5px 8px; white-space: nowrap; }
.opt:hover, .opt.cur { background: var(--grid); }
.opt.active { color: var(--accent); font-weight: 650; }
.opt b { color: var(--accent); font-weight: 700; }
.pop .none { font-size: 12px; color: var(--ink-3); padding: 7px 8px 3px; }
/* The view switches run beside their captions rather than under them - stacked,
   they cost the menu a line of height for every control. */
.bar { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 11px;
  gap: 7px 14px; align-items: center; }
.bar label.f { flex-direction: row; align-items: center; gap: 7px; }
.bar .btn { padding: 4px 9px; font-size: 13px; }
.bar .vals { display: inline-flex; }
.crumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  font-size: 13px; margin-bottom: 12px; }
.crumb button { background: none; border: 0; color: var(--accent);
  cursor: pointer; font: inherit; padding: 2px 5px; border-radius: 5px; }
.crumb button:hover { background: var(--grid); }
.crumb .sep { color: var(--ink-3); }
.crumb .now { font-weight: 600; padding: 2px 5px; }
.note { font-style: normal; font-size: 10px; color: var(--ink-3);
  text-transform: none; letter-spacing: 0; max-width: 220px; }
.scope b { color: var(--ink-2); font-weight: 600; }
.kpis { display: flex; flex-wrap: wrap; gap: 10px; margin: 2px 0 14px; }
.kpi { flex: 1 1 130px; background: var(--chip); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; }
.kpi .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase;
  letter-spacing: .04em; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.kpi .v { font-size: 19px; font-weight: 650; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; }
.kpi .v.neg { color: var(--neg); }
/* The month's profit split by where the order behind it came from. A table
   rather than more KPI tiles: the rows add up, and a reader has to be able to
   see that they add up to the export's own total. */
.split { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; }
.split table { width: 100%; border-collapse: collapse; font-size: 13px; }
.split caption { text-align: left; font-size: 11px; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px 6px;
  background: var(--chip); }
.split caption em { font-style: normal; text-transform: none; letter-spacing: 0;
  color: var(--ink-3); }
.split th, .split td { padding: 5px 12px; text-align: right;
  font-variant-numeric: tabular-nums; }
.split th { font-weight: 500; font-size: 11px; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .04em; }
.split th:first-child, .split td:first-child { text-align: left; }
.split td.v { font-weight: 600; }
.split td.neg { color: var(--neg); }
.split tr.sum td { border-top: 1px solid var(--line); font-weight: 700; }
.split tr.sum td:first-child { font-weight: 600; }
.split .why { color: var(--ink-3); font-size: 11px; padding: 6px 12px 9px;
  line-height: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px;
  color: var(--ink-2); margin-bottom: 8px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block;
  margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; height: 420px; }
/* The chart's own controls. Back is in the menu too, but by the time you have
   drilled three levels the menu is a long way from the bar you just clicked,
   and the step back belongs next to the step in.

   They sit on the legend's row rather than over the plot: inside the plot they
   covered whatever the top of the chart happened to be - a tall bar's label, a
   point on the profit line - and which number got hidden depended on the data. */
/* P&L is a view of its own, not one of the figures: it draws the whole
   statement and has no split, so Stack by and Figure say nothing about it.
   Standing a little apart from them is the menu saying as much. */
.btn.apart { margin-right: 10px; }
.chartHead { display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; }
.chartHead .legend { flex: 1 1 auto; }
.tools { flex: 0 0 auto; display: flex; gap: 4px; }
.ctl { font: inherit; font-size: 12px; line-height: 1; padding: 5px 8px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
  color: var(--ink-2); cursor: pointer; }
.ctl:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
.ctl:disabled { opacity: .35; cursor: default; }
/* Zoomed: the card takes the window and everything else stands down, so one
   chart gets the whole screen rather than a bigger share of a crowded page. */
body.zoomed > .wrap > *:not(.card.zoom) { display: none; }
.card.zoom { position: fixed; inset: 10px; z-index: 50; margin: 0;
  overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.card.zoom .chart { height: calc(100vh - 160px) !important; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px;
  font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--grid);
  text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
thead th { color: var(--ink-3); font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .04em; }
td.neg { color: var(--neg); }
tfoot td { font-weight: 650; border-top: 1px solid var(--line); border-bottom: 0; }
@media (max-width: 640px) {
  select { min-width: 0; width: 100%; } label.f { flex: 1 1 100%; }
  .chart { height: 340px; }
  .chainName { width: auto; flex: 1 1 100%; }
  /* Joined corners are not worth a sideways scrollbar on a phone. */
  .seg { flex-wrap: wrap; gap: 5px; }
  .seg .btn, .seg .btn:first-child, .seg .btn:last-child {
    border-radius: 7px; margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">Profit</h1>
  <div class="sub" id="pageSub"></div>

  <!-- One menu for the page: the levels, then how they are drawn. -->
  <div class="card">
    <div class="crumb" id="crumb"></div>
    <div id="filters"></div>
    <div class="row bar">
      <button class="btn" id="backBtn">&larr; Back</button>
      <button class="btn apart" id="pnlBtn" title="the whole statement: what came in beside what it went out on. It has no split, so Stack by and Figure do not apply to it">P&amp;L</button>
      <label class="f" id="stackBox"><span>Stack by</span><span class="seg">
        <button class="btn" id="stkCust">Customer</button
        ><button class="btn" id="stkProd">Product</button
        ><button class="btn" id="stkOrd" title="when the order behind the revenue was placed - this month's own, or the month before's">When ordered</button></span></label>
      <label class="f" id="figBox"><span>Figure</span>
        <span class="vals" id="stkFig"></span></label>
      <label class="f" id="periodBox"><span>Period</span><span class="seg">
        <button class="btn" id="perMonth">Month</button
        ><button class="btn" id="perQtr">Quarter</button
        ><button class="btn" id="perYear">Year</button></span></label>
      <button class="btn" id="cumulBtn" title="each bar is the running total up to and including it, so the last bar is the whole span">Cumulative</button>
      <label class="f" id="scaleBox"><span>Scale</span><span class="seg">
        <button class="btn" id="stkAmt">Amount</button
        ><button class="btn" id="stkPct">% of bar</button></span></label>
      <button class="btn" id="tableBtn">Table</button>
      <button class="btn" id="resetBtn">Reset</button>
    </div>
    <div class="scope" id="scope"></div>
  </div>

  <div class="card" id="stkCard">
    <div class="chartHead">
      <div class="legend" id="stkLegend"></div>
      <div class="tools">
        <button class="ctl" id="stkBack" title="Widen the deepest narrowing">&larr; Back</button>
        <button class="ctl" id="stkZoom" title="Show only this chart, with every value labelled">&#x2921; Expand</button>
      </div>
    </div>
    <div class="chart" id="stkPlot"><canvas id="stkBars"></canvas></div>
    <div class="hint" id="stkHint"></div>
  </div>

  <div class="card">
    <div class="kpis" id="kpis"></div>
    <div class="split" id="split" hidden></div>
  </div>

  <div class="card" id="tableCard" hidden><div id="tableBox"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
/* Every month the build found, each a complete payload of its own, and then
   one dataset made of all of them.

   The months arrive separate because each was read from its own export, with
   its own customers, its own products and its own column positions. They are
   joined here rather than in the build because the join is by **name**: a
   customer is the same customer in two months when it is spelled the same, and
   a figure is the same figure when its key is. Index 3 in August's Division
   list is not index 3 in February's, so nothing is matched on position.

   What comes out carries the month on every combination, which is what lets the
   chart put time on the x axis and still answer every filter the page has. */
const ALL = /*__DATA__*/null;

function unify(months) {
  // The figures, by key. A month that is missing one contributes nothing to it
  // rather than shifting everything after it along.
  const series = [];
  const sAt = new Map();
  months.forEach(m => m.series.forEach(s => {
    if (!sAt.has(s.key)) { sAt.set(s.key, series.length); series.push(s); }
  }));

  // The levels, by name, and each level's members by name. The widest month
  // decides the shape; a month short of a level simply has no rows under it.
  const shape = months.reduce((a, m) => (m.levels.length > a.levels.length ? m : a),
                              months[0]);
  const levels = shape.levels.map(lv => ({ name: lv.name, values: [] }));
  const vAt = levels.map(() => new Map());
  months.forEach(m => m.levels.forEach((lv, i) => {
    if (i >= levels.length) return;
    lv.values.forEach(v => {
      if (!vAt[i].has(v)) { vAt[i].set(v, levels[i].values.length);
                            levels[i].values.push(v); }
    });
  }));

  const combos = [];
  months.forEach((m, mi) => {
    const kmap = m.levels.map((lv, i) => lv.values.map(v => vAt[i].get(v)));
    const smap = m.series.map(s => sAt.get(s.key));
    const blank = levels.map((lv, i) => {
      // A month without this level reads as the placeholder, which is what the
      // build writes for a row the master could not place.
      let j = vAt[i].get('(blank)');
      if (j === undefined) { j = levels[i].values.length;
                             vAt[i].set('(blank)', j); levels[i].values.push('(blank)'); }
      return j;
    });
    m.combos.forEach(c => {
      const v = new Array(series.length).fill(0);
      c.v.forEach((x, j) => { v[smap[j]] += x; });
      const k = levels.map((lv, i) => (i < c.k.length ? kmap[i][c.k[i]] : blank[i]));
      combos.push({ m: mi, k, v, n: c.n });
    });
  });

  return {
    levels, series, combos,
    months: months.map(m => ({ ym: m.ym, label: m.month, file: m.file,
                               carryIn: !!m.carryIn })),
    custDepth: shape.custDepth,
    file: months.length === 1 ? months[0].file
          : `${months.length} exports, ${months[0].file} .. ${months[months.length - 1].file}`,
    rows: months.reduce((a, m) => a + m.rows, 0),
    title: months.length === 1 ? months[0].title
           : `${months[0].month} - ${months[months.length - 1].month} Profit`,
    // A month knows its carry-in when the month before it was read. The first
    // month in a folder never does, so requiring all of them would switch the
    // split off permanently; the page offers it when any month has it, and the
    // ones that do not are left empty rather than drawn as nil - which would
    // claim they earned everything themselves.
    carryIn: months.some(m => m.carryIn),
    start: (() => {
      const want = shape.start >= 0 ? shape.levels[0].values[shape.start] : null;
      return want === null ? -1 : vAt[0].get(want) ?? -1;
    })(),
  };
}

let DATA = unify(ALL.months);

/* Chart.js cannot resolve a custom property, so the series colours are read off
   the stylesheet once per render - that way light and dark live in one place. */
const css = n => getComputedStyle(document.documentElement)
                   .getPropertyValue(n).trim();
const defer = fn => setTimeout(fn, 0);
let C = {};
function readColours() {
  C = { ink: css('--ink'), ink2: css('--ink-2'), ink3: css('--ink-3'),
        grid: css('--grid'), surface: css('--surface'), neg: css('--neg'),
        gross: css('--c-gross'), deduction: css('--c-deduction'),
        cogs: css('--c-cogs'), opex: css('--c-opex'), profit: css('--c-profit'),
        stack: [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => css('--k' + n)) };
}

/* A colour at partial strength, for a mark that has to be present without
   competing. Hex in, rgba out; anything else is handed back as it came, since
   a colour we cannot read is better left alone than guessed at. */
function fade(colour, a) {
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec((colour || '').trim());
  if (!m) return colour;
  const h = m[1].length === 3 ? m[1].replace(/./g, c => c + c) : m[1];
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

const fmt = n => Math.round(n).toLocaleString();
/* A per-unit figure is a price, so it keeps its cents. */
const unitFmt = n => n.toLocaleString(undefined, { minimumFractionDigits: 2,
                                                   maximumFractionDigits: 2 });
/* Figures are amounts. Per unit was a mode on every chart; it is one tile now -
   ASP, in the row under the menu - because that is the only per-unit figure
   anyone read off it, and a mode you have to remember you are in costs more
   than the one number it was carrying. */
const each = (r, key) => r[key];
let has = {};
let COSTS = [];
let CHAINS = { customer: [], product: [] };
const label = k => (has[k] === undefined ? k : DATA.series[has[k]].label);

/* Everything read off the payload, recomputed when the payload changes. */
function rebind() {
  has = {};
  DATA.series.forEach((s, i) => { has[s.key] = i; });
  COSTS = ['deduction', 'cogs', 'opex'].filter(k => has[k] !== undefined);
  // The two chains the page drills: the customer levels, then the product ones.
  // A chain stacks the level below whichever one the bars are on.
  CHAINS = {
    customer: DATA.levels.map((_, i) => i).filter(i => i < DATA.custDepth),
    product:  DATA.levels.map((_, i) => i).filter(i => i >= DATA.custDepth),
  };
}

/* The page opens on one channel - the online business - with everything else
   still in the file. Setting Channel back to All steps up and brings it in. */
const state = {
  filter: [],
  dim: 0,
  table: false,
  // Which chain the chart splits each bar by, and what it draws: the whole
  // statement, the money, or the units. It opens on the statement, which is
  // the page's title.
  stack: 'customer',
  // The whole statement, which the page opens on. Not a figure - it has no
  // split, so neither Stack by nor Figure applies while it is on.
  pnl: true,
  stkFig: 'net',
  // 'amount' compares sizes between bars; 'pct' normalises every bar to 100%
  // and compares the mix inside them, which a tall bar otherwise drowns out.
  stkScale: 'amount',
  // How wide a bar is: one month, one quarter, one year. Nothing else changes -
  // the same slice, the same split, the same figure, summed into fewer columns.
  period: 'month',
  // Running totals across the columns. A different question from a wider
  // bucket - how the year is tracking, rather than how big each piece is - so
  // it is a toggle beside Period rather than another period.
  cumul: false,
  // Which chart, if any, has the window to itself. Expanding is also what
  // turns the per-bar numbers on: that is the room they need.
  zoom: null,
};

/* Where the drill starts: one channel - the online business - with everything
   else still in the file. Setting Channel back to All steps up and brings it
   in. Called afresh for each month, since the levels are that month's. */
/* The level each month's bar is split by.

   The x axis is time now, so a level is no longer something the bars sit on -
   it is what the bar is cut into. state.dim is the one the reader asked for;
   where that has been narrowed to a single value, or belongs to the other
   chain, the first level of the chosen chain that is still open takes over, so
   the split always shows something rather than one undivided bar. */
function splitLevel() {
  const chain = CHAINS[state.stack] || [];
  if (chain.includes(state.dim) && state.filter[state.dim] < 0) return state.dim;
  const at = chain.find(i => state.filter[i] < 0);
  return at === undefined ? null : at;
}

function startHere() {
  state.filter = DATA.levels.map((_, i) => (i === 0 ? DATA.start : -1));
  state.dim = DATA.levels.length > 1 ? 1 : 0;
}

/* The order half of a combination, when the build found an order export.
   These are counts of what was ordered, so the basis never scales them. */
const ORDERED = ['oqty', 'oamt', 'iqty', 'iamt', 'xqty', 'xamt'];
const hasOrders = () => has.oqty !== undefined;
const scaled = m => !ORDERED.some(k => has[k] === m);

/* Where the month's units came from and where they go, per combination:

     booked      left in this month, ordered in this month - its own demand
     carried in  left in this month, ordered before it
     carried out ordered in this month, leaves after it

   so the month's revenue is booked + carried in, and the month's own demand is
   booked + carried out.

   Where SAP's sales-order export is there, none of that is inferred: the export
   carries a despatch date, so the month a unit earned in is read rather than
   argued for, and it carries the payer, so a line lands on one customer at full
   depth. Where it is not, the store export stands in and the months come from
   its statuses instead - which `tools/cohort.py` scores, and `docs/DESPATCH.md`
   compares against the measured answer. The build says which it used.

   A cancelled or rejected order is in none of the three. */
/* The basis chose which slice of the month to keep - what last month sent here,
   what this month sends on. It is off the menu now: the profit split above the
   chart prints all three at once, which is what it was being used to read, and
   one number beats a mode you have to remember you are in. basisOf() stays and
   returns 1, so nothing downstream has to know. */
const bookedOf = c => c.v[has.oqty];
const cameIn = c => c.v[has.iqty];
const goesOut = c => c.v[has.xqty];

/* Which month's business a combination belongs to.

   Nothing joins a sale to the order it came from - that link was never
   exported - so a basis other than Sales is a share of each key rather than a
   set of rows. The share comes from the model above:

     Sales    the month as the profit file reports it
     Own      booked / (booked + carried in)
              strip out what the month before handed over, and what is left is
              the revenue this month's own orders earned
     Demand   (booked + carried out) / (booked + carried in)
              what this month's orders will earn in the end, the unshipped part
              priced at the same per-unit rates

   The multiplier is one number per key, which holds exactly as far as the units
   of one key being worth the same as each other - the assumption the per-unit
   view already runs on. Both ratios are modelled over modelled, so the fit the
   model has against the month does not leak into the figures; what it changes
   is the mix, which is the whole point of asking.

   A key the orders never reached weighs nothing, and the build says how much of
   the month that leaves out. */
const basisOf = () => 1;

/* How the two counts of a slice overlap. The minimum is taken per key and then
   added up, never the other way round: one product shipping more than it sold
   cannot be allowed to cover another selling more than it shipped. */
function orderSplit(extra) {
  const o = { booked: 0, came: 0, goes: 0, sold: 0, soldAmt: 0, ordAmt: 0,
              ownGross: 0, ownNet: 0, ownProfit: 0,
              inGross: 0, inNet: 0, inProfit: 0,
              goesGross: 0, goesNet: 0, goesProfit: 0,
              totGross: 0, totNet: 0, totProfit: 0,
              otherGross: 0, otherNet: 0, otherProfit: 0 };
  if (!hasOrders()) return o;
  for (const c of DATA.combos) {
    if (!inSlice(c, extra)) continue;
    o.booked += bookedOf(c);
    o.came += cameIn(c);
    o.goes += goesOut(c);
    o.sold += Math.abs(has.qty === undefined ? 0 : c.v[has.qty]);
    o.soldAmt += has.net === undefined ? 0 : c.v[has.net];
    o.ordAmt += c.v[has.oamt] + c.v[has.xamt];
    // The money each slice earned, on the same share of units the basis uses -
    // so the carry-over's own profit is a figure on the page rather than
    // something to go and switch Basis for.
    const at = k => (has[k] === undefined ? 0 : c.v[has[k]]);
    // The slice's own total, summed straight off the profit export with no
    // share applied. This is the figure that has to hold: whatever the split
    // does, the three parts add back to the number the file reports.
    o.totGross += at('gross');
    o.totNet += at('net');
    o.totProfit += at('profit');
    const month = bookedOf(c) + cameIn(c);
    if (month) {
      const own = bookedOf(c) / month;
      const inn = cameIn(c) / month;
      o.ownGross += at('gross') * own;
      o.ownNet += at('net') * own;
      o.ownProfit += at('profit') * own;
      o.inGross += at('gross') * inn;
      o.inNet += at('net') * inn;
      o.inProfit += at('profit') * inn;
      // The carry-out at this month's rates. Those units have not been sold,
      // so this is a projection and never part of any total - it is here so
      // the orders chart can be drawn in money instead of units.
      const out = goesOut(c) / month;
      o.goesGross += at('gross') * out;
      o.goesNet += at('net') * out;
      o.goesProfit += at('profit') * out;
    }
  }
  // Everything the split could not place: a sale whose product and customer
  // carry no order at all - an offline row, a marketplace, a code the two
  // files spell differently. It is the residual rather than a figure of its
  // own, so the total stays exactly the profit export's and any drift lands
  // here instead of in the number anyone quotes.
  o.otherGross = o.totGross - o.ownGross - o.inGross;
  o.otherNet = o.totNet - o.ownNet - o.inNet;
  o.otherProfit = o.totProfit - o.ownProfit - o.inProfit;
  o.month = o.booked + o.came;        // what the model says the month earned
  o.demand = o.booked + o.goes;       // what the month's own orders will earn
  return o;
}

/* Every combination of the filter values was totalled at build time, so a
   filter change is a sum over the matching combinations rather than a pass over
   the rows. */
function inSlice(c, extra) {
  // `extra` narrows one more thing than the filters do, without touching them:
  // a level's value, or a month. It is how a chart asks for one column.
  if (extra && extra.month !== undefined && c.m !== extra.month) return false;
  for (let i = 0; i < state.filter.length; i++) {
    const want = extra && extra.level === i ? extra.value : state.filter[i];
    if (want >= 0 && c.k[i] !== want) return false;
  }
  return true;
}

function totals(extra) {
  const v = new Float64Array(DATA.series.length);
  let rows = 0;
  for (const c of DATA.combos) {
    if (!inSlice(c, extra)) continue;
    const f = basisOf(c);
    rows += f ? c.n : 0;
    for (let m = 0; m < v.length; m++) v[m] += c.v[m] * (scaled(m) ? f : 1);
  }
  const at = k => (has[k] === undefined ? 0 : v[has[k]]);
  const profit = at('profit');
  const net = has.net !== undefined ? at('net') : at('gross');
  const qty = Math.abs(at('qty'));
  return { rows, gross: at('gross'), deduction: Math.abs(at('deduction')),
           cogs: Math.abs(at('cogs')), opex: Math.abs(at('opex')),
           profit, net, qty,
           // ASP is the weighted price: the totals divided, never the average
           // of each row's own price.
           asp: qty ? net / qty : null,
           margin: net ? (profit / net) * 100 : null };
}

/* Which values a level can still offer, given the levels above it in the same
   group - picking a Type should not leave Type2 listing other types' values. */
function optionsFor(level) {
  const group = level < DATA.custDepth ? [0, DATA.custDepth] : [DATA.custDepth,
                                                                DATA.levels.length];
  const seen = new Set();
  for (const c of DATA.combos) {
    let ok = true;
    for (let i = group[0]; i < level; i++) {
      if (state.filter[i] >= 0 && c.k[i] !== state.filter[i]) { ok = false; break; }
    }
    if (ok) seen.add(c.k[level]);
  }
  return seen;
}

/* Where a level has no value for a row the build writes a placeholder in
   brackets - (blank), (no customer match). They are somewhere to put the money,
   not somewhere to go, so they stay off the menu unless one is already what is
   being shown. The rows behind them are still in every total, and still turn up
   as a bar and as a slice of a stack. `--find` and `--where` chase them down. */
const PLACEHOLDER = /^\(.*\)$/;
const offerable = (lv, j, picked) =>
  picked === j || !PLACEHOLDER.test(lv.values[j]);

/* Searching a long level, loosely on purpose. These lists are zero-padded keys
   and half-remembered names, so a strict substring would miss "23" in SKU023 and
   "galaxy s" in "GALAXY-S 24". Every tier is an accent of the same idea, and the
   tier a value matched on is what ranks it - exact first, a guess last.

   Terms are ANDed: typing two words means both, in any order. A term nothing
   matches drops the value, so narrowing always narrows. */
const searchNorm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '');
const dropPad = s => s.replace(/0+(\d)/g, '$1');   // SKU023 and SKU23 are one key

function subseq(hay, needle) {
  let i = 0;
  for (const ch of hay) if (ch === needle[i] && ++i === needle.length) return true;
  return false;
}

/* The tier a value matches on, or null for no match at all. */
function looseScore(value, query) {
  const terms = query.split(/\s+/).map(searchNorm).filter(Boolean);
  if (!terms.length) return 0;
  const v = searchNorm(value);
  const vz = dropPad(v);
  let tier = 0;
  for (const t of terms) {
    const tz = dropPad(t);
    const s = v === t ? 1
            : v.startsWith(t) ? 2
            : v.includes(t) ? 3
            : vz.includes(tz) ? 4
            // A subsequence is the loosest reading there is, so it takes three
            // characters to ask for - below that it matches half the file.
            : (tz.length >= 3 && subseq(vz, tz)) ? 5
            : null;
    if (s === null) return null;
    tier = Math.max(tier, s);
  }
  return tier;
}

/* One open picker at a time, and it closes on anything that is not itself. */
let openPop = null;
function closePicker() {
  if (openPop) { openPop.remove(); openPop = null; }
}
document.addEventListener('mousedown', e => {
  if (openPop && !openPop.contains(e.target)
      && !e.target.classList.contains('pickBtn')) closePicker();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePicker();
});

function picker(i, lv, seen) {
  const wrap = document.createElement('div');
  const picked = state.filter[i];
  const btn = document.createElement('button');
  btn.className = 'btn pickBtn' + (picked >= 0 ? ' active' : ' on');
  btn.textContent = picked >= 0 ? lv.values[picked] : `All (${seen.size})`;
  btn.title = `Search ${seen.size} ${lv.name.toLowerCase()} values`;
  wrap.appendChild(btn);

  btn.onclick = () => {
    const wasMine = openPop && openPop.parentNode === wrap;
    closePicker();
    if (wasMine) return;                       // a second click just closes it

    const pop = document.createElement('div');
    pop.className = 'pop';
    const find = document.createElement('input');
    find.placeholder = `Search ${lv.name.toLowerCase()}`;
    find.autocomplete = 'off';
    const opts = document.createElement('div');
    opts.className = 'opts';
    const none = document.createElement('div');
    none.className = 'none';
    none.hidden = true;
    pop.append(find, none, opts);
    wrap.appendChild(pop);
    openPop = pop;

    // A picker on the last level of a chain sits at the right-hand edge, where
    // a popup hung from its left corner would run off the page.
    if (pop.getBoundingClientRect().right > window.innerWidth - 8) {
      pop.classList.add('right');
    }

    let rows = [];
    const draw = () => {
      const q = find.value.trim();
      rows = [...seen]
        .map(j => ({ j, tier: looseScore(lv.values[j], q) }))
        .filter(r => r.tier !== null)
        .sort((a, b) => a.tier - b.tier || a.j - b.j);
      if (!q) rows.unshift({ j: -1, tier: 0 });   // All, only when not searching
      opts.innerHTML = '';
      rows.forEach((r, n) => {
        const o = document.createElement('button');
        o.className = 'opt' + (picked === r.j ? ' active' : '')
                            + (n === 0 && q ? ' cur' : '');
        o.innerHTML = r.j < 0 ? `All (${seen.size})` : mark(lv.values[r.j], q);
        o.onclick = () => { closePicker(); setFilter(i, r.j); };
        opts.appendChild(o);
      });
      none.hidden = rows.length > 0;
      none.textContent = `Nothing here matches "${q}"`;
    };

    find.oninput = draw;
    find.onkeydown = e => {
      const cur = opts.querySelector('.cur');
      if (e.key === 'Enter') {
        (cur || opts.firstElementChild)?.click();
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const list = [...opts.children];
        const at = cur ? list.indexOf(cur) : -1;
        const to = Math.max(0, Math.min(list.length - 1,
                                        at + (e.key === 'ArrowDown' ? 1 : -1)));
        list.forEach(x => x.classList.remove('cur'));
        list[to]?.classList.add('cur');
        list[to]?.scrollIntoView({ block: 'nearest' });
      } else { return; }
      e.preventDefault();
    };
    draw();
    find.focus();
  };
  return wrap;
}

/* The part of a value the search caught, so a loose hit shows why it is a hit. */
function mark(value, query) {
  const esc = t => t.replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const terms = query.split(/\s+/).map(searchNorm).filter(Boolean);
  if (!terms.length) return esc(value);
  // Walk the raw value and the normalised one together, so the highlight lands
  // on the characters the user actually sees, punctuation and all.
  const map = [];
  let norm = '';
  [...value].forEach((ch, n) => {
    const c = searchNorm(ch);
    if (c) { norm += c; map.push(n); }
  });
  const hit = new Set();
  for (const t of terms) {
    let from = 0, at;
    while ((at = norm.indexOf(t, from)) >= 0) {
      for (let k = at; k < at + t.length; k++) hit.add(map[k]);
      from = at + 1;
    }
  }
  if (!hit.size) return esc(value);
  // One tag per run rather than one per character.
  let out = '', on = false;
  [...value].forEach((ch, n) => {
    const want = hit.has(n);
    if (want !== on) { out += want ? '<b>' : '</b>'; on = want; }
    out += esc(ch);
  });
  return out + (on ? '</b>' : '');
}

/* Narrowing to a value moves the bars down to the next level; widening back to
   All brings them up again. A click on a bar and a change of a select are the
   same act, so they go through here. */
function setFilter(i, v) {
  state.filter[i] = v;
  // Narrowing to one value leaves nothing to split by at that level, so the
  // split steps on to the next open one in the same chain; widening steps back.
  const chain = (i < DATA.custDepth ? CHAINS.customer : CHAINS.product);
  if (v >= 0) {
    state.stack = i < DATA.custDepth ? 'customer' : 'product';
    const next = chain.find(j => j > i && state.filter[j] < 0);
    if (next !== undefined) state.dim = next;
  } else if (state.dim > i && chain.includes(state.dim)) {
    state.dim = i;
  }
  render();
}

/* One row per level: the name puts the bars on it, the members narrow to one.
   The rows run in hierarchy order and each only offers what the levels above it
   leave available, so the buttons read as the tree they come from.

   A level with more members than fit on a row keeps a select - Range and SKU
   are lists to search, not rows to scan. */
const BTN_MAX = 8;
function buildFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  [['Customer', CHAINS.customer], ['Product', CHAINS.product]]
    .filter(([, ids]) => ids.length)
    .forEach(([chainName, ids]) => {
      const chain = document.createElement('div');
      chain.className = 'chain';
      chain.innerHTML = `<span class="chainName">${chainName}</span>`;
      ids.forEach(i => chain.appendChild(levelCell(i)));
      box.appendChild(chain);
    });
}

function levelCell(i) {
  const lv = DATA.levels[i];
  const all = optionsFor(i);
  if (state.filter[i] >= 0 && !all.has(state.filter[i])) state.filter[i] = -1;
  const picked = state.filter[i];
  const seen = new Set([...all].filter(j => offerable(lv, j, picked)));
  const cell = document.createElement('div');
  cell.className = 'lv';

  const name = document.createElement('button');
  name.className = 'lvName' + (state.dim === i ? ' on' : '')
                 + (seen.size <= 1 ? ' off' : '');
  name.textContent = lv.name;
  name.title = state.dim === i ? `The bars are split by ${lv.name}`
                               : `Split each month by ${lv.name}`;
  name.onclick = () => {
    state.dim = i;
    // The chart splits by one chain at a time, so asking for a level asks for
    // its chain too. Splitting by a level means not having narrowed to one of
    // its values, nor to anything under it.
    state.stack = i < DATA.custDepth ? 'customer' : 'product';
    for (let j = i; j < state.filter.length; j++) state.filter[j] = -1;
    render();
  };
  cell.appendChild(name);

  const vals = document.createElement('div');
  vals.className = 'vals' + (seen.size > BTN_MAX ? '' : ' seg');
  if (seen.size > BTN_MAX) {
    vals.appendChild(picker(i, lv, seen));
  } else {
    const add = (text, v, title) => {
      const b = document.createElement('button');
      b.className = 'btn' + (state.filter[i] !== v ? ''
                             : v < 0 ? ' on' : ' active');
      b.textContent = text;
      if (title) b.title = title;
      b.disabled = seen.size <= 1 && v < 0;
      b.onclick = () => setFilter(i, v);
      vals.appendChild(b);
    };
    add('All', -1, `All ${seen.size} ${lv.name.toLowerCase()}s`);
    lv.values.forEach((v, j) => { if (seen.has(j)) add(v, j); });
  }
  cell.appendChild(vals);

  return cell;
}

function render() {
  readColours();
  document.getElementById('pageTitle').textContent = DATA.title;
  document.getElementById('pageSub').textContent =
    `${DATA.file} · ${DATA.rows.toLocaleString()} rows`;
  buildFilters();

  const picked = DATA.levels
    .map((lv, i) => (state.filter[i] >= 0 ? `${lv.name} ${lv.values[state.filter[i]]}` : null))
    .filter(Boolean);
  document.getElementById('scope').innerHTML = picked.length
    ? 'Showing <b>' + picked.join('</b> · <b>') + '</b>'
      + (state.filter[0] >= 0
          ? ` — set ${DATA.levels[0].name} to All to step up and compare the rest.`
          : '')
    : 'Showing everything in the file.';

  /* The path taken so far: every level narrowed to one value, then the level
     the bars are on. Clicking a step goes back to it. */
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = '';
  const step = (text, onclick) => {
    if (crumb.children.length) {
      crumb.insertAdjacentHTML('beforeend', '<span class="sep">&rsaquo;</span>');
    }
    if (!onclick) {
      crumb.insertAdjacentHTML('beforeend', `<span class="now">${text}</span>`);
      return;
    }
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = onclick;
    crumb.appendChild(b);
  };
  step('All', () => {
    state.filter = DATA.levels.map(() => -1);
    state.dim = DATA.levels.length > 1 ? 1 : 0;
    render();
  });
  // Every narrowing, in level order - not just the ones above where the bars
  // used to sit. With time on the x axis a filter from either chain is equally
  // in force, and a crumb that hid half of them would be telling half the
  // truth about what is on screen.
  DATA.levels.forEach((lv, i) => {
    if (state.filter[i] < 0) return;
    step(lv.values[state.filter[i]], () => {
      for (let j = i; j < state.filter.length; j++) state.filter[j] = -1;
      state.dim = i;
      render();
    });
  });
  const sl = splitLevel();
  const per = state.period === 'month' ? 'month' : state.period;
  step(state.stack === 'orders' ? `by ${per}, split by when ordered`
       : sl === null ? `by ${per}`
       : `by ${per}, split by ${DATA.levels[sl].name}`, null);
  const atTop = !state.filter.some(v => v >= 0);
  document.getElementById('backBtn').disabled = atTop;
  document.getElementById('stkBack').disabled = atTop;
  const zb = document.getElementById('stkZoom');
  zb.innerHTML = state.zoom ? '&#x2715; Close' : '&#x2921; Expand';
  zb.title = state.zoom ? 'Back to the whole page'
                        : 'Show only this chart, with every value labelled';

  document.getElementById('tableBtn').classList.toggle('active', state.table);
  // The basis only exists where an order export was read alongside the profit.

  const all = totals();
  const money = v => (v == null ? '-' : fmt(v));
  document.getElementById('kpis').innerHTML = [
    [label('gross'), money(each(all, 'gross')), ''],
    ...COSTS.map(k => [label(k), money(each(all, k)), '']),
    [label('profit'), money(each(all, 'profit')),
     all.profit < 0 ? 'neg' : ''],
    ['Profit %', all.margin == null ? '-' : all.margin.toFixed(1) + '%',
     all.margin < 0 ? 'neg' : ''],
    ...(has.qty === undefined ? [] : [
      ['Qty (net)', fmt(all.qty), ''],
      ['ASP', all.asp == null ? '-' : unitFmt(all.asp), ''],
    ]),
    ...(!hasOrders() ? [] : (() => {
      const o = orderSplit();
      return [['Own demand', !DATA.carryIn ? 'not known'
               : o.month ? (o.booked / o.month * 100).toFixed(0) + '% of units'
               : '-', ''],
              ['Carried in', DATA.carryIn ? fmt(o.came) + ' units'
               : 'month before not read', ''],
              ['Carried out', fmt(o.goes) + ' units', '']];
    })()),
  ].map(([k, v, cls]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`
  ).join('');

  splitStrip();
  draw();
}

/* The month's profit split by where the order behind it came from.
   The total is the one number that has to be right: it is summed straight off
   the profit export with no share applied, and the parts are made to add back
   to it - so "no order matched" is a residual rather than a figure of its own,
   and any drift lands there instead of in the total anyone quotes. */
function splitStrip() {
  const box = document.getElementById('split');
  box.hidden = !(hasOrders() && DATA.carryIn && has.profit !== undefined);
  if (box.hidden) return;
  const o = orderSplit();
  const pc = v => (o.totProfit ? (v / o.totProfit * 100).toFixed(0) + '%' : '-');
  const mg = (pr, base) => (base ? (pr / base * 100).toFixed(1) + '%' : '-');
  const row = (name, pr, base, note) =>
    `<tr><td>${name}${note ? ` <span class="note">${note}</span>` : ''}</td>`
    + `<td class="v ${pr < 0 ? 'neg' : ''}">${fmt(pr)}</td>`
    + `<td>${pc(pr)}</td><td>${mg(pr, base)}</td></tr>`;
  box.innerHTML = `<table>
    <caption>Operating profit, by the month the order came from
      &middot; <em>the total is ${DATA.file}'s own</em></caption>
    <tr><th>where it came from</th><th>operating profit</th>
        <th>share</th><th>margin</th></tr>
    ${row("This month's own orders", o.ownProfit, o.ownNet)}
    ${row('Rolled in from ' + (DATA.before || 'the month before'),
          o.inProfit, o.inNet)}
    ${row('No order matched', o.otherProfit, o.otherNet,
          'offline, a marketplace, or a code the two files spell differently')}
    <tr class="sum"><td>Total &mdash; ${DATA.file}</td>
      <td class="v ${o.totProfit < 0 ? 'neg' : ''}">${fmt(o.totProfit)}</td>
      <td>100%</td><td>${mg(o.totProfit, o.totNet)}</td></tr>
  </table>
  <div class="why">Shared out on units; the total is the file's own and the
    rows are made to sum to it. Follows the filter.</div>`;
}

/* Every bar's own number, written inside it. Off by default - on a page with
   three charts it is clutter - and on when a chart is expanded, which is the
   moment there is room for it and the reason anyone expanded it. A segment too
   short to hold its text is left alone rather than given a number that spills
   over its neighbours. */
const barValues = {
  id: 'barValues',
  afterDatasetsDraw(c) {
    const o = c.options.plugins.barValues;
    if (!o || !o.on) return;
    const { ctx } = c;
    ctx.save();
    ctx.font = '600 10px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    c.data.datasets.forEach((d, i) => {
      if (d.type === 'line') return;
      const meta = c.getDatasetMeta(i);
      if (meta.hidden) return;
      meta.data.forEach((el, j) => {
        const v = d.data[j];
        if (v == null || !v) return;
        const h = Math.abs((el.base ?? el.y) - el.y);
        if (h < 15) return;                 // no room: a number here would lie
        const text = o.pct ? `${v.toFixed(1)}%` : fmt(v);
        const w = ctx.measureText(text).width;
        // A little overhang is fine - the plate sits over the bar either way.
        // Twice the bar's width is not: that would read as the neighbour's.
        if (w > (el.width || 0) + 12) return;
        const y = (el.y + (el.base ?? el.y)) / 2;
        ctx.globalAlpha = .88;
        ctx.fillStyle = C.surface;
        ctx.beginPath();
        ctx.roundRect(el.x - w / 2 - 4, y - 8, w + 8, 16, 4);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = C.ink;
        ctx.fillText(text, el.x, y + 1);
      });
    });
    ctx.restore();
  }
};

/* The percentage above each point of the line, on a plate in the surface
   colour so it stays readable where the line crosses a bar. */
const pointLabels = {
  id: 'pointLabels',
  afterDatasetsDraw(c) {
    // Only the line that asks for it. The split draws one dotted line per
    // member as well, and labelling all of them would bury the chart it is
    // drawn over.
    const i = c.data.datasets.findIndex(d => d.type === 'line' && d.labelPoints);
    if (i < 0) return;
    const { ctx } = c;
    ctx.save();
    ctx.font = '600 11px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    c.getDatasetMeta(i).data.forEach((pt, j) => {
      const v = c.data.datasets[i].data[j];
      if (v == null) return;
      const text = v.toFixed(1) + '%';
      const w = ctx.measureText(text).width;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = C.surface;
      ctx.beginPath();
      ctx.roundRect(pt.x - w / 2 - 4, pt.y - 24, w + 8, 15, 3);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.profit;
      ctx.fillText(text, pt.x, pt.y - 9);
    });
    ctx.restore();
  }
};

/* What the page is on: the slice's own rows at the drill level, which the KPIs
   and the table read. The chart itself is drawn by drawStack(), which puts this
   same P&L beside the figure's breakdown rather than in a second chart. */
function draw() {
  // The table breaks the slice down by whatever the chart is splitting by, so
  // the two always say the same thing.
  const di = splitLevel() ?? state.dim;
  const lv = DATA.levels[di];
  const rows = lv.values
    .map((name, i) => ({ name, ...totals({ level: di, value: i }) }))
    .filter(r => r.rows && (r.gross || r.profit));
  rows.sort((a, b) => Math.abs(b.gross) - Math.abs(a.gross));
  const top = rows.slice(0, 12);
  renderTable(top, lv.name, rows.length);
  drawStack();
}

/* Time on the x axis, the whole file in one chart.

   Every month the build read is a bar, in order, and what is drawn on it is the
   slice the filters leave. So the page opens on the year rather than on one
   month, and narrowing to MX redraws the same months with only MX in them -
   the question "how did this move" is answered without changing charts.

   Two shapes, chosen by Figure:

     P&L   two bars a month: what came in, and what it went out on, stacked.
     else  one bar a month, split by the level the drill is on - who it came
           from. Clicking a segment narrows to it and steps the split down.

   The profit line is on both, each point carrying its own figure, so
   switching never loses it. */
let stkChart = null;
function drawStack() {
  // "When ordered" is not a level of the key: it cuts the same revenue by the
  // month the order behind it was placed. It needs the order export and the
  // month before's, or there is nothing to call carried in. Decided first,
  // because what the bars are split by depends on it.
  const canOrd = hasOrders() && DATA.carryIn;
  if (state.stack === 'orders' && !canOrd) state.stack = 'customer';
  const ordMode = state.stack === 'orders';
  // The level that splits each bar. P&L has no split, so it ignores this.
  const chain = CHAINS[state.stack] || [];
  const sl = ordMode ? undefined : (splitLevel() ?? undefined);
  const slNext = sl === undefined ? null
    : (chain[chain.indexOf(sl) + 1] ?? null);
  [['stkCust', 'customer'], ['stkProd', 'product'],
   ['stkOrd', 'orders']].forEach(([id, v]) => {
    const b = document.getElementById(id);
    b.classList.toggle('active', state.stack === v);
    b.disabled = v === 'orders' ? !canOrd : !CHAINS[v].length;
  });

  // Where the month's revenue came from. The first two are the orders; the
  // third is everything they could not account for, and it is here so the bar
  // comes to the same total as every other way of stacking it - a month that
  // reads smaller under one split than another is a chart arguing with itself.
  //
  // Carried out is still not here. It is next month's revenue, and putting a
  // projection in a bar of measurements would make the bar mean nothing.
  const ORIGINS = [['own', 'Ordered this month'],
                   ['in', 'Carried in from the month before'],
                   ['none', 'No order matched']];
  // Three, not fourteen. Every cost figure is already a band of the P&L view,
  // so offering each of them its own bar chart was offering the same numbers
  // twice, and the order series are a stack of their own.
  //
  // The same three in every stack mode, which is what keeps the y axis still
  // when Stack by changes: there is no figure that one mode has and another
  // does not, so nothing has to be swapped out underneath the reader.
  const MEASURES = [
    ['profit', 'Operating Profit'],
    [has.net !== undefined ? 'net' : 'gross', 'Net Amount (AUD)'],
    ['qty', 'Qty'],
  ];
  const figBox = document.getElementById('stkFig');
  figBox.className = 'vals seg';
  figBox.innerHTML = '';
  const figs = MEASURES.filter(([k]) => has[k] !== undefined)
    .map(([key, label]) => ({ key, label }));
  if (!figs.length) return;
  if (!figs.some(x => x.key === state.stkFig)) state.stkFig = figs[0].key;
  figs.forEach(x => {
    const b = document.createElement('button');
    b.className = 'btn' + (state.stkFig === x.key ? ' active' : '');
    b.textContent = x.label;
    // render() rebuilds this very button, and removing the click's own target
    // mid-dispatch lets the enclosing <label> activate the first button in the
    // fresh row instead - so every figure snapped back to the first one.
    b.onclick = () => { state.stkFig = x.key; state.pnl = false; defer(render); };
    figBox.appendChild(b);
  });
  // P&L is a view, not a figure: the whole statement, with no split. Stack by
  // and Figure stay on the menu while it is on - hiding them meant a page that
  // opened on P&L opened with most of its controls missing and nothing saying
  // why. Picking one of them simply leaves the P&L, which is what pressing a
  // control that is plainly there should do.
  const pnlMode = state.pnl && has.profit !== undefined;
  document.getElementById('pnlBtn').classList.toggle('active', pnlMode);
  document.getElementById('pnlBtn').hidden = has.profit === undefined;
  // Normalising to 100% is about a mix, and the P&L is not one. The control
  // goes away rather than greying out: a disabled button still costs a row of
  // the menu, and this menu is already tall.
  const pctMode = state.stkScale === 'pct' && !pnlMode;
  document.getElementById('scaleBox').hidden = pnlMode;
  [['perMonth', 'month'], ['perQtr', 'quarter'], ['perYear', 'year']]
    .forEach(([id, v]) => document.getElementById(id)
      .classList.toggle('active', state.period === v));
  // One column is already the whole span, so there is nothing to run up to.
  const canCumul = state.period !== 'year';
  if (!canCumul) state.cumul = false;
  document.getElementById('cumulBtn').classList.toggle('active', state.cumul);
  document.getElementById('cumulBtn').hidden = !canCumul;
  document.getElementById('stkAmt').classList.toggle('active', !pctMode);
  document.getElementById('stkPct').classList.toggle('active', pctMode);

  const plot = document.getElementById('stkPlot');
  const slice = DATA.combos.filter(c =>
    state.filter.every((want, i) => want < 0 || c.k[i] === want));
  const fig = has[state.stkFig];      // undefined in P&L mode, which has none

  // One column per period. A month's ym is YYYYMM, so the quarter and the year
  // fall straight out of it, and the months arrive in order, so the columns do
  // too without sorting anything.
  const PER = { month: 'month', quarter: 'quarter', year: 'year' }[state.period];
  const keyOf = m => {
    const y = Math.floor(m.ym / 100), mo = m.ym % 100;
    return state.period === 'year' ? [`${y}`, `${y}`]
         : state.period === 'quarter'
           ? [`${y}Q${Math.ceil(mo / 3)}`, `${y} Q${Math.ceil(mo / 3)}`]
           : [`${m.ym}`, m.label];
  };
  const xs = [];
  const colAt = new Map();
  const col = DATA.months.map(m => {
    const [k, name] = keyOf(m);
    let i = colAt.get(k);
    if (i === undefined) {
      i = xs.length;
      colAt.set(k, i);
      xs.push({ name, ym: m.ym, mi: i, total: 0, row: new Map(), months: [] });
    }
    xs[i].months.push(m);
    return i;
  });
  const fin = xs.map(() => ({ qty: 0, net: 0, gross: 0, profit: 0,
                              deduction: 0, cogs: 0, opex: 0 }));
  const stackTotal = new Map();
  // Each member's own profit and its own denominator, month by month, so the
  // split can carry a margin per band and not just a size per band.
  const finBy = new Map();
  const slotFor = g => {
    let a = finBy.get(g);
    if (!a) finBy.set(g, a = xs.map(() => ({ profit: 0, net: 0, gross: 0 })));
    return a;
  };
  /* Costs are carried negative in the export. The whole figure is flipped when
     its total is, so a cost stack stands up like the others - and a member that
     really does run the other way still points the other way inside it. */
  const flip = fig !== undefined
    && slice.reduce((a, c) => a + c.v[fig], 0) < 0 ? -1 : 1;
  // The figure over the whole slice, month by month, with nothing left out.
  // This is what the y axis is scaled to - not the drawn bars - so switching
  // Stack by never rescales the chart. "When ordered" leaves things out by
  // design, and those bars should read as short rather than be stretched to
  // fill the plot.
  const whole = xs.map(() => 0);
  for (const c of slice) {
    const ci = col[c.m];
    const f = fin[ci];
    for (const k of ['qty', 'net', 'gross', 'profit', ...COSTS]) {
      if (has[k] !== undefined) f[k] += c.v[has[k]];
    }
    if (fig !== undefined) whole[ci] += c.v[fig] * flip;
    if (ordMode) {
      // The same revenue, cut by the month the order behind it was placed.
      // Carried out is left out because it has not been earned yet, and a
      // combination the orders never reached is left out because there is
      // nothing to say about where it came from - so these bands are the
      // month as sold minus what could not be placed, and the hint says so.
      if (!DATA.months[c.m].carryIn) continue;   // its predecessor was not read
      const month = bookedOf(c) + cameIn(c);
      const v = fig === undefined ? 0 : c.v[fig] * flip;
      // No order behind it at all, so there is nothing to apportion: the whole
      // of it goes to the band that says so.
      const shares = month ? [bookedOf(c) / month, cameIn(c) / month, 0]
                           : [0, 0, 1];
      ORIGINS.forEach(([key, name], oi) => {
        const share = shares[oi];
        if (!share) return;
        const b = slotFor(name)[ci];
        for (const k of ['profit', 'net', 'gross']) {
          if (has[k] !== undefined) b[k] += c.v[has[k]] * share;
        }
        const row = xs[ci].row;
        row.set(name, (row.get(name) || 0) + v * share);
        xs[ci].total += v * share;
        stackTotal.set(name, (stackTotal.get(name) || 0) + v * share);
      });
      continue;
    }
    if (pnlMode || sl === undefined) continue;
    const g = DATA.levels[sl].values[c.k[sl]];
    const b = slotFor(g)[ci];
    for (const k of ['profit', 'net', 'gross']) {
      if (has[k] !== undefined) b[k] += c.v[has[k]];
    }
    const v = fig === undefined ? 0 : c.v[fig] * flip;
    const row = xs[ci].row;
    row.set(g, (row.get(g) || 0) + v);
    xs[ci].total += v;
    stackTotal.set(g, (stackTotal.get(g) || 0) + v);
  }
  if (pnlMode) {
    xs.forEach((r, i) => { r.total = fin[i].gross || fin[i].profit; });
  }

  // Running totals, if asked: every column becomes itself plus everything
  // before it, so the last one is the whole span. Applied here, to the columns
  // rather than to the drawn series, so the bands, the margins, the axis and
  // the tooltips all cumulate together and cannot drift apart.
  if (state.cumul) {
    for (let i = 1; i < xs.length; i++) {
      // xs[i-1] is already cumulative by the time we reach i.
      for (const [g, v] of xs[i - 1].row) {
        xs[i].row.set(g, (xs[i].row.get(g) || 0) + v);
      }
      xs[i].total += xs[i - 1].total;
      whole[i] += whole[i - 1];
      for (const k of Object.keys(fin[i])) fin[i][k] += fin[i - 1][k];
      for (const a of finBy.values()) {
        for (const k of ['profit', 'net', 'gross']) a[i][k] += a[i - 1][k];
      }
    }
  }

  // Eight slots, in a fixed order by size across the whole span - so a member
  // keeps its colour from month to month, which is the only way a stacked bar
  // can be read along a time axis at all. A ninth folds into Other.
  const members = ordMode
    ? ORIGINS.map(o => o[1]).filter(n => stackTotal.has(n))
    : [...stackTotal.entries()]
        .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).map(e => e[0]);
  const named = members.slice(0, 8);
  const folded = !ordMode && members.length > 8;

  // In percentage mode each bar is normalised to its own total, so the mix
  // inside a small month reads as clearly as the mix inside a large one. The
  // amount is kept on the row for the tooltip - a share with no size behind
  // it is how a rounding error comes to look like a trend.
  const raw = g => xs.map(r => r.row.get(g) || 0);
  const scale = vals => (pctMode
    ? vals.map((v, i) => (xs[i].total ? v / xs[i].total * 100 : 0))
    : vals);
  // In orders mode the two bands mean something fixed, so they keep a fixed
  // pair of colours rather than taking whichever slot they sorted into.
  // The unmatched band takes the palette's neutral slot, which is what it is.
  const bandColour = i => (ordMode ? [C.stack[0], C.stack[4], C.stack[8]][i]
                                   : C.stack[i]);
  const series = pnlMode ? [] : named.map((g, i) => ({
    label: g, stack: 'a', data: scale(raw(g)), amounts: raw(g),
    backgroundColor: bandColour(i), borderRadius: 3, borderSkipped: false,
    borderWidth: 1, borderColor: C.surface, maxBarThickness: 54,
  }));
  if (folded && !pnlMode) {
    const rest = xs.map(r => named.reduce((a, g) => a - (r.row.get(g) || 0),
                                          r.total));
    series.push({
      label: `Other (${members.length - 8})`, stack: 'a',
      data: scale(rest), amounts: rest,
      backgroundColor: C.stack[8], borderRadius: 3, borderSkipped: false,
      borderWidth: 1, borderColor: C.surface, maxBarThickness: 54,
    });
  }

  const at = (i, k) => (k === 'gross' ? (fin[i].gross || 0)
                                      : Math.abs(fin[i][k] || 0));
  if (pnlMode) {
    series.push({
      label: label('gross'), stack: 'in',
      data: xs.map(r => at(r.mi, 'gross')),
      backgroundColor: C.gross, borderRadius: 4, borderSkipped: false,
      borderWidth: 2, borderColor: C.surface, maxBarThickness: 64,
    });
    COSTS.forEach(k => series.push({
      label: label(k), stack: 'out', data: xs.map(r => at(r.mi, k)),
      backgroundColor: C[k], borderRadius: 4, borderSkipped: false,
      borderWidth: 2, borderColor: C.surface, maxBarThickness: 64,
    }));
  }
  const denom = has.net !== undefined ? label('net') : label('gross');
  const hasLine = has.profit !== undefined;
  // P&L draws two bars a side, and the cost stack can be taller than the gross
  // bar; everything else is one bar of the figure itself.
  const pnlSide = i => COSTS.reduce((a, k) => a + Math.abs(fin[i][k] || 0), 0);
  const ceiling = xs.map((_, i) => (pnlMode
    ? Math.max(Math.abs(fin[i].gross || 0), pnlSide(i))
    : Math.abs(whole[i])));
  const axisTop = Math.max(0, ...ceiling);
  const axisBottom = Math.min(0, ...(pnlMode ? [0] : whole));
  // How many columns there are decides how tall the plot needs to be.

  const marginOf = f => {
    const base = f.net || f.gross;
    return base ? f.profit / base * 100 : null;
  };
  if (hasLine) {
    series.push({
      type: 'line', label: `${label('profit')} % of ${denom}`, yAxisID: 'y1',
      data: xs.map(r => marginOf(fin[r.mi])),
      borderColor: C.profit, backgroundColor: C.profit, borderWidth: 2,
      pointRadius: 4, pointHoverRadius: 7, tension: .25, fill: false,
      spanGaps: true, order: -1, labelPoints: true,
    });
    // And one per band, dotted, in the band's own colour. Solid is the slice
    // as a whole; dotted is a member of it. A stacked bar says how big each
    // member is and says nothing about how well it did - two members of the
    // same size can be a long way apart on margin, and that is usually the
    // question the sizes raise.
    if (!pnlMode) {
      named.forEach((g, i) => {
        const a = finBy.get(g);
        if (!a) return;
        if (ordMode && g === ORIGINS[2][1]) return;   // a residual, not a cohort
        // Faint on purpose: the solid line is the answer, and these are the
        // spread around it. At full strength eight of them read as the chart
        // and the bars underneath read as the background, which is backwards.
        series.push({
          type: 'line', label: `${g} margin`, yAxisID: 'y1',
          data: xs.map(r => marginOf(a[r.mi])),
          borderColor: fade(bandColour(i), .75),
          backgroundColor: fade(bandColour(i), .75),
          borderWidth: 1.4, borderDash: [4, 3],
          pointRadius: 0, pointHoverRadius: 5, tension: .25, fill: false,
          spanGaps: true, order: -1, bandLine: true,
        });
      });
    }
  }

  document.getElementById('stkLegend').innerHTML = series
    .filter(d => !d.bandLine)        // the band's own colour already names it
    .map(d => `<span><i style="background:${d.type === 'line' ? d.borderColor
      : d.backgroundColor}"></i>${d.label}</span>`).join('');
  // Expanded, the stylesheet gives the plot the window; the inline height set
  // here would win over it, so it steps aside.
  plot.style.height = state.zoom === 'stk' ? ''
    : Math.max(340, Math.min(560, xs.length * 46 + 180)) + 'px';

  // Clicking a segment narrows to it. The x axis does not move - it is time -
  // so the same months come back with only that member in them, which is the
  // comparison the click was asking for.
  // The origins are not a level, so there is nothing under them to open.
  const canDrill = !pnlMode && !ordMode && sl !== undefined;
  if (stkChart) stkChart.destroy();
  stkChart = new Chart(document.getElementById('stkBars'), {
    type: 'bar', data: { labels: xs.map(r => r.name), datasets: series },
    plugins: [pointLabels, barValues],
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
      interaction: { mode: 'index', intersect: false },
      datasets: { bar: { categoryPercentage: 0.8, barPercentage: 0.95 } },
      onHover: (e, els) => {
        e.native.target.style.cursor = (els.length && canDrill) ? 'pointer' : '';
      },
      onClick(e, els) {
        if (!canDrill) return;
        // The index-mode elements Chart.js hands over are the whole column,
        // line dataset first, so they say which month was clicked and not
        // which band. Asking again for what the pointer is actually inside is
        // the difference between "a bar was clicked" and "MX was clicked".
        const hit = this.getElementsAtEventForMode(
          e, 'nearest', { intersect: true }, true)[0] || els[0];
        const d = hit && this.data.datasets[hit.datasetIndex];
        if (!d || d.type === 'line' || !d.label) return;
        const j = DATA.levels[sl].values.indexOf(d.label);
        if (j < 0) return;                       // the folded Other, not a member
        defer(() => setFilter(sl, j));
      },
      scales: {
        // Two stack names on a stacked axis put the figure and the costs
        // side by side on the same tick; one name leaves a single bar centred.
        // offset is on in both: without it the first and last bars sit hard on
        // the axis ends and lose half their width off the edge of the plot.
        x: { stacked: true, offset: true, grid: { display: false },
             border: { display: false },
             ticks: { color: C.ink2, autoSkip: false, maxRotation: 0 } },
        y: { stacked: true, beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             max: pctMode ? 100 : undefined,
             // Not a hard max: a bar bigger than the slice's own figure - the
             // P&L's cost stack can be - still gets the room it needs.
             suggestedMax: pctMode ? undefined : axisTop,
             suggestedMin: pctMode ? undefined : axisBottom,
             title: { display: true, color: C.ink3,
                      text: pctMode ? 'Share of the bar'
                        : pnlMode ? 'Amount'
                        : (figs.find(x => x.key === state.stkFig) || {}).label },
             ticks: { color: C.ink3,
                      callback: v => (pctMode ? `${v}%`
                                              : Number(v).toLocaleString()) } },
        // The line carries its own value over every point, so the axis it is
        // scaled against has nothing left to tell anyone. It stays as a scale
        // and stops being drawn, which gives the bars the width back.
        ...(hasLine ? { y1: {
          display: false, position: 'right',
          suggestedMin: -10, suggestedMax: 10 } } : {}),
      },
      plugins: {
        legend: { display: false },
        barValues: { on: state.zoom === 'stk', pct: pctMode },
        tooltip: { backgroundColor: C.surface, titleColor: C.ink,
          bodyColor: C.ink2, borderColor: C.grid, borderWidth: 1, padding: 10,
          filter: c => c.parsed.y !== 0 && c.parsed.y !== null,
          callbacks: {
            label: c => c.dataset.yAxisID === 'y1'
              ? `${c.dataset.label}: ` + (c.parsed.y == null ? 'no net sales'
                  : c.parsed.y.toFixed(1) + '%')
              : pctMode
                ? `${c.dataset.label}: ${c.parsed.y.toFixed(1)}%  (${
                    fmt(c.dataset.amounts[c.dataIndex])})`
                : `${c.dataset.label}: ${fmt(c.parsed.y)}`,
            footer: items => {
              const r = xs[items[0].dataIndex];
              const f = fin[r.mi];
              return [...(pnlMode
                       ? [`Costs: ${fmt(COSTS.reduce(
                           (a, k) => a + Math.abs(f[k] || 0), 0))}`]
                       : [`${(figs.find(x => x.key === state.stkFig) || {}).label}`
                          + `: ${fmt(r.total)}`]),
                      ...(hasLine ? [`${label('profit')}: ${fmt(f.profit || 0)}`]
                                  : []),
                      ...(f.qty ? [`Qty: ${fmt(f.qty)}`] : []),
                      ...(canDrill
                          ? [`click a band to keep only that ${DATA.levels[sl].name}`]
                          : [])];
            } } },
      },
    },
  });

  document.getElementById('stkHint').textContent =
    (ordMode
      ? `${(figs.find(x => x.key === state.stkFig) || {}).label} by ${PER}, `
        + `split by when the order behind it was placed, with what no order `
        + 'could be matched to in grey - so the bar comes to the same total as '
        + 'every other way of stacking it. What the month ships but has not '
        + 'sold yet is not here: it is next month\'s.'
        + (() => {
            const blind = DATA.months.filter(m => !m.carryIn).map(m => m.label);
            return blind.length
              ? ` ${blind.join(', ')} ${blind.length > 1 ? 'are' : 'is'} empty: `
                + 'the month before was not read, so how much came in is '
                + 'unknown rather than nil.'
              : '';
          })()
      : pnlMode
      ? `${label('gross')} beside what it went out on, by ${PER}. Costs are `
        + 'drawn as amounts.'
      : sl === undefined
        ? `${(figs.find(x => x.key === state.stkFig) || {}).label} by ${PER}. `
          + `Every ${state.stack} level is narrowed to one value, so there is `
          + 'nothing left to split by - step one back to bring a split back.'
        : `${(figs.find(x => x.key === state.stkFig) || {}).label} by ${PER}, `
          + `each split by ${DATA.levels[sl].name}`
          + (pctMode ? `, every ${PER} normalised to its own total - the mix, `
                       + 'not the size. The tooltip keeps the amount behind '
                       + 'each share'
                     : '')
          + (folded ? `. The eight biggest ${DATA.levels[sl].name.toLowerCase()}s `
                      + `have a colour of their own, the same colour in every `
                      + `${PER}; the rest are folded into Other.` : '.'))
    + (state.cumul ? ` Running totals: every bar is itself plus everything `
                     + `before it, so the last one is the whole span.` : '')
    + (hasLine ? ` The solid line is ${label('profit')} over ${denom} for the `
                 + 'whole slice, each point carrying its own figure'
                 + (pnlMode ? '.'
                    : '; the dotted lines are the same margin for each band, in '
                      + 'the band\'s own colour - two bands the same size can '
                      + 'be a long way apart on it.') : '')
    + (canDrill ? ` Click a band to keep only that ${DATA.levels[sl].name}`
                  + (slNext === null ? '.'
                     : `; the split then steps down to ${DATA.levels[slNext].name}.`)
                : '');
}

/* The two counts side by side, one pair per member of the level the bars are
   on. Units, not money: both files carry a quantity that means the same thing -
   a unit shipped - while the amounts differ by tax, by currency and by what
   each file calls revenue. The money is in the tooltip, where a systematic
   difference still shows without being mistaken for a reconciling one.

   The overlap is drawn in one colour across both bars, because it is one set of
   units counted twice. What sits above it on each side is what the other side
   does not have. */
/* Which of a pair is which, written over each bar. Two bars on one tick share
   the tick's label, so without this the colours are the only thing saying that
   the left one is the month's sales and the right one the month's orders. */
function renderTable(rows, dimName, ofTotal) {
  document.getElementById('tableCard').hidden = !state.table;
  if (!state.table) return;
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  // The table mirrors the chart, so its total covers the rows charted - say
  // so when that is not all of them, rather than let it read as the whole file.
  const tot = { name: ofTotal > rows.length ? `Total of these ${rows.length}`
                                            : 'Total',
                gross: sum('gross'), profit: sum('profit'),
                net: sum('net'), qty: sum('qty') };
  COSTS.forEach(k => { tot[k] = sum(k); });
  tot.asp = tot.qty ? tot.net / tot.qty : null;
  const head = [dimName, label('gross'),
                ...COSTS.map(k => label(k)), 'Costs',
                label('profit'), 'Profit %',
                ...(has.qty === undefined ? [] : ['Qty (net)', 'ASP'])];
  const cell = v => (v == null ? '-' : fmt(v));
  const line = r => {
    const costs = COSTS.reduce((a, k) => a + r[k], 0);
    const m = r.net ? (r.profit / r.net) * 100 : null;
    const p = r.profit;
    return [`<td>${r.name}</td>`, `<td>${cell(each(r, 'gross'))}</td>`,
            ...COSTS.map(k => `<td>${cell(each(r, k))}</td>`),
            `<td>${cell(costs)}</td>`,
            `<td class="${p < 0 ? 'neg' : ''}">${cell(each(r, 'profit'))}</td>`,
            `<td class="${m < 0 ? 'neg' : ''}">${
              m == null ? '-' : m.toFixed(1) + '%'}</td>`,
            ...(has.qty === undefined ? [] : [
              `<td>${fmt(r.qty)}</td>`,
              `<td>${r.asp == null ? '-' : unitFmt(r.asp)}</td>`])].join('');
  };
  document.getElementById('tableBox').innerHTML = `<table>
    <thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${line(r)}</tr>`).join('')}</tbody>
    <tfoot><tr>${line(tot)}</tr></tfoot></table>`;
}

/* Back widens the deepest narrowing, whichever chain it was in, and puts the
   split back on that level. With time on the x axis there is no level to step
   up from - the narrowing is the whole of where you are. */
document.getElementById('backBtn').onclick = () => {
  let last = -1;
  state.filter.forEach((v, i) => { if (v >= 0) last = i; });
  if (last < 0) return;
  state.filter[last] = -1;
  state.dim = last;
  state.stack = last < DATA.custDepth ? 'customer' : 'product';
  render();
};
document.getElementById('tableBtn').onclick = () => {
  state.table = !state.table; render(); };

/* Expanding hands one chart the window. Chart.js sizes to its container, and
   the container only changes once the class is on, so the redraw waits a frame
   rather than measuring the old box. */
function setZoom(which) {
  state.zoom = state.zoom === which ? null : which;
  document.body.classList.toggle('zoomed', state.zoom !== null);
  document.getElementById('stkCard').classList.toggle('zoom', state.zoom === 'stk');
  requestAnimationFrame(render);
}
document.getElementById('stkZoom').onclick = () => setZoom('stk');
document.getElementById('stkBack').onclick = () =>
  document.getElementById('backBtn').click();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.zoom) setZoom(state.zoom);
});
document.getElementById('resetBtn').onclick = () => {
  startHere();
  state.stack = 'customer';
  render();
};
[['stkCust', 'customer'], ['stkProd', 'product'], ['stkOrd', 'orders']]
  .forEach(([id, v]) => {
    document.getElementById(id).onclick = () => {
      // Asking for a split is asking to see one, so it leaves the P&L, which
      // has none.
      state.stack = v; state.pnl = false; render();
    };
  });
document.getElementById('cumulBtn').onclick = () => {
  state.cumul = !state.cumul; render(); };
document.getElementById('pnlBtn').onclick = () => {
  state.pnl = !state.pnl; render(); };
[['perMonth', 'month'], ['perQtr', 'quarter'], ['perYear', 'year']]
  .forEach(([id, v]) => {
    document.getElementById(id).onclick = () => { state.period = v; render(); };
  });
document.getElementById('stkAmt').onclick = () => {
  state.stkScale = 'amount'; render(); };
document.getElementById('stkPct').onclick = () => {
  state.stkScale = 'pct'; render(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

rebind();
startHere();
render();
</script>
</body>
</html>
