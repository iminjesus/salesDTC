<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profit</title>
<style>
:root {
  color-scheme: light;
  --page: #f4f5f7; --surface: #fcfcfb; --line: #e3e4e8; --grid: #ecedf1;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #83827d;
  --accent: #2a78d6; --accent-ink: #ffffff; --chip: #ffffff; --neg: #d14343;
  /* A fixed hue per figure, never by rank, so a filter that drops a member
     cannot repaint the rest. */
  --c-gross: #2a78d6; --c-deduction: #eb6834; --c-cogs: #1baf7a;
  --c-opex: #eda100; --c-profit: #4a3aa7;
  /* Stack slots, in a fixed order. A ninth member folds into Other rather
     than being handed a generated hue. */
  --k1:#2a78d6; --k2:#eb6834; --k3:#1baf7a; --k4:#eda100;
  --k5:#e87ba4; --k6:#008300; --k7:#4a3aa7; --k8:#e34948; --k9:#a9a8a1;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #111110; --surface: #1a1a19; --line: #343431; --grid: #2a2a28;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8e85;
    --accent: #3987e5; --accent-ink: #0b0b0b; --chip: #232321; --neg: #f08a7a;
    --c-gross: #3987e5; --c-deduction: #d95926; --c-cogs: #199e70;
    --c-opex: #c98500; --c-profit: #9085e9;
    --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
    --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767; --k9:#6b6a64;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #111110; --surface: #1a1a19; --line: #343431; --grid: #2a2a28;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8e85;
  --accent: #3987e5; --accent-ink: #0b0b0b; --chip: #232321; --neg: #f08a7a;
  --c-gross: #3987e5; --c-deduction: #d95926; --c-cogs: #199e70;
  --c-opex: #c98500; --c-profit: #9085e9;
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
  --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767; --k9:#6b6a64;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "Malgun Gothic", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 2px; }
.sub { color: var(--ink-3); font-size: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11px;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
label.f.off > span { color: var(--ink-3); opacity: .55; }
select, .btn { font: inherit; color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
select { min-width: 140px; max-width: 220px; }
select:disabled { opacity: .5; }
.btn { cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.active { background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; margin-left: -1px; }
.seg .btn:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg .btn:last-child { border-radius: 0 7px 7px 0; }
.scope { font-size: 12px; color: var(--ink-3); margin: 10px 0 0; }
.crumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  font-size: 13px; margin-bottom: 12px; }
.crumb button { background: none; border: 0; color: var(--accent);
  cursor: pointer; font: inherit; padding: 2px 5px; border-radius: 5px; }
.crumb button:hover { background: var(--grid); }
.crumb .sep { color: var(--ink-3); }
.crumb .now { font-weight: 600; padding: 2px 5px; }
.note { font-style: normal; font-size: 10px; color: var(--ink-3);
  text-transform: none; letter-spacing: 0; max-width: 220px; }
.scope b { color: var(--ink-2); font-weight: 600; }
.kpis { display: flex; flex-wrap: wrap; gap: 10px; margin: 2px 0 14px; }
.kpi { flex: 1 1 130px; background: var(--chip); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; }
.kpi .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase;
  letter-spacing: .04em; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.kpi .v { font-size: 19px; font-weight: 650; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; }
.kpi .v.neg { color: var(--neg); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px;
  color: var(--ink-2); margin-bottom: 8px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block;
  margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; height: 420px; }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px;
  font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--grid);
  text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
thead th { color: var(--ink-3); font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .04em; }
td.neg { color: var(--neg); }
tfoot td { font-weight: 650; border-top: 1px solid var(--line); border-bottom: 0; }
@media (max-width: 640px) {
  select { min-width: 0; width: 100%; } label.f { flex: 1 1 100%; }
  .chart { height: 340px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">Profit</h1>
  <div class="sub" id="pageSub"></div>

  <div class="card">
    <div class="row" id="filters"></div>
    <div class="scope" id="scope"></div>
  </div>

  <div class="card">
    <div class="crumb" id="stkCrumb"></div>
    <div class="row" style="margin-bottom:12px">
      <label class="f"><span>Bars by</span><span class="seg">
        <button class="btn" id="stkXCust">Customer</button
        ><button class="btn" id="stkXProd">Product</button></span></label>
      <label class="f"><span>Stack by</span><span class="seg">
        <button class="btn" id="stkCust">Customer</button
        ><button class="btn" id="stkProd">Product</button></span></label>
      <button class="btn" id="stkBack">&larr; Back</button>
      <label class="f"><span>Figure</span><select id="stkFig"></select></label>
      <label class="f"><span>Scale</span><span class="seg">
        <button class="btn" id="stkAmt">Amount</button
        ><button class="btn" id="stkPct">% of bar</button></span></label>
    </div>
    <div class="legend" id="stkLegend"></div>
    <div class="chart" id="stkPlot"><canvas id="stkBars"></canvas></div>
    <div class="hint" id="stkHint"></div>
  </div>

  <div class="card">
    <div class="crumb" id="crumb"></div>
    <div class="row" style="margin-bottom:12px">
      <label class="f"><span>Bars by</span><select id="dimPick"></select></label>
      <button class="btn" id="backBtn">&larr; Back</button>
      <span class="seg"><button class="btn" id="unitAmt">Amounts</button
        ><button class="btn" id="unitPer">Per unit</button></span>
      <button class="btn" id="tableBtn">Table</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="legend" id="legend"></div>
    <div class="chart" id="plot"><canvas id="bars"></canvas></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card" id="tableCard" hidden><div id="tableBox"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
const DATA = /*__DATA__*/null;

/* Chart.js cannot resolve a custom property, so the series colours are read off
   the stylesheet once per render - that way light and dark live in one place. */
const css = n => getComputedStyle(document.documentElement)
                   .getPropertyValue(n).trim();
const defer = fn => setTimeout(fn, 0);
let C = {};
function readColours() {
  C = { ink: css('--ink'), ink2: css('--ink-2'), ink3: css('--ink-3'),
        grid: css('--grid'), surface: css('--surface'), neg: css('--neg'),
        gross: css('--c-gross'), deduction: css('--c-deduction'),
        cogs: css('--c-cogs'), opex: css('--c-opex'), profit: css('--c-profit'),
        stack: [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => css('--k' + n)) };
}

const fmt = n => Math.round(n).toLocaleString();
/* A per-unit figure is a price, so it keeps its cents. */
const unitFmt = n => n.toLocaleString(undefined, { minimumFractionDigits: 2,
                                                   maximumFractionDigits: 2 });
/* One figure of a group, as an amount or divided by the units behind it.
   Without a quantity there is no price, so it comes back blank rather than
   as a zero that would read as "free". */
function each(r, key) {
  if (state.unit !== 'per') return r[key];
  return r.qty ? r[key] / r.qty : null;
}
const has = {};
DATA.series.forEach((s, i) => { has[s.key] = i; });
const label = k => (has[k] === undefined ? k : DATA.series[has[k]].label);
const COSTS = ['deduction', 'cogs', 'opex'].filter(k => has[k] !== undefined);

/* The page opens on one channel - the online business - with everything else
   still in the file. Setting Channel back to All steps up and brings it in. */
const state = {
  filter: DATA.levels.map((_, i) => (i === 0 ? DATA.start : -1)),
  // Bars start on the level below the channel, since the channel is filtered.
  dim: DATA.levels.length > 1 ? 1 : 0,
  // 'amount' charts the money; 'per' divides every figure by quantity, which
  // turns the gross bar into the average selling price and the stack into what
  // each unit costs. The profit line is a percentage either way.
  unit: 'amount',
  table: false,
  // The stacked chart carries its own level and chain, so the mix can be read
  // by product while the bars below stay on the customer chain. The page-wide
  // filters are what the two charts share.
  stkX: 0,
  // Which chain the stacked chart splits each bar by, and the figure it charts.
  stack: 'customer',
  stkFig: 'net',
  // 'amount' compares sizes between bars; 'pct' normalises every bar to 100%
  // and compares the mix inside them, which a tall bar otherwise drowns out.
  stkScale: 'amount',
};

/* The two chains the page drills: the customer levels, then the product ones.
   A chain stacks the level below whichever one the bars are on. */
const CHAINS = {
  customer: DATA.levels.map((_, i) => i).filter(i => i < DATA.custDepth),
  product:  DATA.levels.map((_, i) => i).filter(i => i >= DATA.custDepth),
};

/* The stacked chart starts one level above the bars below it, so the page opens
   on a single E-STORE bar split into EPP and S.com rather than on two bars that
   have to be read against each other - the mix is the point of a stack. */
const xChain = () => (state.stkX < DATA.custDepth ? CHAINS.customer
                                                  : CHAINS.product);
/* What each bar is split by: the level below the bars in the chosen chain, or
   that chain's top level when the bars are on the other one. */
function stackLevel() {
  const chain = CHAINS[state.stack] || [];
  const at = chain.indexOf(state.stkX);
  if (at < 0) return chain.length ? chain[0] : null;   // the other chain: start it
  return at + 1 < chain.length ? chain[at + 1] : null; // nothing below this one
}
/* Opening a bar hands its stack level to the x axis, which then splits by the
   level below that. Null when there is no such level - the end of the drill. */
function stackDrill() {
  const sl = stackLevel();
  if (sl === null) return null;
  const chain = CHAINS[state.stack];
  return chain.indexOf(sl) + 1 < chain.length ? sl : null;
}
/* Where a step up lands, or null when it would change nothing - an enabled
   button that does nothing is worse than a greyed-out one. At the top of a
   chain there is still the narrowing below it to undo. */
function stackBack() {
  const chain = xChain();
  const at = chain.indexOf(state.stkX);
  if (at > 0) return chain[at - 1];
  return state.filter.slice(state.stkX).some(v => v >= 0) ? state.stkX : null;
}
/* Stepping up is also what undoes a drill, so it clears the narrowing from the
   level it lands on downwards. */
function stackStepUp() {
  const up = stackBack();
  if (up === null) return;
  state.stkX = up;
  for (let j = up; j < state.filter.length; j++) state.filter[j] = -1;
  render();
}

/* Every combination of the filter values was totalled at build time, so a
   filter change is a sum over the matching combinations rather than a pass over
   the rows. */
function totals(extra) {
  const v = new Float64Array(DATA.series.length);
  let rows = 0;
  for (const c of DATA.combos) {
    let keep = true;
    for (let i = 0; i < state.filter.length; i++) {
      const want = extra && extra.level === i ? extra.value : state.filter[i];
      if (want >= 0 && c.k[i] !== want) { keep = false; break; }
    }
    if (!keep) continue;
    rows += c.n;
    for (let m = 0; m < v.length; m++) v[m] += c.v[m];
  }
  const at = k => (has[k] === undefined ? 0 : v[has[k]]);
  const profit = at('profit');
  const net = has.net !== undefined ? at('net') : at('gross');
  const qty = Math.abs(at('qty'));
  return { rows, gross: at('gross'), deduction: Math.abs(at('deduction')),
           cogs: Math.abs(at('cogs')), opex: Math.abs(at('opex')),
           profit, net, qty,
           // ASP is the weighted price: the totals divided, never the average
           // of each row's own price.
           asp: qty ? net / qty : null,
           margin: net ? (profit / net) * 100 : null };
}

/* Which values a level can still offer, given the levels above it in the same
   group - picking a Type should not leave Type2 listing other types' values. */
function optionsFor(level) {
  const group = level < DATA.custDepth ? [0, DATA.custDepth] : [DATA.custDepth,
                                                                DATA.levels.length];
  const seen = new Set();
  const all = new Set();
  const blame = [];
  for (let i = group[0]; i < level; i++) {
    if (state.filter[i] >= 0) blame.push(DATA.levels[i].name);
  }
  for (const c of DATA.combos) {
    all.add(c.k[level]);
    let ok = true;
    for (let i = group[0]; i < level; i++) {
      if (state.filter[i] >= 0 && c.k[i] !== state.filter[i]) { ok = false; break; }
    }
    if (ok) seen.add(c.k[level]);
  }
  return { seen, hidden: all.size - seen.size, blame };
}

/* Narrowing to a value moves the bars down to the next level; widening back to
   All brings them up again. A click on a bar and a change of a select are the
   same act, so they go through here. */
function setFilter(i, v) {
  state.filter[i] = v;
  if (v >= 0 && state.dim === i && i + 1 < DATA.levels.length) state.dim = i + 1;
  if (v < 0 && state.dim > i) state.dim = i;
  render();
}

function buildFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  DATA.levels.forEach((lv, i) => {
    const { seen, hidden, blame } = optionsFor(i);
    if (state.filter[i] >= 0 && !seen.has(state.filter[i])) state.filter[i] = -1;
    const wrap = document.createElement('label');
    wrap.className = 'f' + (seen.size <= 1 ? ' off' : '');
    wrap.innerHTML = `<span>${lv.name}</span>`;
    const sel = document.createElement('select');
    sel.innerHTML = `<option value="-1">All (${seen.size})</option>`
      + lv.values.map((v, j) => seen.has(j)
          ? `<option value="${j}">${v}</option>` : '').join('');
    sel.value = String(state.filter[i]);
    sel.disabled = seen.size <= 1 && state.filter[i] < 0;
    sel.onchange = () => setFilter(i, +sel.value);
    wrap.appendChild(sel);
    // A value missing from this list is usually not missing from the file - it
    // sits under a level above that is narrowed. Say so, rather than let it
    // read as "there are no such customers".
    if (hidden) {
      wrap.insertAdjacentHTML('beforeend',
        `<em class="note">${hidden} more under other ${blame.join(' / ')}</em>`);
    }
    box.appendChild(wrap);
  });
  const reset = document.createElement('button');
  reset.className = 'btn';
  reset.textContent = 'Reset';
  reset.onclick = () => {
    state.filter = DATA.levels.map((_, i) => (i === 0 ? DATA.start : -1));
    render();
  };
  box.appendChild(reset);
}

function render() {
  readColours();
  document.getElementById('pageTitle').textContent = DATA.title;
  document.getElementById('pageSub').textContent =
    `${DATA.file} · ${DATA.rows.toLocaleString()} rows`;
  buildFilters();

  const picked = DATA.levels
    .map((lv, i) => (state.filter[i] >= 0 ? `${lv.name} ${lv.values[state.filter[i]]}` : null))
    .filter(Boolean);
  document.getElementById('scope').innerHTML = picked.length
    ? 'Showing <b>' + picked.join('</b> · <b>') + '</b>'
      + (state.filter[0] >= 0
          ? ` — set ${DATA.levels[0].name} to All to step up and compare the rest.`
          : '')
    : 'Showing everything in the file.';

  /* The path taken so far: every level narrowed to one value, then the level
     the bars are on. Clicking a step goes back to it. */
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = '';
  const step = (text, onclick) => {
    if (crumb.children.length) {
      crumb.insertAdjacentHTML('beforeend', '<span class="sep">&rsaquo;</span>');
    }
    if (!onclick) {
      crumb.insertAdjacentHTML('beforeend', `<span class="now">${text}</span>`);
      return;
    }
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = onclick;
    crumb.appendChild(b);
  };
  step('All', () => {
    state.filter = DATA.levels.map(() => -1);
    state.dim = 0;
    render();
  });
  DATA.levels.forEach((lv, i) => {
    if (state.filter[i] < 0 || i >= state.dim) return;
    step(lv.values[state.filter[i]], () => {
      for (let j = i; j < state.filter.length; j++) state.filter[j] = -1;
      state.dim = i;
      render();
    });
  });
  step(`by ${DATA.levels[state.dim].name}`, null);
  document.getElementById('backBtn').disabled = state.dim === 0;

  const dimSel = document.getElementById('dimPick');
  dimSel.innerHTML = DATA.levels.map((lv, i) =>
    `<option value="${i}">${lv.name}</option>`).join('');
  dimSel.value = state.dim;
  document.getElementById('tableBtn').classList.toggle('active', state.table);
  const canUnit = has.qty !== undefined;
  if (!canUnit) state.unit = 'amount';
  document.getElementById('unitAmt').classList.toggle('active', state.unit === 'amount');
  document.getElementById('unitPer').classList.toggle('active', state.unit === 'per');
  document.getElementById('unitPer').disabled = !canUnit;

  const all = totals();
  const per = state.unit === 'per';
  const money = v => (v == null ? '-' : per ? unitFmt(v) : fmt(v));
  document.getElementById('kpis').innerHTML = [
    [label('gross') + (per ? ' / unit' : ''), money(each(all, 'gross')), ''],
    ...COSTS.map(k => [label(k) + (per ? ' / unit' : ''), money(each(all, k)), '']),
    [label('profit') + (per ? ' / unit' : ''), money(each(all, 'profit')),
     all.profit < 0 ? 'neg' : ''],
    ['Profit %', all.margin == null ? '-' : all.margin.toFixed(1) + '%',
     all.margin < 0 ? 'neg' : ''],
    ...(has.qty === undefined ? [] : [
      ['Qty (net)', fmt(all.qty), ''],
      ['ASP', all.asp == null ? '-' : unitFmt(all.asp), ''],
    ]),
  ].map(([k, v, cls]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`
  ).join('');

  draw();
}

/* The percentage above each point of the line, on a plate in the surface
   colour so it stays readable where the line crosses a bar. */
const pointLabels = {
  id: 'pointLabels',
  afterDatasetsDraw(c) {
    const i = c.data.datasets.findIndex(d => d.type === 'line');
    if (i < 0) return;
    const { ctx } = c;
    ctx.save();
    ctx.font = '600 11px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    c.getDatasetMeta(i).data.forEach((pt, j) => {
      const v = c.data.datasets[i].data[j];
      if (v == null) return;
      const text = v.toFixed(1) + '%';
      const w = ctx.measureText(text).width;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = C.surface;
      ctx.beginPath();
      ctx.roundRect(pt.x - w / 2 - 4, pt.y - 24, w + 8, 15, 3);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.profit;
      ctx.fillText(text, pt.x, pt.y - 9);
    });
    ctx.restore();
  }
};

let chart = null;
function draw() {
  const lv = DATA.levels[state.dim];
  const rows = lv.values
    .map((name, i) => ({ name, ...totals({ level: state.dim, value: i }) }))
    .filter(r => r.rows && (r.gross || r.profit));
  rows.sort((a, b) => Math.abs(b.gross) - Math.abs(a.gross));
  const top = rows.slice(0, 12);
  const labels = top.map(r => r.name);
  const canDrill = state.dim + 1 < DATA.levels.length;

  const bar = (key, colour, stack) => ({
    type: 'bar', label: label(key) + (state.unit === 'per' ? ' / unit' : ''),
    stack, data: top.map(r => each(r, key)),
    backgroundColor: colour, borderRadius: 4, borderSkipped: false,
    // A 2px gap in the surface colour keeps stacked segments from bleeding into
    // each other, and the two grouped bars apart.
    borderWidth: 2, borderColor: C.surface, maxBarThickness: 64,
  });
  const datasets = [bar('gross', C.gross, 'in')];
  COSTS.forEach(k => datasets.push(bar(k, C[k], 'out')));
  const denom = has.net !== undefined ? label('net') : label('gross');
  // The line is a percentage and the bars are amounts, so it carries its own
  // scale on the right. It goes last so it takes no column of its own in the
  // bar grouping, and order:-1 draws it over them.
  datasets.push({
    type: 'line', label: `${label('profit')} % of ${denom}`, yAxisID: 'y1',
    data: top.map(r => r.margin),
    borderColor: C.profit, backgroundColor: C.profit, borderWidth: 2,
    pointRadius: 4, pointHoverRadius: 7, tension: 0.25, fill: false,
    spanGaps: true, order: -1,
  });

  document.getElementById('legend').innerHTML = datasets.map(d =>
    `<span><i style="background:${d.type === 'line' ? d.borderColor
      : d.backgroundColor}"></i>${d.label}</span>`).join('');

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('bars'), {
    type: 'bar',
    data: { labels, datasets },
    plugins: [pointLabels],
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 220 },
      interaction: { mode: 'index', intersect: false },
      datasets: { bar: { categoryPercentage: 0.8, barPercentage: 0.95 } },
      onHover: (e, els) => {
        e.native.target.style.cursor = (els.length && canDrill) ? 'pointer' : '';
      },
      onClick: (e, els) => {
        if (!canDrill || !els.length) return;
        const name = labels[els[0].index];
        // render() destroys this chart, and Chart.js is still inside its own
        // event dispatch - so the redraw waits for the next task.
        defer(() => setFilter(state.dim, lv.values.indexOf(name)));
      },
      scales: {
        // stacked:true with two stack names puts the pair side by side and
        // centred on the tick; same-stack datasets pile up.
        x: { stacked: true, offset: true, grid: { display: false },
             border: { display: false },
             ticks: { color: C.ink2, autoSkip: false, maxRotation: 30,
                      callback(v) { const t = this.getLabelForValue(v);
                        return t.length > 18 ? t.slice(0, 17) + '…' : t; } } },
        y: { beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             title: { display: true, color: C.ink3,
                      text: state.unit === 'per' ? 'Per unit' : 'Amount' },
             ticks: { color: C.ink3, callback: v => Number(v).toLocaleString() } },
        y1: { position: 'right', grid: { drawOnChartArea: false },
              border: { display: false }, suggestedMin: -10, suggestedMax: 10,
              title: { display: true, text: 'Profit %', color: C.ink3 },
              ticks: { color: C.ink3, callback: v => `${v}%` } }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: C.surface, titleColor: C.ink, bodyColor: C.ink2,
          borderColor: C.grid, borderWidth: 1, padding: 10,
          callbacks: {
            label: ctx => ctx.dataset.yAxisID === 'y1'
              ? `${ctx.dataset.label}: ` + (ctx.parsed.y == null
                  ? 'no net sales' : ctx.parsed.y.toFixed(1) + '%')
              : `${ctx.dataset.label}: ` + (ctx.parsed.y == null ? 'no units'
                  : state.unit === 'per' ? unitFmt(ctx.parsed.y)
                  : Number(ctx.parsed.y).toLocaleString()),
            footer(items) {
              const r = top[items[0].dataIndex];
              const out = COSTS.reduce((a, k) => a + r[k], 0);
              return [`Costs: ${state.unit === 'per'
                        ? (r.qty ? unitFmt(out / r.qty) : 'no units') : fmt(out)}`,
                      `${label('profit')}: ${fmt(r.profit)}`,
                      ...(has.qty === undefined ? [] : [
                        `Qty: ${fmt(r.qty)}`,
                        `ASP: ${r.asp == null ? '-' : unitFmt(r.asp)}`])];
            }
          }
        }
      }
    }
  });

  const blanks = top.filter(r => !r.qty).length;
  document.getElementById('hint').textContent =
    `${label('gross')} beside what it went out on, by ${lv.name}`
    + (rows.length > top.length ? ` (top ${top.length} of ${rows.length})` : '')
    + (state.unit === 'per'
        ? `, divided by the units behind it - so the ${label('gross')} bar is `
          + 'the average selling price and the stack is what a unit costs.'
          + (blanks ? ` ${blanks} of them have no units, so no price.` : '')
        : `. Costs are drawn as amounts;`)
    + ` The line is ${label('profit')} over ${denom}, on the right-hand scale.`
    + (canDrill
        ? ` Click a bar to open it by ${DATA.levels[state.dim + 1].name}.`
        : ' This is the last level; Back steps out.');

  renderTable(top, lv.name, rows.length);
  drawStack();
}

/* The same slice, one bar per member of the level above the bars, each split by
   the level the bars are on. The chart below says what a figure is made of;
   this one says who it came from. */
let stkChart = null;
function drawStack() {
  const xi = state.stkX;
  const xl = DATA.levels[xi];
  const sl = stackLevel();
  ['stkCust', 'stkProd'].forEach((id, i) =>
    document.getElementById(id).classList.toggle('active',
      state.stack === (i ? 'product' : 'customer')));
  const onProd = xi >= DATA.custDepth;
  document.getElementById('stkXCust').classList.toggle('active', !onProd);
  document.getElementById('stkXProd').classList.toggle('active', onProd);
  document.getElementById('stkXProd').disabled = !CHAINS.product.length;
  stackCrumb();
  const figSel = document.getElementById('stkFig');
  figSel.innerHTML = DATA.series
    .filter(x => x.key !== 'net' || has.net !== undefined)
    .map(x => `<option value="${x.key}">${x.label}</option>`).join('');
  figSel.value = state.stkFig;
  document.getElementById('stkBack').disabled = stackBack() === null;
  const pctMode = state.stkScale === 'pct';
  document.getElementById('stkAmt').classList.toggle('active', !pctMode);
  document.getElementById('stkPct').classList.toggle('active', pctMode);

  const plot = document.getElementById('stkPlot');
  if (sl === null) {
    if (stkChart) { stkChart.destroy(); stkChart = null; }
    plot.style.height = '0px';
    document.getElementById('stkLegend').innerHTML = '';
    document.getElementById('stkHint').textContent =
      `${xl.name} is the last ${state.stack} level, so there is nothing below `
      + 'it to stack by. Stack by the other chain, or step back up.';
    return;
  }

  const fig = has[state.stkFig];
  const slice = DATA.combos.filter(c =>
    state.filter.every((want, i) => want < 0 || c.k[i] === want));
  const grid = new Map();                 // x member -> stack member -> value
  const stackTotal = new Map();
  for (const c of slice) {
    const x = xl.values[c.k[xi]];
    const g = DATA.levels[sl].values[c.k[sl]];
    const v = fig === undefined ? 0 : c.v[fig];
    const row = grid.get(x) || new Map();
    row.set(g, (row.get(g) || 0) + v);
    grid.set(x, row);
    stackTotal.set(g, (stackTotal.get(g) || 0) + v);
  }
  // Eight slots, in a fixed order by size. A ninth member folds into Other
  // rather than being handed a generated hue.
  const members = [...stackTotal.entries()]
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).map(e => e[0]);
  const named = members.slice(0, 8);
  const folded = members.length > 8;
  const xs = [...grid.entries()]
    .map(([name, row]) => ({ name, idx: xl.values.indexOf(name),
                             total: [...row.values()].reduce((a, b) => a + b, 0),
                             row }))
    .filter(r => r.total)
    .sort((a, b) => Math.abs(b.total) - Math.abs(a.total))
    .slice(0, 12);

  // In percentage mode each bar is normalised to its own total, so the mix
  // inside a small bar reads as clearly as the mix inside a large one. The
  // amount is kept on the row for the tooltip - a share with no size behind
  // it is how a rounding error comes to look like a trend.
  const raw = g => xs.map(r => r.row.get(g) || 0);
  const scale = (vals) => pctMode
    ? vals.map((v, i) => (xs[i].total ? v / xs[i].total * 100 : 0))
    : vals;
  const series = named.map((g, i) => ({
    label: g, stack: 'a', data: scale(raw(g)), amounts: raw(g),
    backgroundColor: C.stack[i], borderRadius: 3, borderSkipped: false,
    borderWidth: 1, borderColor: C.surface, maxBarThickness: 54,
  }));
  if (folded) {
    const rest = xs.map(r => named.reduce((a, g) => a - (r.row.get(g) || 0),
                                          r.total));
    series.push({
      label: `Other (${members.length - 8})`, stack: 'a',
      data: scale(rest), amounts: rest,
      backgroundColor: C.stack[8], borderRadius: 3, borderSkipped: false,
      borderWidth: 1, borderColor: C.surface, maxBarThickness: 54,
    });
  }
  document.getElementById('stkLegend').innerHTML = series.map(d =>
    `<span><i style="background:${d.backgroundColor}"></i>${d.label}</span>`).join('');
  plot.style.height = Math.max(300, Math.min(520, xs.length * 56 + 120)) + 'px';

  const to = stackDrill();
  const canDrill = to !== null;
  if (stkChart) stkChart.destroy();
  stkChart = new Chart(document.getElementById('stkBars'), {
    type: 'bar', data: { labels: xs.map(r => r.name), datasets: series },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
      interaction: { mode: 'index', intersect: false },
      onHover: (e, els) => {
        e.native.target.style.cursor = (els.length && canDrill) ? 'pointer' : '';
      },
      onClick: (e, els) => {
        if (!canDrill || !els.length) return;
        const idx = xs[els[0].index].idx;
        defer(() => { state.filter[xi] = idx; state.stkX = to; render(); });
      },
      scales: {
        x: { stacked: true, grid: { display: false }, border: { display: false },
             ticks: { color: C.ink2, autoSkip: false, maxRotation: 28,
                      callback(v) { const t = this.getLabelForValue(v);
                        return t.length > 18 ? t.slice(0, 17) + '…' : t; } } },
        y: { stacked: true, beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             max: pctMode ? 100 : undefined,
             title: { display: true, color: C.ink3,
                      text: pctMode ? 'Share of the bar'
                        : DATA.series.find(x => x.key === state.stkFig).label },
             ticks: { color: C.ink3,
                      callback: v => pctMode ? `${v}%`
                        : Number(v).toLocaleString() } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: C.surface, titleColor: C.ink,
          bodyColor: C.ink2, borderColor: C.grid, borderWidth: 1, padding: 10,
          filter: c => c.parsed.y !== 0,
          callbacks: {
            label: c => pctMode
              ? `${c.dataset.label}: ${c.parsed.y.toFixed(1)}%  (${
                  fmt(c.dataset.amounts[c.dataIndex])})`
              : `${c.dataset.label}: ${fmt(c.parsed.y)}`,
            footer: items => [`Total: ${fmt(xs[items[0].dataIndex].total)}`,
              ...(canDrill ? [`click to open by ${DATA.levels[sl].name}`] : [])] } },
      },
    },
  });
  document.getElementById('stkHint').textContent =
    `${DATA.series.find(x => x.key === state.stkFig).label} by ${xl.name}, each `
    + `split by ${DATA.levels[sl].name}`
    + (pctMode ? ', every bar normalised to its own total - the mix, not the '
                 + 'size. The tooltip keeps the amount behind each share' : '')
    + (folded ? `. The eight biggest ${DATA.levels[sl].name.toLowerCase()}s have `
                + `a colour of their own; the rest are folded into Other.` : '.')
    + (canDrill ? ` Click a bar to open it by ${DATA.levels[sl].name}.` : '');
}

/* The levels this chart has been drilled through, each a step back out. Its own
   trail, since it no longer shares one with the chart below. */
function stackCrumb() {
  const crumb = document.getElementById('stkCrumb');
  crumb.innerHTML = '';
  const step = (text, onclick) => {
    if (crumb.children.length) {
      crumb.insertAdjacentHTML('beforeend', '<span class="sep">&rsaquo;</span>');
    }
    if (!onclick) {
      crumb.insertAdjacentHTML('beforeend', `<span class="now">${text}</span>`);
      return;
    }
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = onclick;
    crumb.appendChild(b);
  };
  step('All', () => {
    state.stkX = xChain()[0] ?? 0;
    state.filter = DATA.levels.map(() => -1);
    render();
  });
  DATA.levels.forEach((lv, i) => {
    if (state.filter[i] < 0 || i >= state.stkX) return;
    step(lv.values[state.filter[i]], () => {
      for (let j = i; j < state.filter.length; j++) state.filter[j] = -1;
      state.stkX = i;
      render();
    });
  });
  const sl = stackLevel();
  step(`by ${DATA.levels[state.stkX].name}`
       + (sl === null ? '' : ` / ${DATA.levels[sl].name}`), null);
}

function renderTable(rows, dimName, ofTotal) {
  document.getElementById('tableCard').hidden = !state.table;
  if (!state.table) return;
  const per = state.unit === 'per';
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  // The table mirrors the chart, so its total covers the rows charted - say
  // so when that is not all of them, rather than let it read as the whole file.
  const tot = { name: ofTotal > rows.length ? `Total of these ${rows.length}`
                                            : 'Total',
                gross: sum('gross'), profit: sum('profit'),
                net: sum('net'), qty: sum('qty') };
  COSTS.forEach(k => { tot[k] = sum(k); });
  tot.asp = tot.qty ? tot.net / tot.qty : null;
  const suffix = per ? ' / unit' : '';
  const head = [dimName, label('gross') + suffix,
                ...COSTS.map(k => label(k) + suffix), 'Costs' + suffix,
                label('profit') + suffix, 'Profit %',
                ...(has.qty === undefined ? [] : ['Qty (net)', 'ASP'])];
  const cell = v => (v == null ? '-' : per ? unitFmt(v) : fmt(v));
  const line = r => {
    const costs = COSTS.reduce((a, k) => a + r[k], 0);
    const m = r.net ? (r.profit / r.net) * 100 : null;
    const p = r.profit;
    return [`<td>${r.name}</td>`, `<td>${cell(each(r, 'gross'))}</td>`,
            ...COSTS.map(k => `<td>${cell(each(r, k))}</td>`),
            `<td>${cell(per ? (r.qty ? costs / r.qty : null) : costs)}</td>`,
            `<td class="${p < 0 ? 'neg' : ''}">${cell(each(r, 'profit'))}</td>`,
            `<td class="${m < 0 ? 'neg' : ''}">${
              m == null ? '-' : m.toFixed(1) + '%'}</td>`,
            ...(has.qty === undefined ? [] : [
              `<td>${fmt(r.qty)}</td>`,
              `<td>${r.asp == null ? '-' : unitFmt(r.asp)}</td>`])].join('');
  };
  document.getElementById('tableBox').innerHTML = `<table>
    <thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${line(r)}</tr>`).join('')}</tbody>
    <tfoot><tr>${line(tot)}</tr></tfoot></table>`;
}

document.getElementById('dimPick').onchange = e => {
  state.dim = +e.target.value;
  // Moving the bars back up to a level undoes the narrowing done below it.
  for (let j = state.dim; j < state.filter.length; j++) state.filter[j] = -1;
  render();
};
document.getElementById('backBtn').onclick = () => {
  if (state.dim === 0) return;
  state.dim -= 1;
  for (let j = state.dim; j < state.filter.length; j++) state.filter[j] = -1;
  render();
};
document.getElementById('tableBtn').onclick = () => {
  state.table = !state.table; render(); };
document.getElementById('unitAmt').onclick = () => {
  state.unit = 'amount'; render(); };
document.getElementById('unitPer').onclick = () => {
  state.unit = 'per'; render(); };
document.getElementById('stkCust').onclick = () => {
  state.stack = 'customer'; render(); };
document.getElementById('stkProd').onclick = () => {
  state.stack = 'product'; render(); };
document.getElementById('stkBack').onclick = stackStepUp;
/* Switching the bars to the other chain starts that chain at its top level -
   there is no matching depth to carry across. */
const stkChainTo = i => () => {
  state.stkX = (i ? CHAINS.product : CHAINS.customer)[0] ?? state.stkX;
  for (let j = state.stkX; j < state.filter.length; j++) state.filter[j] = -1;
  render();
};
document.getElementById('stkXCust').onclick = stkChainTo(0);
document.getElementById('stkXProd').onclick = stkChainTo(1);
document.getElementById('stkFig').onchange = e => {
  state.stkFig = e.target.value; render(); };
document.getElementById('stkAmt').onclick = () => {
  state.stkScale = 'amount'; render(); };
document.getElementById('stkPct').onclick = () => {
  state.stkScale = 'pct'; render(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

render();
</script>
</body>
</html>
