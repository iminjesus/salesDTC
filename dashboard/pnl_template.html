                        : `${fmt(n)} unit(s)`)
                     + (amt ? `  (${fmt(amt)}${r ? ' a day' : ''})` : '');
            },
          },
        },
      },
      // The window's labels sit along the top of the plot, so the tallest bar
      // needs somewhere to stop short of them.
      layout: { padding: { top: 4 } },
      scales: {
        x: { grid: { display: false }, border: { display: false },
             ticks: { color: C.ink3, autoSkip: true, maxRotation: 0,
                      maxTicksLimit: 16 } },
        y: { beginAtZero: true, grace: '12%', grid: { color: C.grid },
             border: { display: false },
             ticks: { color: C.ink3, precision: 0 } },
      },
    },
  });
  return true;
}

  document.getElementById('dayVeil').hidden = true;
  if (dayChart) { dayChart.destroy(); dayChart = null; }

/* ── the workbook, written here rather than fetched ─────────────────────────
   This page has to stay one file that opens from an email attachment, so the
   .xlsx is built in the browser with no library: an .xlsx is a zip of XML, and
   a stored (uncompressed) zip is a header, the bytes and a central directory.
   The only arithmetic it needs is a CRC32. tools/xlsx.py writes the same four
   parts the same way, so a workbook from the page and one from the toolchain
   open identically.

   What goes in is what is on screen, not the whole file: the same slice the
   filters leave, the same split the chart is drawn by. A download that quietly
   held more than the page showed would be a different report wearing its
   name. */
let CRC = null;
function crc32(bytes) {
  if (!CRC) {
    CRC = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      CRC[n] = c >>> 0;
    }
  }
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], dir = [];
  let at = 0;
  // One timestamp for the whole archive, in the DOS format the zip header
  // wants: seconds have one bit, so they go in pairs.
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name);
    const body = enc.encode(f.data);
    const crc = crc32(body);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true);
    head.setUint16(4, 20, true);
    head.setUint16(6, 0x0800, true);        // names are UTF-8
    head.setUint16(8, 0, true);             // stored
    head.setUint16(10, time, true);
    head.setUint16(12, date, true);
    head.setUint32(14, crc, true);
    head.setUint32(18, body.length, true);
    head.setUint32(22, body.length, true);
    head.setUint16(26, name.length, true);
    head.setUint16(28, 0, true);
    parts.push(new Uint8Array(head.buffer), name, body);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true);
    cen.setUint16(4, 20, true);
    cen.setUint16(6, 20, true);
    cen.setUint16(8, 0x0800, true);
    cen.setUint16(10, 0, true);
    cen.setUint16(12, time, true);
    cen.setUint16(14, date, true);
    cen.setUint32(16, crc, true);
    cen.setUint32(20, body.length, true);
    cen.setUint32(24, body.length, true);
    cen.setUint16(28, name.length, true);
    cen.setUint32(42, at, true);
    dir.push(new Uint8Array(cen.buffer), name);
    at += 30 + name.length + body.length;
  }
  const dirAt = at;
  let dirLen = 0;
  dir.forEach(p => { dirLen += p.length; });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, dirLen, true);
  end.setUint32(16, dirAt, true);
  const all = [...parts, ...dir, new Uint8Array(end.buffer)];
  let total = 0;
  all.forEach(p => { total += p.length; });
  const out = new Uint8Array(total);
  let o = 0;
  all.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}

const xEsc = v => String(v).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const colLetter = n => {
  let s = '';
  while (n) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s;
              n = (n - r - 1) / 26; }
  return s;
};

/* Styles, the same six tools/xlsx.py uses, so the two look alike in Excel. */
const XL_STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="3"><numFmt numFmtId="164" formatCode="#,##0;(#,##0);-"/>
<numFmt numFmtId="165" formatCode="0.0%;(0.0%);-"/>
<numFmt numFmtId="166" formatCode="#,##0.00;(#,##0.00);-"/></numFmts>
<fonts count="2"><font><sz val="11"/><name val="Arial"/></font>
<font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Arial"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF44546A"/>
<bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1"
 applyFill="1" applyAlignment="1"><alignment horizontal="center"
 vertical="center" wrapText="1"/></xf>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

/* A cell carries its type: a number goes in as a number so the sheet can be
   summed, a percentage keeps its format, and everything else is an inline
   string - no shared-string table to keep in step. */
function sheetXml(rows, widths) {
  const body = rows.map((row, r) => {
    const cells = row.map((v, c) => {
      if (v === null || v === undefined || v === '') return '';
      const ref = `${colLetter(c + 1)}${r + 1}`;
      if (r === 0) return `<c r="${ref}" s="1" t="inlineStr"><is><t>${xEsc(v)}</t></is></c>`;
      if (v && typeof v === 'object' && v.pct !== undefined) {
        return Number.isFinite(v.pct)
          ? `<c r="${ref}" s="3"><v>${v.pct / 100}</v></c>` : '';
      }
      // A price, not an amount. The amounts are whole dollars and read better
      // for it; a price is quoted to the cent, and 2,344.33 shown as 2,344 is
      // a figure nobody can tie back to the net and the units it came from.
      if (v && typeof v === 'object' && v.unit !== undefined) {
        return Number.isFinite(v.unit)
          ? `<c r="${ref}" s="4"><v>${v.unit}</v></c>` : '';
      }
      if (typeof v === 'number') {
        return Number.isFinite(v) ? `<c r="${ref}" s="2"><v>${v}</v></c>` : '';
      }
      return `<c r="${ref}" s="0" t="inlineStr"><is><t xml:space="preserve">${
        xEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r + 1}">${cells}</row>`;
  }).join('');
  const cols = (widths || []).map((w, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2"
 activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${body}</sheetData></worksheet>`;
}

function buildXlsx(sheets) {
  const files = [];
  const types = sheets.map((s, i) =>
    `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  files.push({ name: '[Content_Types].xml', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${types}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>` });
  files.push({ name: '_rels/.rels', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` });
  // Excel refuses a sheet name over 31 characters or carrying : \ / ? * [ ]
  const used = new Set();
  const safe = n => {
    let s = String(n).replace(/[:\\\/?*\[\]]/g, ' ').slice(0, 31) || 'Sheet';
    let i = 2;
    while (used.has(s)) s = `${s.slice(0, 28)} ${i++}`;
    used.add(s);
    return s;
  };
  const tabs = sheets.map((s, i) =>
    `<sheet name="${xEsc(safe(s.name))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');
  files.push({ name: 'xl/workbook.xml', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${tabs}</sheets></workbook>` });
  const rels = sheets.map((s, i) =>
    `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  files.push({ name: 'xl/_rels/workbook.xml.rels', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${rels}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` });
  files.push({ name: 'xl/styles.xml', data: XL_STYLES });
  sheets.forEach((s, i) => files.push({
    name: `xl/worksheets/sheet${i + 1}.xml`,
    data: sheetXml(s.rows, s.widths) }));
  return zipStore(files);
}

function saveXlsx(name, sheets) {
  const blob = new Blob([buildXlsx(sheets)], { type:
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Every combination in the slice, month by month.

   The chart and the table are the page's own summaries; this is what they are
   summaries of - one row per customer-and-product combination, one column per
   month, so the whole thing can be pivoted without going back to the export.

   One sheet per figure rather than one sheet with the figures interleaved:
   months across the top is only readable while a row means one thing, and a
   header of "Aug 26 Net / Aug 26 Profit / Aug 26 Qty" across nine months is
   not a sheet anybody filters.

   The filters apply. Narrowed to E-STORE, that is the DTC business month by
   month; narrowed further, it is whatever is on screen. Period and Cumulative
   do not: those shape the chart, and a detail sheet that quietly held quarters
   where it says months would be the one table in the book that lies. */
function detailSheets() {
  const S = DATA.series.length;
  const M = DATA.months.length;
  const rows = new Map();
  for (const c of DATA.combos) {
    if (!inSlice(c)) continue;
    const key = c.k.join('\u0001');
    let e = rows.get(key);
    if (!e) { e = { k: c.k, n: 0, v: new Float64Array(M * S) }; rows.set(key, e); }
    e.n += c.n;
    const at = c.m * S;
    for (let j = 0; j < c.v.length; j++) e.v[at + j] += c.v[j];
  }
  if (!rows.size) return [];

  const keep = ['gross', 'deduction', 'cogs', 'opex', 'net', 'profit', 'qty']
    .filter(k => has[k] !== undefined);
  // The cost lines are stored signed and the table shows them positive; the
  // two reading differently about the same number is worse than either.
  const POS = new Set(['deduction', 'cogs', 'opex', 'qty']);
  const names = DATA.levels.map(lv => lv.name);
  const months = DATA.months.map(m => m.label);
  const list = [...rows.values()];

  const sheets = keep.map(k => {
    const j = has[k];
    const sign = POS.has(k) ? Math.abs : (x => x);
    const body = list.map(e => {
      const cells = months.map((_, m) => sign(e.v[m * S + j]));
      const total = cells.reduce((a, b) => a + b, 0);
      return { k: e.k, n: e.n, cells, total };
    });
    // Biggest first, so the sheet opens on what matters rather than on
    // whatever order the combinations happened to be built in.
    body.sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
    const head = [...names, ...months, 'Total', 'Rows'];
    return {
      name: label(k),
      widths: [...names.map(() => 22), ...months.map(() => 14), 14, 8],
      rows: [head, ...body.map(r => [
        ...r.k.map((v, i) => DATA.levels[i].values[v]),
        ...r.cells.map(v => (v === 0 ? '' : v)),
        r.total, r.n])],
    };
  });

  // Two more, and they are prices rather than amounts: the list price the plan
  // set, and what was actually collected per unit. Neither column sums - the
  // summary column is the figure for the whole period, weighted by the units
  // that earned it, which is why it is headed Weighted and Period rather than
  // Total. The gap between the two is the discount, so Off RRP % sits beside
  // the ASP it is read from.
  //
  // RRP comes from the promotion plan by SKU, so it is only as complete as the
  // plan: a product the plan never names has no list price and the cell is
  // left empty rather than filled with the price charged, which would read as
  // a product that sold at list.
  if (has.qty !== undefined && has.net !== undefined && list.length) {
    const jn = has.net, jq = has.qty;
    const body = list.map(e => {
      const asp = [], rrp = [];
      let net = 0, units = 0, w = 0, wq = 0, wnet = 0;
      months.forEach((_, m) => {
        const q = Math.abs(e.v[m * S + jq]);
        const n = e.v[m * S + jn];
        asp.push(q ? { unit: n / q } : '');
        net += n; units += q;
        const r = rrpAt(m, e.k);
        rrp.push(r === null ? '' : { unit: r });
        // Weighted by the units of the month it was the price in, so a price
        // drop halfway through the period lands where the volume was. The
        // months with a list price also keep their own net, because the
        // discount has to be read off the units it covers - a period ASP that
        // included a month the plan says nothing about would divide one basis
        // by another.
        if (r !== null && q) { w += r * q; wq += q; wnet += n; }
      });
      const per = units ? net / units : null;
      const rrpW = wq ? w / wq : null;
      return { k: e.k, n: e.n, asp, rrp, units, per, rrpW,
               off: rrpW ? (1 - (wnet / wq) / rrpW) * 100 : null };
    });
    body.sort((a, b) => b.units - a.units);
    const key = r => r.k.map((v, i) => DATA.levels[i].values[v]);
    const widths = [...names.map(() => 22), ...months.map(() => 14), 14, 10];
    // Only where the plan priced something: without it the discount column is
    // a header over an empty column, which reads as every unit having sold at
    // list rather than as nothing having a list price.
    const priced = body.some(r => r.rrpW !== null);
    if (priced) {
      sheets.push({ name: 'RRP', widths,
        rows: [[...names, ...months, 'Weighted', 'Units'],
               ...body.map(r => [...key(r), ...r.rrp,
                                 r.rrpW === null ? '' : { unit: r.rrpW },
                                 r.units || ''])] });
    }
    sheets.push({ name: 'ASP',
      widths: priced ? [...widths.slice(0, -1), 14, 10] : widths,
      rows: [[...names, ...months, 'Period', ...(priced ? ['Off RRP %'] : []),
              'Units'],
             ...body.map(r => [...key(r), ...r.asp,
                               r.per === null ? '' : { unit: r.per },
                               ...(priced ? [r.off === null
                                             || !Number.isFinite(r.off)
                                             ? '' : { pct: r.off }] : []),
                               r.units || ''])] });
  }
  return sheets;
}

/* RRP, ASP and the gap between them, for whatever is picked.

   The three belong together: a price on its own says nothing, and the one
   figure anyone wants off them - how far under list the slice actually ran -
   is only meaningful if the two sides are read over the same units. They are:
   the discount is the priced units' own ASP over their own list price, and the
   tile says how much of the slice that is whenever it is not all of it.

   ASP is the whole slice, because that one is a fact about the slice rather
   than about the plan's coverage. Where the two bases differ the discount tile
   says so rather than quietly using a different denominator from the tile
   beside it. */
function priceTiles() {
  const card = document.getElementById('priceCard');
  const on = has.qty !== undefined && has.net !== undefined;
  card.hidden = !on;
  if (!on) return;
  const all = totals();
  const r = sliceRrp();
  const qty = Math.abs(all.qty);
  const share = r && qty ? (r.qty / qty) * 100 : null;
  // Said once, under whichever tile it qualifies: the plan does not price
  // everything, and a page built without one prices nothing.
  const anyPlan = (DATA.months || []).some(
    m => m.rrp && Object.keys(m.rrp).length);
  const over = r === null
    ? (anyPlan ? 'nothing picked has a list price' : 'no promotion plan read')
    : share !== null && share < 99.5
      ? `over ${share.toFixed(0)}% of the units`
      : '';
  const off = r ? (1 - r.asp / r.rrp) * 100 : null;
  // With the plan short of a few products the two tiles are over different
  // sets, and a list price that reads lower than the ASP beside it looks like
  // an error until you know why. The discount's own ASP is what explains it,
  // so it is said where the discount is.
  const basis = r && share !== null && share < 99.5
    ? `${over}, whose ASP is ${unitFmt(r.asp)}` : over;
  document.getElementById('priceKpis').innerHTML = [
    ['RRP', r ? unitFmt(r.rrp) : '-', '', over],
    ['ASP', all.asp == null ? '-' : unitFmt(all.asp), '',
     r && share !== null && share < 99.5 ? 'all of the units' : ''],
    // Below list is the normal direction, so it is not marked; above list is
    // either a price rise the plan has not caught up with or a mis-keyed line,
    // and either way it is worth seeing in red.
    ['Average discount %', off === null ? '-' : off.toFixed(1) + '%',
     off !== null && off < 0 ? 'neg' : '', basis],
  ].map(([k, v, cls, note]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div>`
    + (note ? `<div class="n">${note}</div>` : '') + '</div>'
  ).join('');
}

/* The plan's list price for one combination in one month, or null.

   By SKU, because that is what a list price is a property of. A row whose
   product level is coarser than the SKU - and every detail row carries the SKU,
   so that is not this page - would have no single answer. */
function rrpAt(m, k) {
  const i = DATA.levels.findIndex(lv => lv.name === 'SKU');
  if (i < 0 || i >= k.length) return null;
  const v = (DATA.months[m].rrp || {})[DATA.levels[i].values[k[i]]];
  return Number.isFinite(v) ? v : null;
}

/* What the whole slice was meant to sell for, weighted by the units that sold.

   The denominator of the discount on the Scope sheet, and it has to be read
   off the same combinations the detail sheets hold or the two would disagree
   about the same slice. */
function sliceRrp() {
  if (has.qty === undefined || has.net === undefined) return null;
  let w = 0, q = 0, net = 0;
  for (const c of DATA.combos) {
    if (!inSlice(c)) continue;
    const r = rrpAt(c.m, c.k);
    if (r === null) continue;
    const u = Math.abs(c.v[has.qty]);
    if (!u) continue;
    w += r * u; q += u; net += c.v[has.net];
  }
  // The net of the same units, so the discount is one basis divided by itself:
  // the slice's own ASP includes whatever the plan never priced, and dividing
  // that by a list price read off the rest is how a book ends up quoting a
  // discount nobody ran.
  return q ? { rrp: w / q, qty: q, asp: net / q } : null;
}

/* What the sheets hold: the figures behind the chart, the breakdown the table
   shows, every combination behind both, and the narrowing in force - so a
   workbook sent on says which slice it is of. */
function exportBook() {
  const pct = v => (v == null || !Number.isFinite(v) ? '' : { pct: v });
  const sheets = [];

  // 1. the chart, exactly as drawn: one row per series, one column per period
  if (stkChart) {
    const labels = stkChart.data.labels || [];
    const rows = [['Series', ...labels]];
    stkChart.data.datasets.forEach(d => {
      if (d.label == null) return;
      // The margin lines are read off the second axis and are percentages;
      // writing them beside the amounts under a thousands format turned 14.4%
      // into "14", which is the one number on the sheet nobody could place.
      const isPct = d.yAxisID === 'y1';
      rows.push([d.label, ...labels.map((_, i) => {
        const v = d.data[i];
        // A band drawn as a floating bar carries [from, to]; its height is
        // what the chart shows, so that is what the sheet gets.
        const n = Array.isArray(v) ? v[1] - v[0] : v;
        if (!Number.isFinite(n)) return '';
        return isPct ? { pct: n } : n;
      })]);
    });
    sheets.push({ name: 'Chart', rows,
                  widths: [34, ...labels.map(() => 14)] });
  }

  // 2. the table, every row of it - the page shows the top twelve because a
  //    screen runs out, which is not a reason for the workbook to stop there
  if (lastTable) {
    const { rows, dimName } = lastTable;
    const head = [dimName, label('gross'), ...COSTS.map(k => label(k)), 'Costs',
                  label('profit'), 'Profit %',
                  ...(has.qty === undefined ? [] : ['Qty (net)', 'ASP'])];
    const line = r => {
      const costs = COSTS.reduce((a, k) => a + r[k], 0);
      const m = r.net ? (r.profit / r.net) * 100 : null;
      return [r.name, each(r, 'gross'), ...COSTS.map(k => each(r, k)), costs,
              each(r, 'profit'), pct(m),
              ...(has.qty === undefined ? []
                  : [r.qty, r.asp == null ? '' : { unit: r.asp }])];
    };
    const out = [head, ...rows.map(line)];
    const tot = totals();
    out.push([]);
    out.push(line({ name: 'Total', ...tot }));
    sheets.push({ name: 'Table', rows: out,
                  widths: [34, ...head.slice(1).map(() => 14)] });
  }

  // 3. everything the two above are summaries of
  const detail = detailSheets();
  detail.forEach(d => sheets.push(d));

  // 4. what was on screen when it was taken
  const all = totals();
  const rrpAll = sliceRrp();
  const scope = DATA.levels
    .map((lv, i) => (state.filter[i] >= 0 ? [lv.name, lv.values[state.filter[i]]] : null))
    .filter(Boolean);
  const sl = splitLevel();
  sheets.push({ name: 'Scope', widths: [26, 46], rows: [
    ['Item', 'Value'],
    ['Report', DATA.title],
    ['Source', DATA.file],
    ['Rows read', DATA.rows],
    ['Taken at', new Date().toLocaleString()],
    [],
    ['Period', state.period === 'quarter' ? 'Quarter' : 'Month'],
    ['Cumulative', state.cumul ? 'Yes' : 'No'],
    ['Stack by', state.stack],
    ['Split by', state.stack === 'orders' ? 'when ordered'
                 : sl === null ? '(none)' : DATA.levels[sl].name],
    ['Scale', state.stkScale === 'pct' ? '% of bar' : 'Amount'],
    [],
    ['Detail rows', detail.length ? detail[0].rows.length - 1 : 0],
    ['Detail sheets', detail.map(d => d.name).join(', ') || '(none)'],
    [],
    ['Filters in force', scope.length ? '' : '(none - the whole file)'],
    ...scope.map(([k, v]) => [k, v]),
    // Not a filter: nothing on the page can bring these back, so a workbook
    // that did not name them would be a slice nobody could reconstruct.
    ...((DATA.dropped || []).length
        ? [[], ['Left out of the build', DATA.dropped.join('; ')]] : []),
    [],
    [label('gross'), each(all, 'gross')],
    ...COSTS.map(k => [label(k), each(all, k)]),
    // Net is on the detail sheets and on the chart's denominator but not in
    // the page's KPI strip, and a total the workbook uses has to be in the
    // workbook's own summary or the two cannot be tied together.
    ...(has.net === undefined ? [] : [[label('net'), all.net]]),
    [label('profit'), each(all, 'profit')],
    ['Profit %', pct(all.margin)],
    ...(has.qty === undefined ? [] : [['Qty (net)', all.qty],
                                      ['ASP', all.asp == null ? ''
                                              : { unit: all.asp }]]),
    // And what it was meant to be. The two together are the discount the slice
    // actually ran at, which is the figure the detail sheets are read for.
    ...(rrpAll === null ? [] : [
      ['RRP (weighted)', { unit: rrpAll.rrp }],
      ['ASP of those units', { unit: rrpAll.asp }],
      ['Off RRP %', pct((1 - rrpAll.asp / rrpAll.rrp) * 100)],
      ['Units with a list price', rrpAll.qty],
    ]),
  ] });

  const stem = (location.pathname.split('/').pop() || 'pnl')
    .replace(/\.html?$/i, '') || 'pnl';
  saveXlsx(`${stem}.xlsx`, sheets);
}

document.getElementById('xlsBtn').onclick = exportBook;
document.getElementById('dayClose').onclick = closeCampaign;
document.getElementById('dayVeil').onclick = e => {
  // Only the veil itself: a click inside the sheet is a click on the chart.
  if (e.target.id === 'dayVeil') closeCampaign();
};
document.getElementById('dayBtn').onclick = () => {
  const i = campaignLevels().find(j => state.filter[j] >= 0);
  if (i !== undefined) openCampaign(DATA.levels[i].values[state.filter[i]]);
};

rebind();
startHere();
render();
</script>
</body>
