/* The percentage above each point of the line, on a plate in the surface
   colour so it stays readable where the line crosses a bar. */
const pointLabels = {
  id: 'pointLabels',
  afterDatasetsDraw(c) {
    // Only the line that asks for it. The split draws one dotted line per
    // member as well, and labelling all of them would bury the chart it is
    // drawn over.
    // The solid line always; the dotted band lines when the page asks for them.
    // Labelling all of them by default would bury the chart they are drawn
    // over, which is why this is a switch and not the way it is built.
    const o = c.options.plugins.pointLabels || {};
    const want = c.data.datasets
      .map((d, n) => [d, n])
      .filter(([d]) => d.type === 'line' && (d.labelPoints || (o.all && d.bandLine)));
    if (!want.length) return;
    const { ctx } = c;
    ctx.save();
    ctx.font = '600 11px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    want.forEach(([d, i]) => {
      ctx.font = (d.labelPoints ? '600 11px ' : '600 10px ')
        + '-apple-system, "Segoe UI", Roboto, sans-serif';
      c.getDatasetMeta(i).data.forEach((pt, j) => {
        const v = d.data[j];
        if (v == null) return;
        const text = v.toFixed(1) + '%';
        const w = ctx.measureText(text).width;
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = C.surface;
        ctx.beginPath();
        ctx.roundRect(pt.x - w / 2 - 4, pt.y - 24, w + 8, 15, 3);
        ctx.fill();
        ctx.globalAlpha = 1;
        // Each in its own line's colour, or three sets of numbers in one
        // colour would say nothing about which line they belong to.
        ctx.fillStyle = d.labelPoints ? C.profit : d.borderColor;
        ctx.fillText(text, pt.x, pt.y - 9);
      });
    });
    ctx.restore();
  }
};

/* What the page is on: the slice's own rows at the drill level, which the KPIs
   and the table read. The chart itself is drawn by drawStack(), which puts this
   same P&L beside the figure's breakdown rather than in a second chart. */
function draw() {
  // The table breaks the slice down by whatever the chart is splitting by, so
  // the two always say the same thing.
  const di = splitLevel() ?? state.dim;
  const lv = DATA.levels[di];
  const rows = lv.values
    .map((name, i) => ({ name, ...totals({ level: di, value: i }) }))
    .filter(r => r.rows && (r.gross || r.profit));
  rows.sort((a, b) => Math.abs(b.gross) - Math.abs(a.gross));
  const top = rows.slice(0, 12);
  // Kept for the Excel download, which takes every row: the screen stops at
  // twelve because it runs out of room, which is not a reason for a workbook
  // to stop there too.
  lastTable = { rows, dimName: lv.name };
  renderTable(top, lv.name, rows.length);
  // The monthly chart first: it sizes its own plot to the number of columns
  // it has, and the daily card takes that height so the two stand the same.
  drawStack();
  drawDayTrend();
}

/* Time on the x axis, the whole file in one chart.

   Every month the build read is a bar, in order, and what is drawn on it is the
   slice the filters leave. So the page opens on the year rather than on one
   month, and narrowing to MX redraws the same months with only MX in them -
   the question "how did this move" is answered without changing charts.

   Two shapes, chosen by Figure:

     P&L   two bars a month: what came in, and what it went out on, stacked.
     else  one bar a month, split by the level the drill is on - who it came
           from. Clicking a segment narrows to it and steps the split down.

   The profit line is on both, each point carrying its own figure, so
   switching never loses it. */
let stkChart = null;
let lastTable = null;
/* The open month, day by day, off the order export.

   Its own chart rather than another width of the one below it, because it is a
   different measurement: the orders run ahead of the P&L, so October's days
   are drawn while October's profit does not exist yet. What it shares with the
   page is the narrowing and the split - pick a Div 3 or a customer and both
   charts answer it - and what it keeps to itself is the figure and the running
   total, because an order's value and net sales are not the same number and a
   control that moved both would be claiming they were. */
/* The promotion bands keep a fixed order and a fixed colour, in both charts.
   A band sorted by size moves between columns, and a bar whose parts change
   places along a time axis cannot be read at all - and the daily chart sits
   directly over the monthly one, so a band that changed colour between them
   would be read as two different things. */
const BAND_ORDER = ['DTC only', 'DTC + Nation-wide', 'Nation-wide only',
                    '(no order matched)', 'Not in the plan', 'No promotion'];
const BAND_COLOUR = { 'DTC only': 0, 'DTC + Nation-wide': 2,
                      'Nation-wide only': 4, 'Not in the plan': 7,
                      '(no order matched)': 7, 'No promotion': 8 };

/* The month to date against the target, by product group.

   The chart above says whether the month is on plan; this says which products
   are carrying it and which are behind, which is the question a number on its
   own never answers. Same month, same target, same narrowing - only the axis
   changes, from days to products.

   The rows are the product tree the page drills - Biz, then Div 1, Div 2,
   Div 3 - with each parent carrying its children's total, so a business that
   is behind can be read where it sits. The target is set at Div 3, which is
   where the tree ends.

   A level that repeats the one above it is not a step and gets no row of its
   own: Div 1 DA under Biz CE is a step, Div 2 REF under Div 1 REF is the same
   thing said twice, and the drill skips those for the same reason.

   Money only. The target is an amount and a quantity has no target, so the
   table stays on the order value whatever the chart's figure is - and says so
   rather than quietly tabling a different thing from the one above it. */
const MON = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep',
             'Oct', 'Nov', 'Dec'];

const ACH_TREE = ['Biz', 'Div 1', 'Div 2', 'Div 3'];

function drawAch(D, lastDay) {
  const card = document.getElementById('achCard');
  const T = TARGET;
  // Two readings of the same month, from two columns of the same payload.
  // The order one is only written where the build read the month that way,
  // so the switch is there when there is something to switch to.
  const series = k => D.series.findIndex(x => x.key === k);
  const canOrd = series('ogross') >= 0;
  const base = canOrd && state.achBase === 'order' ? 'order' : 'payment';
  const money = series(base === 'order' ? 'ogross' : 'gross');
  if (!state.ach || !T || !T.rows || !T.rows.length || !D || money < 0) {
    card.hidden = true;
    return;
  }
  card.hidden = false;
  document.getElementById('achBase').hidden = !canOrd;
  document.getElementById('achPay').classList.toggle('active',
                                                     base === 'payment');
  document.getElementById('achOrd').classList.toggle('active',
                                                     base === 'order');
  const li = ACH_TREE.map(n => D.levels.findIndex(lv => lv.name === n));
  const tj = ACH_TREE.map(n => T.levels.indexOf(n));
  const at = T.levels.map(n => D.levels.findIndex(lv => lv.name === n));
  const mine = new Set(at.filter(i => i >= 0));
  // A narrowing on something the target has no key for - a Range, a model, a
  // campaign - cannot be applied to it, and a table that ignored it would put
  // a whole month's target beside a slice of a month's sales.
  const outside = [];
  for (let i = 0; i < state.filter.length; i++) {
    if (state.filter[i] >= 0 && !mine.has(i)) outside.push(D.levels[i].name);
  }

  // One tree, both sides of the ratio on it: every node carries its own
  // subtree's target and actual, so a parent row is a real subtotal and not a
  // number assembled separately from the rows under it.
  const root = { kids: new Map(), target: 0, actual: 0 };
  const add = (path, key, v) => {
    let node = root;
    node[key] += v;
    for (const name of path) {
      let k = node.kids.get(name);
      if (!k) node.kids.set(name, k = { name, kids: new Map(),
                                        target: 0, actual: 0 });
      k[key] += v;
      node = k;
    }
  };
  if (!outside.length) {
    for (const r of T.rows) {
      let ok = true;
      for (let j = 0; j < at.length && ok; j++) {
        const i = at[j];
        if (i < 0 || state.filter[i] < 0) continue;
        ok = r.k[j] !== null && D.levels[i].values[state.filter[i]] === r.k[j];
      }
      if (ok) add(tj.map(j => (r.k[j] === null ? '(not matched)' : r.k[j])),
                  'target', r.v);
    }
  }
  for (const c of D.combos) {
    if (!inSlice(c)) continue;
    add(li.map(i => D.levels[i].values[c.k[i]]), 'actual', c.v[money] || 0);
  }

  // Flattened, with the repeats folded away and the shut branches left out.
  // A Blue File names seventeen product groups, so the tree opens to the
  // divisions and the rest is a click; Expand all drops that floor.
  const shownTo = state.achAll ? 99 : 1;
  const open = (key, depth) =>
    (depth < shownTo) !== state.achFlip.has(key);
  const list = [];
  const walk = (node, depth, above, path) => {
    const kids = [...node.kids.values()]
      .sort((a, b) => b.target - a.target || b.actual - a.actual);
    for (const k of kids) {
      // A level repeating the one above it is not a step, so it is not a
      // branch either: its children belong to the row already drawn.
      if (k.name === above) { walk(k, depth, above, path); continue; }
      const key = path + '\u0001' + k.name;
      // Whether it has anything under it, once the repeats are folded: a row
      // with one fold and nothing else is a leaf however deep the key goes.
      let under = k;
      while (under.kids.size === 1
             && [...under.kids.values()][0].name === under.name) {
        under = [...under.kids.values()][0];
      }
      const kids2 = under.kids.size > 0;
      const up = kids2 && open(key, depth);
      list.push({ name: k.name, depth, target: k.target, actual: k.actual,
                  key, kids: kids2, open: up });
      if (up) walk(k, depth + 1, k.name, key);
    }
  };
  walk(root, 0, null, '');

  const days = T.days || 0;
  const share = days ? lastDay / days : 0;      // of the month that has run
  const rate = r => {
    r.due = r.target * share;
    r.ach = r.due ? (r.actual / r.due) * 100 : null;
    return r;
  };
  list.forEach(rate);
  // The root, not the rows added up: they are a tree, and adding them would
  // count every parent again.
  const tot = rate({ name: 'Total', depth: 0,
                     target: root.target, actual: root.actual });
  // There is no "projected achievement" column, and there cannot be one: the
  // target is spread evenly over the days, so projecting the month at the
  // rate so far and dividing by the month's target gives back the achievement
  // to date, exactly. It was in this table for one run and every row of it
  // repeated the column four places to its left.

  const pc = v => (v == null ? '-' : v.toFixed(0) + '%');
  // Three bands, and no more: on plan, nearly, behind. A gradient would put a
  // different colour on every row and say nothing about which to look at.
  const hue = v => (v == null ? 'var(--ink-3)' : v >= 100 ? 'var(--k3)'
                    : v >= 90 ? 'var(--k4)' : 'var(--neg)');
  const bar = v => (v == null ? ''
    : `<span class="achBar"><i style="width:${
        Math.max(2, Math.min(v, 150) / 150 * 100).toFixed(1)}%;background:${
        hue(v)}"></i></span>`);
  const line = r => [
    `<td class="tree d${r.depth}"${r.key === undefined ? '' :
      ` data-k="${r.key.replace(/"/g, '&quot;')}" data-kids="${
        r.kids ? 1 : 0}"`}><span class="tw">${
      r.kids === undefined ? '' : r.kids ? (r.open ? '\u25be' : '\u25b8')
                                         : ''}</span>${r.name}</td>`,
    `<td>${fmt(r.target)}</td>`,
    `<td>${fmt(r.due)}</td>`,
    `<td>${fmt(r.actual)}</td>`,
    `<td class="ach"><span class="achWrap">${bar(r.ach)}<span class="achNum" `
    + `style="color:${hue(r.ach)}">${pc(r.ach)}</span></span></td>`,
  ].join('');
  const head = ['Product', 'Target (month)',
                `Target to ${lastDay} ${MON[T.ym % 100]}`, 'Actual to date',
                'Achievement'];
  document.getElementById('achTitle').textContent =
    `Achievement  \u00b7  ${MON[T.ym % 100]} ${Math.floor(T.ym / 100)}  `
    + `\u00b7  ${base === 'order' ? 'ordered' : 'payable'}  `
    + `\u00b7  ${T.version} (${T.currency})  \u00b7  `
    + `${tot.ach == null ? '-' : Math.round(tot.ach) + '%'} to ${lastDay} `
    + MON[T.ym % 100];
  document.getElementById('achAll').classList.toggle('active', state.achAll);
  document.getElementById('achAll').textContent =
    state.achAll ? 'Collapse' : 'Expand all';
  document.getElementById('achBox').innerHTML = `<table>
    <thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${list.map(r => `<tr class="d${r.depth}">${line(r)}</tr>`)
                 .join('')}</tbody>
    <tfoot><tr>${line(tot)}</tr></tfoot></table>`;

  // Target money this slice cannot account for: a product group with no Div 3
  // in the data, or a row the mix could not split to a customer. It is real
  // target and it is not in the total, so the table says how much rather than
  // letting a reader add the column up and believe it.
  const whole = T.rows.reduce((a, r) => a + r.v, 0);
  const left = Math.round(whole - tot.target);
  const an = [];
  if (base === 'order') {
    an.push('Order base: every order placed this month, on the day it was '
            + 'placed - nothing carried in from last month, and the part '
            + 'leaving after the month still in. It is what the month took '
            + 'in, not what it will be paid.');
  }
  if (outside.length) {
    an.push(`${outside.join(' and ')} ${outside.length > 1 ? 'are' : 'is'} `
            + 'narrowed, and the target is set by product group, not below '
            + 'it - so there is nothing to compare this slice against and '
            + 'only the actuals are shown.');
  } else if (left > 0) {
    an.push(`${fmt(left)} of the month's ${fmt(whole)} target is not in this `
            + 'table: a product group with no match in the data, or one the '
            + 'customer mix could not place.');
  }
  const ah = document.getElementById('achHint');
  ah.textContent = an.join(' ');
  ah.hidden = !an.length;
}

/* Which pin the pointer is on, if any. The dot and its label are one target:
   a 7px circle is not something to ask anyone to hit. */
function pinAt(ch, e) {
  if (!ch.$pins || !ch.$pins.length || !e.native) return null;
  const r = ch.canvas.getBoundingClientRect();
  const x = e.native.clientX - r.left;
  const y = e.native.clientY - r.top;
  const hit = ch.$pins.find(q => Math.abs(y - q.y) <= 7
                            && x >= q.x - 6 && x <= q.x + 8 + q.w);
  return hit ? hit.name : null;
}

let dayTrend = null;
/* The month's target over the days: the Blue File's Sokbo, split to the
   customer by the last six months' mix at build time, divided evenly over the
   calendar days of the month. It is a sum over the same names the menu
   narrows by, so narrowing the page narrows the line.

   Its key stops at Div 3 - a target is set by product group, not by range or
   model - so a narrowing below that, or on the promotion chain, has no target
   to draw and the line comes off with the reason in the hint. */
function dayTarget(D) {
  const T = TARGET;
  if (!T || !T.rows || !T.rows.length) return null;
  const at = T.levels.map(n => D.levels.findIndex(lv => lv.name === n));
  const mine = new Set(at.filter(i => i >= 0));
  for (let i = 0; i < state.filter.length; i++) {
    if (state.filter[i] >= 0 && !mine.has(i)) {
      return { off: `${D.levels[i].name} is narrowed, and the target is set `
                    + 'by product group, not below it' };
    }
  }
  let sum = 0;
  for (const r of T.rows) {
    let ok = true;
    for (let j = 0; j < at.length && ok; j++) {
      const i = at[j];
      if (i < 0 || state.filter[i] < 0) continue;
      ok = r.k[j] !== null && D.levels[i].values[state.filter[i]] === r.k[j];
    }
    if (ok) sum += r.v;
  }
  return { month: sum, day: sum / T.days, days: T.days, ym: T.ym,
           version: T.version, currency: T.currency, file: T.file,
           mix: T.mix || [] };
}

function drawDayTrend() {
  const D = VIEWS.day;
  const card = document.getElementById('dayCard');
  if (!D || !D.months.length) {
    card.hidden = true;
    document.getElementById('achCard').hidden = true;
    return;
  }
  card.hidden = false;

  // The menu's figure, read onto what an order export has. Money is money -
  // the page's Net Amount is net sales and this is what the order was worth,
  // which is why the heading names it rather than borrowing the menu's word.
  // P&L is a statement a day has no columns for, so it falls to the money.
  const figs = D.series.map((x, i) => ({ key: x.key, label: x.label, at: i }));
  const f = figs.find(x => x.key === (state.stkFig === 'qty' ? 'qty' : 'gross'))
            || figs[0];
  const cumul = state.cumul;
  const pct = state.stkScale === 'pct' && !(state.pnl && has.profit !== undefined);
  document.getElementById('dayVals').classList.toggle('active', state.dayVals);

  // The same level the chart below is cut by, so the two read together. The
  // levels are shared, so a narrowing set on one applies to both unchanged.
  // "When ordered" is not a level - it cuts a month by where its orders came
  // from, which is a question about a month - so the day chart stays on the
  // level the drill is on and the hint says the split is the page's.
  let sl = state.stack === 'orders' ? null : (splitLevel() ?? null);
  // A level the day export cannot fill - a promotion band where no plan
  // covered this month - would draw as one bar labelled (blank). Better to
  // split by nothing and say why.
  const fills = i => D.combos.some(c => !/^\(.*\)$/.test(
    D.levels[i].values[c.k[i]]));
  const unbanded = sl !== null && !fills(sl);
  if (unbanded) sl = null;
  const xs = D.months.map(m => ({ name: m.label, row: new Map(), total: 0 }));
  const tot = new Map();
  for (const c of D.combos) {
    if (!inSlice(c)) continue;
    const v = c.v[f.at] || 0;
    const g = sl === null ? label(f.key) : D.levels[sl].values[c.k[sl]];
    const x = xs[c.m];
    x.row.set(g, (x.row.get(g) || 0) + v);
    x.total += v;
    tot.set(g, (tot.get(g) || 0) + v);
  }
  // What leaves after the month, per column and not per band: it is one
  // thing drawn apart, and splitting it would invite it to be read as part of
  // the mix rather than as money the month will not be paid.
  const rollAt = D.series.findIndex(
    x => x.key === (f.key === 'qty' ? 'rqty' : 'rgross'));
  const rolls = xs.map(() => 0);
  if (rollAt >= 0 && !pct) {
    for (const c of D.combos) {
      if (inSlice(c)) rolls[c.m] += c.v[rollAt] || 0;
    }
  }
  const rollSum = rolls.reduce((a, v) => a + v, 0);

  const onBands = sl !== null && D.promoAt != null && sl === D.promoAt;
  const members = onBands
    ? [...tot.keys()].sort((a, b) => {
        const i = BAND_ORDER.indexOf(a), j = BAND_ORDER.indexOf(b);
        return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
      })
    : [...tot.entries()]
        .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).map(e => e[0]);
  const named = members.slice(0, 8);
  const folded = members.length > 8;
  // Applied to the columns, as it is below: every bar is itself plus every
  // bar before it, so the last one is the month to date.
  const run = v => { let a = 0; return v.map(x => (a += x)); };
  // Cumulative first, then the share, so a running total normalised to its
  // own column still comes to a hundred.
  const of = g => {
    let d = xs.map(x => x.row.get(g) || 0);
    if (cumul) d = run(d);
    if (!pct) return d;
    const base = cumul ? run(xs.map(x => x.total)) : xs.map(x => x.total);
    return d.map((v, i) => (base[i] ? v / base[i] * 100 : 0));
  };
  const skin = (g, i) => ({
    label: g, stack: 'a', data: of(g),
    backgroundColor: onBands && BAND_COLOUR[g] !== undefined
                     ? C.stack[BAND_COLOUR[g]] : C.stack[i],
    borderRadius: 3, borderSkipped: false,
    borderWidth: 1, borderColor: C.surface, maxBarThickness: 40,
  });
  const datasets = named.map(skin);
  if (folded) {
    const rest = xs.map(x => named.reduce((a, g) => a - (x.row.get(g) || 0),
                                         x.total));
    const base = cumul ? run(xs.map(x => x.total)) : xs.map(x => x.total);
    let d = cumul ? run(rest) : rest;
    if (pct) d = d.map((v, i) => (base[i] ? v / base[i] * 100 : 0));
    datasets.push({ ...skin(`Other (${members.length - 8})`, 8), data: d });
  }
  if (rollSum) {
    // Hatched rather than filled: the bar under it is a measurement and this
    // is a prediction, and a reader should not have to look that up.
    const cv = document.createElement('canvas');
    cv.width = cv.height = 6;
    const g2 = cv.getContext('2d');
    g2.strokeStyle = C.ink3;
    g2.globalAlpha = 0.6;
    g2.lineWidth = 1.6;
    [[0, 6, 6, 0], [-1, 1, 1, -1], [5, 7, 7, 5]].forEach(q => {
      g2.beginPath(); g2.moveTo(q[0], q[1]); g2.lineTo(q[2], q[3]); g2.stroke();
    });
    datasets.push({
      label: 'Maybe rollover', stack: 'a',
      data: cumul ? run(rolls) : rolls,
      backgroundColor: g2.createPattern(cv, 'repeat'),
      borderColor: C.ink3, borderWidth: 1, borderRadius: 3,
      borderSkipped: false, maxBarThickness: 40, roll: true,
    });
  }
  const totals = cumul ? run(xs.map(x => x.total)) : xs.map(x => x.total);
  const num = v => (f.key === 'qty' ? fmt(v) : fmt(v));

  // The target, as a line over the bars: the month's target over its calendar
  // days, or with Cumulative on, the target to date - a day's worth for every
  // day of the month so far, so the line and the bars meet where the month is
  // on plan. Money only: the target is an amount, and a share has no target.
  const tg = (f.key === 'qty' || pct) ? null : dayTarget(D);
  const dayNo = D.months.map(m => (m.d ? m.d % 100 : 0));
  const onMonth = D.months.map(m => tg && m.ym === tg.ym);
  if (tg && !tg.off) {
    datasets.unshift({
      type: 'line', label: `Target ${tg.version} (${tg.currency})`,
      stack: 'target', order: -1,
      data: dayNo.map((n, i) => (!onMonth[i] ? null
                                 : cumul ? tg.day * n : tg.day)),
      borderColor: C.ink, backgroundColor: C.ink, borderWidth: 2,
      borderDash: [6, 4], pointRadius: 0, tension: 0, spanGaps: true,
    });
  }

  const sold = xs.filter(x => x.total).length;
  // The month to date, which is the sum and not the last bar: with Cumulative
  // off the last bar is one day, and a heading that changed with a drawing
  // switch would be reporting the control rather than the month.
  const sum = xs.reduce((a, x) => a + x.total, 0);
  // Against the target to date: a day's worth for each day of the month up to
  // the last one on the chart, which is where the export stops.
  const lastDay = Math.max(0, ...dayNo.filter((_, i) => onMonth[i]));
  const due = tg && !tg.off ? tg.day * lastDay : 0;
  document.getElementById('dayTitle').textContent =
    `${D.months[0].label} - ${D.months[D.months.length - 1].label}`
    + `  \u00b7  ${f.label} ${num(sum)}`
    + (rollSum ? `  \u00b7  ${num(rollSum)} maybe rollover` : '')
    + (due ? `  \u00b7  ${Math.round(sum / due * 100)}% of target to date`
             + ` (${fmt(due)} of ${fmt(tg.month)})` : '')
    + `  \u00b7  ${sold} of ${xs.length} day${xs.length === 1 ? '' : 's'} sold`;

  // The table under the chart: the same month and the same target, by
  // product. Money whatever the chart is showing, so it is handed the money
  // column rather than the figure the menu happens to be on.
  drawAch(D, lastDay);

  // Drilling needs a level to drill into, and a level with something in it.
  const canDrill = sl !== null;
  // The same height as the chart below, taken from it rather than guessed, so
  // the pair reads as one page however many columns the months come to.
  const mine = document.getElementById('dayPlot');
  const his = document.getElementById('stkPlot');
  mine.style.height = his.style.height || '';

  /* The promotions that began inside this month, pinned above the day they
     began on. A campaign is a band inside the bars when Stack by Promo is on,
     which says what it sold and nothing about when it opened - and when it
     opened is what a daily chart is read for. The pins do not care what the
     bars are split by: they are there on any stack, and each one opens that
     campaign's own sheet, so "what did that one do" is a click. */
  const iso = d => (d ? `${Math.floor(d / 10000)}-`
                    + String(Math.floor(d / 100) % 100).padStart(2, '0')
                    + `-${String(d % 100).padStart(2, '0')}` : '');
  const dayAt = new Map(D.months.map((m, i) => [iso(m.d), i]));
  /* Only the DTC campaigns, and only the ones on screen. The DTC campaign
     levels name a campaign per line, so a campaign that sold nothing under
     this customer or this product is simply not among the slice's values -
     that is the filter, and it is the same one the bars use.

     A campaign those levels never name is a nationwide one. The band records
     that a nationwide campaign was live, not which, so it can be neither
     narrowed nor attributed, and a nationwide run is the trading backdrop
     rather than something this page's channel did. It is left off: the strip
     is for the campaigns that are ours. */
  const camps = D.promoAt == null ? []
    : [D.promoAt + 1, D.promoAt + 2].filter(i => i < D.levels.length);
  const liveCamp = new Set();       // the DTC campaigns inside this slice
  for (const c of D.combos) {
    if (!inSlice(c)) continue;
    camps.forEach(i => liveCamp.add(D.levels[i].values[c.k[i]]));
  }
  const pins = [];
  Object.entries(D.campaigns || {}).forEach(([name, c]) => {
    const i = dayAt.get((c.start || '').slice(0, 10));
    if (i === undefined || !liveCamp.has(name)) return;
    pins.push({ name, at: i });
  });
  // Several opening on one day stack upwards, so one never hides another.
  pins.sort((a, b) => a.at - b.at || a.name.localeCompare(b.name));
  const lane = new Map();
  pins.forEach(q => {
    const n = lane.get(q.at) || 0;
    q.row = n;
    lane.set(q.at, n + 1);
  });
  const rows = Math.max(0, ...pins.map(q => q.row + 1));

  // Which Monday each column belongs to, so the weeks can be banded and the
  // Mondays marked. Taken off the day itself, not off the column's position:
  // a day with no orders is not drawn, and counting columns would shift every
  // week after it.
  const weeks = D.months.map(m => mondayOf(m.d));
  const mondays = D.months.map(m => isMonday(m.d));
  const band = [...new Set(weeks.filter(w => w !== null))].sort((a, b) => a - b);

  if (dayTrend) dayTrend.destroy();
  dayTrend = new Chart(document.getElementById('dayTrendBars'), {
    type: 'bar', data: { labels: xs.map(x => x.name), datasets },
    plugins: [{
      // Every other week shaded, behind the bars. A line at each Monday was
      // the other way to draw this and it reads as a divider rather than as
      // a block, which is the wrong shape for "this week against last".
      // The pins, in the strip the layout padding leaves above the plot.
      // Above rather than inside it: a bar reaching the top of the chart is
      // common, and a label over it is unreadable exactly when the day is
      // interesting.
      id: 'promoPins',
      afterDraw(ch) {
        ch.$pins = [];
        if (!pins.length) return;
        const sx = ch.scales.x;
        const g = ch.ctx;
        g.save();
        g.font = '600 10px ui-sans-serif, system-ui, sans-serif';
        g.textBaseline = 'middle';
        const used = [];
        pins.forEach(q => {
          const x = sx.getPixelForValue(q.at);
          const y = ch.chartArea.top - 9 - q.row * 12;
          const text = q.name.length > 22 ? q.name.slice(0, 21) + '\u2026'
                       : q.name;
          const w = g.measureText(text).width;
          // A label that would land on one already drawn is left off; its dot
          // stays, so the day still says a campaign opened on it.
          const box = { x0: x - 4, x1: x + 8 + w, y, row: q.row };
          const clash = used.some(u => u.row === box.row
                                  && box.x0 < u.x1 + 6 && u.x0 < box.x1 + 6);
          g.strokeStyle = C.accent;
          g.globalAlpha = 0.35;
          g.beginPath();
          g.moveTo(x, y + 4);
          g.lineTo(x, ch.chartArea.top);
          g.stroke();
          g.globalAlpha = 1;
          g.fillStyle = C.accent;
          g.beginPath();
          g.arc(x, y, 3.5, 0, 7);
          g.fill();
          if (!clash) {
            g.fillStyle = C.ink2;
            g.fillText(text, x + 7, y);
            used.push(box);
          }
          ch.$pins.push({ name: q.name, x, y, w: clash ? 0 : w });
        });
        g.restore();
      },
    }, {
      id: 'weekBands',
      beforeDatasetsDraw(ch) {
        const sx = ch.scales.x;
        if (!sx || band.length < 2) return;
        const g = ch.ctx;
        g.save();
        g.fillStyle = C.grid;
        g.globalAlpha = 0.55;
        // getPixelForValue, not getPixelForTick: a tick index is a position
        // in the ticks that survived autoSkip, and with a month of days most
        // of them do not - which painted one block over the whole chart.
        const at = i => sx.getPixelForValue(i);
        const edge = i => (i <= 0 ? ch.chartArea.left
                           : (at(i) + at(i - 1)) / 2);
        const clip = x => Math.max(ch.chartArea.left,
                                   Math.min(ch.chartArea.right, x));
        weeks.forEach((w, i) => {
          if (band.indexOf(w) % 2) return;         // every other week
          const l = clip(edge(i));
          const r = clip(i + 1 < weeks.length ? edge(i + 1)
                         : ch.chartArea.right);
          if (r > l) {
            g.fillRect(l, ch.chartArea.top, r - l,
                       ch.chartArea.bottom - ch.chartArea.top);
          }
        });
        g.restore();
      },
    }, {
      // The totals over the bars, when they are asked for. Nothing on hover
      // here either: a figure that appears under the pointer is read by
      // whoever is moving the mouse and by nobody else.
      id: 'dayTotals',
      afterDatasetsDraw(ch) {
        if (!state.dayVals) return;
        const g = ch.ctx;
        // The counted bars: not the target line, and not the rollover
        // band, which is next month's and is not in the figure printed.
        const bars = ch.data.datasets.map((d, i) => i)
          .filter(i => ch.data.datasets[i].type !== 'line'
                       && !ch.data.datasets[i].roll);
        const last = ch.getDatasetMeta(bars[bars.length - 1]);
        g.save();
        g.fillStyle = C.ink2;
        g.font = '600 10px ui-sans-serif, system-ui, sans-serif';
        g.textAlign = 'center';
        // A month of bars is narrower than the figures over it, so a label
        // that would land on the one before it is left off rather than drawn
        // into it - two numbers overlapping are worse than one missing.
        let used = -Infinity;
        last.data.forEach((bar, i) => {
          if (!totals[i]) return;
          const t = num(totals[i]);
          const w = g.measureText(t).width;
          if (bar.x - w / 2 < used + 4) return;
          const top = Math.min(...bars.map(d => ch.getDatasetMeta(d).data[i].y));
          g.fillText(t, bar.x, top - 4);
          used = bar.x + w / 2;
        });
        g.restore();
      },
    }],
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
      interaction: { mode: 'index', intersect: false },
      // Room above the plot for the pins, and none when there are none.
      layout: { padding: { top: rows ? 8 + rows * 12 : 0 } },
      onHover(e, els) {
        e.native.target.style.cursor = (els.length && canDrill) ? 'pointer' : '';
      },
      // The same click the chart below takes: a band narrows the whole page to
      // it and the split steps down. The x axis does not move - it is time -
      // so the same days come back with only that member in them, which is the
      // comparison the click was asking for.
      onClick(e, els) {
        if (!canDrill) return;
        // Index mode hands over the whole column, so asking again for what the
        // pointer is actually inside is the difference between "a bar was
        // clicked" and "DTC only was clicked".
        const hit = this.getElementsAtEventForMode(
          e, 'nearest', { intersect: true }, true)[0] || els[0];
        const d = hit && this.data.datasets[hit.datasetIndex];
        if (!d || !d.label || d.type === 'line') return;
        const j = D.levels[sl].values.indexOf(d.label);
        if (j < 0) return;                     // the folded Other, not a member
        defer(() => setFilter(sl, j));
      },
      scales: {
        x: { stacked: true, offset: true, grid: { display: false },
             border: { display: false },
             ticks: {
               maxRotation: 0,
               // Over a fortnight the axis is labelled by week, not by
               // whichever days autoSkip happened to leave: every Monday and
               // the two ends, so each shaded block carries its own date and
               // the bold ones are not an arbitrary half of them. Under a
               // fortnight every day fits and every day is named.
               autoSkip: xs.length <= 14,
               maxTicksLimit: 16,
               callback(v, i) {
                 const l = this.getLabelForValue(v);
                 if (xs.length <= 14) return l;
                 return (mondays[i] || i === 0 || i === xs.length - 1)
                        ? l : '';
               },
               color: c => (mondays[c.index] ? C.ink2 : C.ink3),
               font: c => ({ weight: mondays[c.index] ? 700 : 400 }) } },
        y: { stacked: true, beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             ticks: { color: C.ink3,
                      callback: v => Number(v).toLocaleString() } },
      },
      plugins: {
        legend: { display: datasets.length > 1, position: 'bottom',
                  labels: { color: C.ink2, boxWidth: 10, boxHeight: 10,
                            usePointStyle: true, pointStyle: 'rect',
                            font: { size: 11 } } },
        tooltip: { enabled: false },
      },
    },
  });

  // Only what would be misread without it: where the export stops, a plan
  // that does not cover these days, and a target that is off.
  const dn = [];
  if (D.asof) {
    dn.push(`The export was taken ${D.asof} and stops there - a short last `
            + 'week is the file ending, not demand.');
  }
  if (unbanded) {
    dn.push('No plan covers these days, so there is no band to split them by '
            + 'and they are drawn whole.');
  }
  if (rollSum) {
    dn.push('The hatched band is ordered this month and leaving after it, by '
            + "its division's measured lead time - next month's revenue, so "
            + 'it is in no total here and in no achievement.');
  } else if (rollAt >= 0 && pct) {
    dn.push('The rollover band is off while the bars are a share of each '
            + 'day: it is not part of the day it was ordered in.');
  }
  if (tg && tg.off) dn.push(`No target line: ${tg.off}.`);
  else if (!tg && TARGET) {
    dn.push('The target is an amount, so the line is off while the bars are '
            + (pct ? 'a share of each day.' : 'a quantity.'));
  }
  // The pins sit in the padding above the plot, and Chart.js hands onClick
  // and onHover only the events that land inside the chart area - so a pin's
  // click never reached it. The canvas gets its own listeners; a click that
  // is not on a pin is left alone for the chart to drill on.
  const cv = document.getElementById('dayTrendBars');
  cv.onclick = e => {
    const name = pinAt(dayTrend, { native: e });
    if (name) defer(() => openCampaign(name, D.campaigns));
  };
  cv.onmousemove = e => {
    if (pinAt(dayTrend, { native: e })) cv.style.cursor = 'pointer';
    else if (e.offsetY < dayTrend.chartArea.top) cv.style.cursor = '';
  };

  const dh = document.getElementById('dayHint');
  dh.textContent = dn.join(' ');
  dh.hidden = !dn.length;
}

function drawStack() {
  // "When ordered" is not a level of the key: it cuts the same revenue by the
  // month the order behind it was placed. It needs the order export and the
  // month before's, or there is nothing to call carried in. Decided first,
  // because what the bars are split by depends on it.
  const canOrd = hasOrders() && DATA.carryIn;
  // The promotion split needs the band series on the cells; a build run
  // without a plan has none, and the button stays off rather than drawing an
  // empty stack.
  const canPromo = (CHAINS.promo || []).length > 0;
  if (state.stack === 'orders' && !canOrd) state.stack = 'customer';
  if (state.stack === 'promo' && !canPromo) state.stack = 'customer';
  const ordMode = state.stack === 'orders';
  // The level that splits each bar. P&L has no split, so it ignores this.
  const chain = CHAINS[state.stack] || [];
  const sl = ordMode ? undefined : (splitLevel() ?? undefined);
  const slNext = sl === undefined ? null
    : (chain[chain.indexOf(sl) + 1] ?? null);
  [['stkCust', 'customer'], ['stkProd', 'product'],
   ['stkOrd', 'orders'], ['stkPromo', 'promo']].forEach(([id, v]) => {
    const b = document.getElementById(id);
    b.classList.toggle('active', state.stack === v);
    b.disabled = v === 'orders' ? !canOrd : !(CHAINS[v] || []).length;
  });

  // Where the month's revenue came from. The first two are the orders; the
  // third is everything they could not account for, and it is here so the bar
  // comes to the same total as every other way of stacking it - a month that
  // reads smaller under one split than another is a chart arguing with itself.
  //
  // Carried out is still not here. It is next month's revenue, and putting a
  // projection in a bar of measurements would make the bar mean nothing.
  const ORIGINS = [['own', 'Ordered this month'],
                   ['in', 'Carried in from the month before'],
                   ['none', 'No order matched']];
  // Two, not fourteen. Every cost figure - operating profit among them - is
  // already a band of the P&L view, so offering each its own bar chart was
  // offering the same numbers twice, and the order series are a stack of their
  // own. What is left is the money and the units.
  //
  // The same three in every stack mode, which is what keeps the y axis still
  // when Stack by changes: there is no figure that one mode has and another
  // does not, so nothing has to be swapped out underneath the reader.
  const MEASURES = [
    [has.net !== undefined ? 'net' : 'gross', `Net Amount (${CUR})`],
    ['qty', 'Qty'],
  ];
  const figBox = document.getElementById('stkFig');
  figBox.className = 'vals seg';
  figBox.innerHTML = '';
  const figs = MEASURES.filter(([k]) => has[k] !== undefined)
    .map(([key, label]) => ({ key, label }));
  if (!figs.length) return;
  if (!figs.some(x => x.key === state.stkFig)) state.stkFig = figs[0].key;
  figs.forEach(x => {
    const b = document.createElement('button');
    b.className = 'btn' + (state.stkFig === x.key ? ' active' : '');
    b.textContent = x.label;
    // render() rebuilds this very button, and removing the click's own target
    // mid-dispatch lets the enclosing <label> activate the first button in the
    // fresh row instead - so every figure snapped back to the first one.
    b.onclick = () => { state.stkFig = x.key; state.pnl = false; defer(render); };
    figBox.appendChild(b);
  });
  // P&L is a view, not a figure: the whole statement, with no split. Stack by
  // and Figure stay on the menu while it is on - hiding them meant a page that
  // opened on P&L opened with most of its controls missing and nothing saying
  // why. Picking one of them simply leaves the P&L, which is what pressing a
  // control that is plainly there should do.
  const pnlMode = state.pnl && has.profit !== undefined;
  document.getElementById('pnlBtn').classList.toggle('active', pnlMode);
  document.getElementById('pnlBtn').hidden = has.profit === undefined;
  // Normalising to 100% is about a mix, and the P&L is not one. The control
  // goes away rather than greying out: a disabled button still costs a row of
  // the menu, and this menu is already tall.
  const pctMode = state.stkScale === 'pct' && !pnlMode;
  // Scale stays on the menu while P&L is on, the way Stack by and Figure do.
  // Hidden, it was a control that vanished with nothing saying why - and the
  // reader who looks for it is looking for it precisely because the view they
  // are in has no use for it.
  [['perMonth', 'month'], ['perQtr', 'quarter']]
    .forEach(([id, v]) => document.getElementById(id)
      .classList.toggle('active', state.period === v));
  document.getElementById('cumulBtn').classList.toggle('active', state.cumul);
  // One rate a month, and no button at all without one for every month drawn:
  // a chart with one column in the other currency says nothing true.
  const curBox = document.getElementById('curBox');
  curBox.hidden = !Object.keys(FX).length;
  curBox.title = (ALL.fxShort || []).length
    ? 'no rate for ' + ALL.fxShort.join(', ') : '';
  document.getElementById('curAud').classList.toggle('active', CUR === 'AUD');
  document.getElementById('curUsd').classList.toggle('active', CUR === 'USD');
  document.getElementById('stkAmt').classList.toggle('active', !pctMode);
  document.getElementById('stkPct').classList.toggle('active', pctMode);

  const plot = document.getElementById('stkPlot');
  const slice = DATA.combos.filter(c =>
    state.filter.every((want, i) => want < 0 || c.k[i] === want));
  const fig = has[state.stkFig];      // undefined in P&L mode, which has none

  // One column per period. A month's ym is YYYYMM, so the quarter and the year
  // fall straight out of it, and the months arrive in order, so the columns do
  // too without sorting anything.
  // Month or quarter. There was a Year as well, until Cumulative arrived: the
  // last bar of a running total is the whole span, so a period that drew it as
  // one bar was a third way to say a number the page already said twice.
  const PER = state.period === 'quarter' ? 'quarter' : 'month';
  const keyOf = m => {
    const y = Math.floor(m.ym / 100), mo = m.ym % 100;
    return PER === 'quarter'
      ? [`${y}Q${Math.ceil(mo / 3)}`, `${y} Q${Math.ceil(mo / 3)}`]
      : [`${m.ym}`, m.label];
  };
  const xs = [];
  const colAt = new Map();
  const col = DATA.months.map(m => {
    const [k, name] = keyOf(m);
    let i = colAt.get(k);
    if (i === undefined) {
      i = xs.length;
      colAt.set(k, i);
      xs.push({ name, ym: m.ym, mi: i, total: 0, row: new Map(), months: [] });
    }
    xs[i].months.push(m);
    return i;
  });
  const fin = xs.map(() => ({ qty: 0, net: 0, gross: 0, profit: 0,
                              deduction: 0, cogs: 0, opex: 0 }));
  const stackTotal = new Map();
  // Each member's own profit and its own denominator, month by month, so the
  // split can carry a margin per band and not just a size per band.
  const finBy = new Map();
  const slotFor = g => {
    let a = finBy.get(g);
    if (!a) finBy.set(g, a = xs.map(() => ({ profit: 0, net: 0, gross: 0 })));
    return a;
  };
  /* Costs are carried negative in the export. The whole figure is flipped when
     its total is, so a cost stack stands up like the others - and a member that
     really does run the other way still points the other way inside it. */
  const flip = fig !== undefined
    && slice.reduce((a, c) => a + c.v[fig], 0) < 0 ? -1 : 1;
  // The figure over the whole slice, month by month, with nothing left out.
  // This is what the y axis is scaled to - not the drawn bars - so switching
  // Stack by never rescales the chart. "When ordered" leaves things out by
  // design, and those bars should read as short rather than be stretched to
  // fill the plot.
  const whole = xs.map(() => 0);
  for (const c of slice) {
    const ci = col[c.m];
    const f = fin[ci];
    for (const k of ['qty', 'net', 'gross', 'profit', ...COSTS]) {
      if (has[k] !== undefined) f[k] += c.v[has[k]];
    }
    if (fig !== undefined) whole[ci] += c.v[fig] * flip;
    if (ordMode) {
      // The same revenue, cut by the month the order behind it was placed.
      // Carried out is left out because it has not been earned yet, and a
      // combination the orders never reached is left out because there is
      // nothing to say about where it came from - so these bands are the
      // month as sold minus what could not be placed, and the hint says so.
      if (!DATA.months[c.m].carryIn) continue;   // its predecessor was not read
      const month = bookedOf(c) + cameIn(c);
      const v = fig === undefined ? 0 : c.v[fig] * flip;
      // No order behind it at all, so there is nothing to apportion: the whole
      // of it goes to the band that says so.
      const shares = month ? [bookedOf(c) / month, cameIn(c) / month, 0]
                           : [0, 0, 1];
      ORIGINS.forEach(([key, name], oi) => {
        const share = shares[oi];
        if (!share) return;
        const b = slotFor(name)[ci];
        for (const k of ['profit', 'net', 'gross']) {
          if (has[k] !== undefined) b[k] += c.v[has[k]] * share;
        }
        const row = xs[ci].row;
        row.set(name, (row.get(name) || 0) + v * share);
        xs[ci].total += v * share;
        stackTotal.set(name, (stackTotal.get(name) || 0) + v * share);
      });
      continue;
    }
    if (pnlMode || sl === undefined) continue;
    const g = DATA.levels[sl].values[c.k[sl]];
    const b = slotFor(g)[ci];
    for (const k of ['profit', 'net', 'gross']) {
      if (has[k] !== undefined) b[k] += c.v[has[k]];
    }
    const v = fig === undefined ? 0 : c.v[fig] * flip;
    const row = xs[ci].row;
    row.set(g, (row.get(g) || 0) + v);
    xs[ci].total += v;
    stackTotal.set(g, (stackTotal.get(g) || 0) + v);
  }
  if (pnlMode) {
    xs.forEach((r, i) => { r.total = fin[i].gross || fin[i].profit; });
  }

  // Running totals, if asked: every column becomes itself plus everything
  // before it, so the last one is the whole span. Applied here, to the columns
  // rather than to the drawn series, so the bands, the margins, the axis and
  // the tooltips all cumulate together and cannot drift apart.
  if (state.cumul) {
    for (let i = 1; i < xs.length; i++) {
      // xs[i-1] is already cumulative by the time we reach i.
      for (const [g, v] of xs[i - 1].row) {
        xs[i].row.set(g, (xs[i].row.get(g) || 0) + v);
      }
      xs[i].total += xs[i - 1].total;
      whole[i] += whole[i - 1];
      for (const k of Object.keys(fin[i])) fin[i][k] += fin[i - 1][k];
      for (const a of finBy.values()) {
        for (const k of ['profit', 'net', 'gross']) a[i][k] += a[i - 1][k];
      }
    }
  }

  // Eight slots, in a fixed order by size across the whole span - so a member
  // keeps its colour from month to month, which is the only way a stacked bar
  // can be read along a time axis at all. A ninth folds into Other.
  // On the promotion band level the order is the drawing's, not the data's: a
  // band sorted by size moves between months, and a bar whose parts change
  // places month to month cannot be read along a time axis at all.
  const onBands = sl !== undefined && DATA.promoAt != null
                  && sl === DATA.promoAt;
  const members = ordMode
    ? ORIGINS.map(o => o[1]).filter(n => stackTotal.has(n))
    : onBands
    ? [...stackTotal.keys()].sort((a, b) => {
        const i = BAND_ORDER.indexOf(a), j = BAND_ORDER.indexOf(b);
        return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
      })
    : [...stackTotal.entries()]
        .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).map(e => e[0]);
  const named = members.slice(0, 8);
  const folded = !ordMode && members.length > 8;

  // In percentage mode each bar is normalised to its own total, so the mix
  // inside a small month reads as clearly as the mix inside a large one. The
  // amount is kept on the row for the tooltip - a share with no size behind
  // it is how a rounding error comes to look like a trend.
  const raw = g => xs.map(r => r.row.get(g) || 0);
  const scale = vals => (pctMode
    ? vals.map((v, i) => (xs[i].total ? v / xs[i].total * 100 : 0))
    : vals);
  const bandColour = (i, g) => (
    ordMode ? [C.stack[0], C.stack[4], C.stack[8]][i]
    : onBands && BAND_COLOUR[g] !== undefined ? C.stack[BAND_COLOUR[g]]
    : C.stack[i]);
  // The bands used to be drawn as a nest - the DTC band inset inside the
  // nationwide one, to say a DTC sale sat inside the nationwide campaign that
  // ran over it. It said something the data does not: the bands are a
  // partition. "DTC + Nation-wide" is the DTC units that *also* had a
  // nationwide campaign, and "DTC only" is the ones that did not, so neither
  // contains the other and a reader who took the drawing at its word had the
  // two the wrong way round. They sit on each other like any other stack now,
  // and the labels carry the distinction instead.
  const band = (g, i) => ({
    label: g,
    stack: 'a',
    data: scale(raw(g)),
    amounts: raw(g),
    backgroundColor: bandColour(i, g), borderRadius: 3, borderSkipped: false,
    borderWidth: 1, borderColor: C.surface,
    barPercentage: 0.9,
    maxBarThickness: 54,
    categoryPercentage: 0.8,
  });
  // The wrapper goes last in the array, because Chart.js draws the datasets
  // back to front - dataset 0 ends up on top - so last is behind. The legend
  // is built from the logical order further down and is unaffected.
  const drawOrder = named.map((g, i) => [g, i]);
  const series = pnlMode ? [] : drawOrder.map(([g, i]) => band(g, i));
  if (folded && !pnlMode) {
    const rest = xs.map(r => named.reduce((a, g) => a - (r.row.get(g) || 0),
                                          r.total));
    series.push({
      label: `Other (${members.length - 8})`, stack: 'a',
      data: scale(rest), amounts: rest,
      backgroundColor: C.stack[8], borderRadius: 3, borderSkipped: false,
      borderWidth: 1, borderColor: C.surface, maxBarThickness: 54,
    });
  }

  const at = (i, k) => (k === 'gross' ? (fin[i].gross || 0)
                                      : Math.abs(fin[i][k] || 0));
  // What each block is worth as a share of net sales - the same denominator
  // the profit line is read on, so the bar and the line say one thing. Over
  // gross would have been the bar's own 100%, but nobody quotes cost of goods
  // over gross: the ratio that gets repeated in a meeting is over net, and a
  // chart that prints a different one invites the two to be compared.
  const shareOf = k => xs.map(r => {
    const base = fin[r.mi].net || fin[r.mi].gross;
    return base ? (at(r.mi, k) / base) * 100 : null;
  });
  if (pnlMode) {
    series.push({
      label: label('gross'), stack: 'in',
      data: xs.map(r => at(r.mi, 'gross')), shares: shareOf('gross'),
      backgroundColor: C.gross, borderRadius: 4, borderSkipped: false,
      borderWidth: 2, borderColor: C.surface, maxBarThickness: 64,
    });
    COSTS.forEach(k => series.push({
      label: label(k), stack: 'out', data: xs.map(r => at(r.mi, k)),
      shares: shareOf(k),
      backgroundColor: C[k], borderRadius: 4, borderSkipped: false,
      borderWidth: 2, borderColor: C.surface, maxBarThickness: 64,
    }));
  }
  const denom = has.net !== undefined ? label('net') : label('gross');
  const hasLine = has.profit !== undefined;
  // P&L draws two bars a side, and the cost stack can be taller than the gross
  // bar; everything else is one bar of the figure itself.
  const pnlSide = i => COSTS.reduce((a, k) => a + Math.abs(fin[i][k] || 0), 0);
  const ceiling = xs.map((_, i) => (pnlMode
    ? Math.max(Math.abs(fin[i].gross || 0), pnlSide(i))
    : Math.abs(whole[i])));
  const axisTop = Math.max(0, ...ceiling);
  const axisBottom = Math.min(0, ...(pnlMode ? [0] : whole));
  // How many columns there are decides how tall the plot needs to be.

  // A margin over 80% is not a margin. Operating profit cannot be most of net
  // sales; what makes the figure is the denominator - a band with a few
  // thousand in net sales carrying a cost line that landed somewhere else, and
  // 1,120% comes out. Drawn, it owns the percent axis and flattens every real
  // line on the chart into the same straight row.
  //
  // So the point is left off rather than drawn or clamped: clamping would put
  // a band at 80% and invite someone to read it. Only the positive side is
  // cut - a band really can lose more than it sells, and -200% on a clearance
  // band is a result, not an artefact.
  let overCap = 0;
  let tooSmall = 0;
  const marginOf = f => {
    const base = f.net || f.gross;
    if (!base) return null;
    const m = f.profit / base * 100;
    if (m > MARGIN_CAP) { overCap++; return null; }
    return m;
  };
  if (hasLine) {
    series.push({
      type: 'line', label: `${label('profit')} % of ${denom}`, yAxisID: 'y1',
      data: xs.map(r => marginOf(fin[r.mi])),
      borderColor: C.profit, backgroundColor: C.profit, borderWidth: 2,
      pointRadius: 4, pointHoverRadius: 7, tension: .25, fill: false,
      spanGaps: true, order: -1, labelPoints: true,
    });
    // And one per band, dotted, in the band's own colour. Solid is the slice
    // as a whole; dotted is a member of it. A stacked bar says how big each
    // member is and says nothing about how well it did - two members of the
    // same size can be a long way apart on margin, and that is usually the
    // question the sizes raise.
    if (!pnlMode) {
      named.forEach((g, i) => {
        const a = finBy.get(g);
        if (!a) return;
        if (ordMode && g === ORIGINS[2][1]) return;   // a residual, not a cohort
        // Faint on purpose: the solid line is the answer, and these are the
        // spread around it. At full strength eight of them read as the chart
        // and the bars underneath read as the background, which is backwards.
        // A month where the band is a sliver of the bar gets no point: the
        // margin is a ratio over almost nothing. The band's bar is untouched,
        // and the line simply has nothing to say that month.
        const share = (f, i) => {
          const base = Math.abs(fin[i].net || fin[i].gross || 0);
          const mine = Math.abs((f || {}).net || (f || {}).gross || 0);
          return base ? mine / base : 0;
        };
        series.push({
          type: 'line', label: `${g} margin`, yAxisID: 'y1',
          data: xs.map(r => {
            if (share(a[r.mi], r.mi) < LINE_FLOOR) { tooSmall++; return null; }
            return marginOf(a[r.mi]);
          }),
          borderColor: fade(bandColour(i, g), .75),
          backgroundColor: fade(bandColour(i, g), .75),
          borderWidth: 1.4, borderDash: [4, 3],
          // Points, like the solid line. Without them a dotted line is a shape
          // and nothing else: there is no telling which months it actually has
          // a figure for and which stretch it is only spanning a gap across.
          pointRadius: 3, pointHoverRadius: 6, tension: .25, fill: false,
          spanGaps: true, order: -1, bandLine: true,
        });
      });
    }
  }

  // The legend is a switch: clicking an entry takes that band out of every bar
  // and clicking it again puts it back. Held by label rather than by index, so
  // a band keeps its state while the months and the figure change underneath
  // it, and dropped when it is no longer on the chart at all.
  const shownSeries = series.filter(d => !state.hidden.has(stripMargin(d.label)));
  const legendOrder = series.slice().sort((a, b) =>
    named.indexOf(a.label) - named.indexOf(b.label));
  document.getElementById('stkLegend').innerHTML = legendOrder
    .filter(d => !d.bandLine)        // the band's own colour already names it
    .map(d => `<span class="pick${state.hidden.has(d.label) ? ' off' : ''}" `
      + `data-label="${esc(d.label)}" `
      + `title="click to take it out of the bars, double-click to keep only it">`
      + `<i style="background:${d.type === 'line' ? d.borderColor
      : d.backgroundColor}"></i>${d.label}</span>`).join('');
  // Two things to want from a legend and both of them are wanted: take one
  // band out, or keep only that one. A single click removes, a double click
  // isolates - and a double click on the band that is already alone puts the
  // rest back, so the same gesture is its own undo.
  const all = legendOrder.filter(d => !d.bandLine && d.type !== 'line')
    .map(d => d.label);
  let pending = null;
  document.getElementById('stkLegend').querySelectorAll('.pick').forEach(el => {
    const g = el.dataset.label;
    el.onclick = () => {
      // Held briefly, because a double click fires its clicks first: acting on
      // them at once would hide the band on the way to isolating it.
      clearTimeout(pending);
      pending = setTimeout(() => {
        if (state.hidden.has(g)) state.hidden.delete(g); else state.hidden.add(g);
        render();
      }, 220);
    };
    el.ondblclick = () => {
      clearTimeout(pending);
      const alone = all.every(x => x === g ? !state.hidden.has(x)
                                           : state.hidden.has(x));
      state.hidden = new Set(alone ? [] : all.filter(x => x !== g));
      render();
    };
  });
  // Expanded, the stylesheet gives the plot the window; the inline height set
  // here would win over it, so it steps aside.
  plot.style.height = state.zoom === 'stk' ? ''
    : Math.max(340, Math.min(560, xs.length * 46 + 180)) + 'px';

  // Clicking a segment narrows to it. The x axis does not move - it is time -
  // so the same months come back with only that member in them, which is the
  // comparison the click was asking for.
  // The origins are not a level, so there is nothing under them to open.
  const canDrill = !pnlMode && !ordMode && sl !== undefined;
  if (stkChart) stkChart.destroy();
  stkChart = new Chart(document.getElementById('stkBars'), {
    type: 'bar', data: { labels: xs.map(r => r.name), datasets: shownSeries },
    plugins: [pointLabels, barValues],
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
      // The pointer still drills: a click is a choice, a hover is not.
      interaction: { mode: 'index', intersect: false },
      datasets: { bar: { categoryPercentage: 0.8, barPercentage: 0.95 } },
      onHover: (e, els) => {
        e.native.target.style.cursor = (els.length && canDrill) ? 'pointer' : '';
      },
      onClick(e, els) {
        if (!canDrill) return;
        // The index-mode elements Chart.js hands over are the whole column,
        // line dataset first, so they say which month was clicked and not
        // which band. Asking again for what the pointer is actually inside is
        // the difference between "a bar was clicked" and "MX was clicked".
        const hit = this.getElementsAtEventForMode(
          e, 'nearest', { intersect: true }, true)[0] || els[0];
        const d = hit && this.data.datasets[hit.datasetIndex];
        if (!d || d.type === 'line' || !d.label) return;
        const j = DATA.levels[sl].values.indexOf(d.label);
        if (j < 0) return;                       // the folded Other, not a member
        defer(() => setFilter(sl, j));
      },
      scales: {
        // Two stack names on a stacked axis put the figure and the costs
        // side by side on the same tick; one name leaves a single bar centred.
        // offset is on in both: without it the first and last bars sit hard on
        // the axis ends and lose half their width off the edge of the plot.
        x: { stacked: true, offset: true, grid: { display: false },
             border: { display: false },
             ticks: { color: C.ink2, autoSkip: false, maxRotation: 0 } },
        y: { stacked: true, beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             max: pctMode ? 100 : undefined,
             // Not a hard max: a bar bigger than the slice's own figure - the
             // P&L's cost stack can be - still gets the room it needs.
             suggestedMax: pctMode ? undefined : axisTop,
             suggestedMin: pctMode ? undefined : axisBottom,
             title: { display: true, color: C.ink3,
                      text: pctMode ? 'Share of the bar'
                        : pnlMode ? 'Amount'
                        : (figs.find(x => x.key === state.stkFig) || {}).label },
             ticks: { color: C.ink3,
                      callback: v => (pctMode ? `${v}%`
                                              : Number(v).toLocaleString()) } },
        // The line carries its own value over every point, so the axis it is
        // scaled against has nothing left to tell anyone. It stays as a scale
        // and stops being drawn, which gives the bars the width back.
        ...(hasLine ? { y1: {
          display: false, position: 'right',
          suggestedMin: -10, suggestedMax: 10 } } : {}),
      },
      plugins: {
        legend: { display: false },
        barValues: { on: state.zoom === 'stk', pct: pctMode, share: pnlMode },
      // Expanded, there is room for every line's figures and that is what the
      // room is for; the switch beside the chart takes them away again.
      pointLabels: { all: state.zoom === 'stk' && state.lineVals },
        // Nothing on hover while the chart sits on the page. A figure that
        // appears under the pointer is read by whoever happens to be moving
        // the mouse and by nobody else, and on a page being shown to a room it
        // is a number nobody asked for. Expand is the deliberate step: it
        // gives the chart the window and labels every value at once, for
        // everyone looking at it. So the tooltip belongs to that mode.
        tooltip: { enabled: state.zoom === 'stk',
          backgroundColor: C.surface, titleColor: C.ink,
          bodyColor: C.ink2, borderColor: C.grid, borderWidth: 1, padding: 10,
          // A span's parsed.y is its top edge, not its size, so what the band
          // is worth comes off `amounts` wherever it has one.
          filter: c => (c.dataset.amounts ? c.dataset.amounts[c.dataIndex]
                                          : c.parsed.y) !== 0
                       && c.parsed.y !== null,
          callbacks: {
            label: c => c.dataset.yAxisID === 'y1'
              ? `${c.dataset.label}: ` + (c.parsed.y == null ? 'no net sales'
                  : c.parsed.y.toFixed(1) + '%')
              : pctMode
                ? `${c.dataset.label}: ${c.parsed.y.toFixed(1)}%  (${
                    fmt(c.dataset.amounts[c.dataIndex])})`
                : `${c.dataset.label}: ${fmt(Array.isArray(c.raw)
                    ? c.dataset.amounts[c.dataIndex] : c.parsed.y)}`,
            footer: items => {
              const r = xs[items[0].dataIndex];
              const f = fin[r.mi];
              return [...(pnlMode
                       ? [`Costs: ${fmt(COSTS.reduce(
                           (a, k) => a + Math.abs(f[k] || 0), 0))}`]
                       : [`${(figs.find(x => x.key === state.stkFig) || {}).label}`
                          + `: ${fmt(r.total)}`]),
                      ...(hasLine ? [`${label('profit')}: ${fmt(f.profit || 0)}`]
                                  : []),
                      ...(f.qty ? [`Qty: ${fmt(f.qty)}`] : []),
                      ...(canDrill
                          ? [`click a band to keep only that ${DATA.levels[sl].name}`]
                          : [])];
            } } },
      },
    },
  });

  // What the chart is not showing, and nothing about how to read it. A
  // caption under every chart is a page a reader scrolls past; a line that
  // appears only when something has been left out is one they believe.
  const notes = [];
  if (ordMode) {
    const blind = DATA.months.filter(m => !m.carryIn).map(m => m.label);
    if (blind.length) {
      notes.push(`${blind.join(', ')}: the month before was not read, so what `
                 + 'came in is unknown rather than nil and is left empty.');
    }
  }
  if (folded) {
    notes.push(`The eight biggest ${DATA.levels[sl].name.toLowerCase()}s have `
               + 'a colour of their own; the rest are folded into Other.');
  }
  if (overCap) {
    notes.push(`${overCap} margin point${overCap > 1 ? 's' : ''} over `
               + `${MARGIN_CAP}% left off: that high is a tiny base rather `
               + 'than a result, and drawn it would own the axis.');
  }
  if (tooSmall) {
    notes.push(`${tooSmall} band${tooSmall > 1 ? 's' : ''} under `
               + `${(LINE_FLOOR * 100).toFixed(1)}% of ${PER} keep the bar and `
               + 'lose the margin point - a ratio over almost nothing swings '
               + 'by hundreds of points.');
  }
  const hint = document.getElementById('stkHint');
  hint.textContent = notes.join(' ');
  hint.hidden = !notes.length;
}

/* The two counts side by side, one pair per member of the level the bars are
   on. Units, not money: both files carry a quantity that means the same thing -
   a unit shipped - while the amounts differ by tax, by currency and by what
   each file calls revenue. The money is in the tooltip, where a systematic
   difference still shows without being mistaken for a reconciling one.

   The overlap is drawn in one colour across both bars, because it is one set of
   units counted twice. What sits above it on each side is what the other side
   does not have. */
/* Which of a pair is which, written over each bar. Two bars on one tick share
   the tick's label, so without this the colours are the only thing saying that
   the left one is the month's sales and the right one the month's orders. */
function renderTable(rows, dimName, ofTotal) {
  document.getElementById('tableCard').hidden = !state.table;
  if (!state.table) return;
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  // The table mirrors the chart, so its total covers the rows charted - say
  // so when that is not all of them, rather than let it read as the whole file.
  const tot = { name: ofTotal > rows.length ? `Total of these ${rows.length}`
                                            : 'Total',
                gross: sum('gross'), profit: sum('profit'),
                net: sum('net'), qty: sum('qty') };
  COSTS.forEach(k => { tot[k] = sum(k); });
  tot.asp = tot.qty ? tot.net / tot.qty : null;
  const head = [dimName, label('gross'),
                ...COSTS.map(k => label(k)), 'Costs',
                label('profit'), 'Profit %',
                ...(has.qty === undefined ? [] : ['Qty (net)', 'ASP'])];
  const cell = v => (v == null ? '-' : fmt(v));
  const line = r => {
    const costs = COSTS.reduce((a, k) => a + r[k], 0);
    const m = r.net ? (r.profit / r.net) * 100 : null;
    const p = r.profit;
    return [`<td>${r.name}</td>`, `<td>${cell(each(r, 'gross'))}</td>`,
            ...COSTS.map(k => `<td>${cell(each(r, k))}</td>`),
            `<td>${cell(costs)}</td>`,
            `<td class="${p < 0 ? 'neg' : ''}">${cell(each(r, 'profit'))}</td>`,
            `<td class="${m < 0 ? 'neg' : ''}">${
              m == null ? '-' : m.toFixed(1) + '%'}</td>`,
            ...(has.qty === undefined ? [] : [
              `<td>${fmt(r.qty)}</td>`,
              `<td>${r.asp == null ? '-' : unitFmt(r.asp)}</td>`])].join('');
  };
  document.getElementById('tableBox').innerHTML = `<table>
    <thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${line(r)}</tr>`).join('')}</tbody>
    <tfoot><tr>${line(tot)}</tr></tfoot></table>`;
}

/* Back widens the deepest narrowing, whichever chain it was in, and puts the
   split back on that level. With time on the x axis there is no level to step
   up from - the narrowing is the whole of where you are. */
/* The narrowing Back would widen: the deepest one in the chain being looked
   at, not the deepest one on the page. Those are different the moment a
   narrowing is left behind in another chain - a SKU picked earlier is still a
   narrowing, and Back from the Customer stack used to widen that and move the
   page to Product, which is not where Back was pressed. */
function backLevel() {
  const chain = CHAINS[state.stack] || [];
  let last = -1;
  chain.forEach(i => { if (state.filter[i] >= 0) last = i; });
  return last;
}

document.getElementById('backBtn').onclick = () => {
  const last = backLevel();
  if (last < 0) return;
  state.filter[last] = -1;
  state.dim = last;
  render();
};
document.getElementById('numbersBtn').onclick = () => {
  state.numbers = !state.numbers; render(); };
document.getElementById('tableBtn').onclick = () => {
  state.table = !state.table; render(); };

/* The campaign's own window, drawn on the chart rather than only written over
   it: a tinted band behind the bars that are inside it, a rule at each edge,
   and the two dates on the rules. The outer bars - the month either side - sit
   outside the tint, which is the whole point of drawing it: what the campaign
   did and what the same products did around it should not need a caption to
   be told apart. */
const campaignWindow = {
  id: 'campaignWindow',
  beforeDatasetsDraw(c) {
    const o = c.options.plugins.campaignWindow;
    if (!o || o.from == null) return;
    const meta = c.getDatasetMeta(0);
    const a = meta.data[o.from], b = meta.data[o.to];
    if (!a || !b) return;
    const { ctx, chartArea } = c;
    const x0 = a.x - a.width / 2 - 2;
    const x1 = b.x + b.width / 2 + 2;
    ctx.save();
    ctx.fillStyle = fade(C.gross, .07);
    ctx.fillRect(x0, chartArea.top, x1 - x0, chartArea.bottom - chartArea.top);
    ctx.restore();
  },
  afterDatasetsDraw(c) {
    const o = c.options.plugins.campaignWindow;
    if (!o || o.from == null) return;
    const meta = c.getDatasetMeta(0);
    const a = meta.data[o.from], b = meta.data[o.to];
    if (!a || !b) return;
    const { ctx, chartArea } = c;
    const x0 = a.x - a.width / 2 - 2;
    const x1 = b.x + b.width / 2 + 2;
    ctx.save();
    ctx.strokeStyle = fade(C.profit, .55);
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 3]);
    [x0, x1].forEach(x => {
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.font = '600 11px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textBaseline = 'middle';
    // Each label hugs its own rule and leans into the window, so neither can
    // be read as belonging to the month outside it.
    const plate = (text, x, align) => {
      const w = ctx.measureText(text).width;
      const left = align === 'left' ? x + 5 : x - w - 5;
      ctx.fillStyle = C.surface;
      ctx.globalAlpha = .9;
      ctx.beginPath();
      ctx.roundRect(left - 4, chartArea.top + 1, w + 8, 17, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.profit;
      ctx.textAlign = 'left';
      ctx.fillText(text, left, chartArea.top + 10);
    };
    plate(o.startLabel, x0, 'left');
    plate(o.endLabel, x1, 'right');
    ctx.restore();
  },
};

/* One campaign, day by day, between the dates the plan says it ran.

   The month chart answers "how big was it"; this answers "how did it go" -
   the shape of a launch, whether a pre-order built or spiked, whether the
   last week was worth running. Both are the same orders, counted on the day
   they came in.

   Nothing is drawn outside the window. A day after the campaign closed is an
   order banded on a line whose dates say otherwise, and a bar there would say
   the campaign was still running. */
let dayChart = null;

/* Which run a pick from the menu means. The open month is what the page is
   read for, so the day view answers when there is one; without it the page is
   closed months and its own window is the question. */
function liveCampaigns() {
  return ((VIEWS.day || DATA).campaigns) || {};
}

function campaignDays(name, from) {
  const c = (from || liveCampaigns())[name];
  if (!c) return null;
  const start = c.start, end = c.end;
  if (!start || !end) return null;
  // Every day between the two, so a gap reads as a day with no sales rather
  // than as a day the chart skipped.
  const days = [];
  for (let d = new Date(start + 'T00:00:00');
       d <= new Date(end + 'T00:00:00'); d.setDate(d.getDate() + 1)) {
    const key = d.toISOString().slice(0, 10);
    const v = (c.days || {})[key] || [0, 0];
    days.push({ key, units: v[0], amount: v[1] });
  }
  // Either side, a rate rather than a run of days: what the same products did
  // per day in the month before it opened and the month after it closed. The
  // days outside the window are not the campaign's and are not drawn one by
  // one - the question they answer is whether the campaign moved the rate.
  const rate = v => (v && v[2] ? { units: v[0] / v[2], amount: v[1] / v[2],
                                   total: v[0], days: v[2] } : null);
  const inside = days.reduce((a, d) => a + d.units, 0);
  // A run too long to read a day at a time is read a week at a time. The
  // first bucket starts on the day the campaign opened, so the weeks are the
  // campaign's own and not the calendar's.
  let cols = days, weekly = false;
  if (days.length > DAY_MAX) {
    weekly = true;
    cols = [];
    for (let i = 0; i < days.length; i += 7) {
      const week = days.slice(i, i + 7);
      cols.push({
        key: week[0].key, span: week.length,
        units: week.reduce((a, d) => a + d.units, 0),
        amount: week.reduce((a, d) => a + d.amount, 0),
      });
    }
  }
  return {
    start, end, days: cols, weekly,
    before: rate(c.before), after: rate(c.after),
    during: days.length ? { units: inside / days.length, total: inside,
                            days: days.length } : null,
  };
}

const dayLabel = (iso, year) => {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul',
    'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()]}`
    // A run that crosses a new year says which: "2 Oct to 31 Dec" over
    // fifteen months reads as a quarter.
    + (year ? ` ${String(d.getFullYear()).slice(2)}` : '');
};

function openCampaign(name, from) {
  const got = campaignDays(name, from);
  if (!got) return false;
  readColours();
  const { start, end, days, weekly, before, after, during } = got;
  const units = days.reduce((a, d) => a + d.units, 0);
  const amount = days.reduce((a, d) => a + d.amount, 0);
  const sold = days.filter(d => d.units).length;
  // Counted in whatever the bars are: weeks where the run is drawn weekly,
  // days where it is not. "11 of 29 days" and "4 of 10 weeks" are both true
  // of the same campaign and only one of them matches what is on screen.
  const soldOf = weekly ? `${sold} of ${days.length} weeks`
                        : `${sold} of ${during ? during.days : 0} days`;
  const best = weekly ? null
    : days.reduce((a, d) => (d.units > (a ? a.units : 0) ? d : a), null);
  // A rate under a tenth is still a rate: 6 units over a year is 0.01 a day,
  // and printing 0.0 there says the campaign sold nothing.
  const perDay = v => (v == null ? '-'
    : v.toFixed(v >= 10 ? 0 : v >= 0.1 || v === 0 ? 1 : 2));
  const lift = (a, b) => (a && b && a.units ? ((b.units / a.units - 1) * 100) : null);
  const yr = start.slice(0, 4) !== end.slice(0, 4);
  document.getElementById('dayName').textContent = name;
  document.getElementById('dayWhen').innerHTML =
    `Launched <b>${dayLabel(start, yr)}</b> &middot; ended `
    + `<b>${dayLabel(end, yr)}</b>`
    // The run's own length, which is not the number of bars once a long run
    // is drawn a week at a time.
    + ` &middot; ${during ? during.days : days.length} day`
    + `${(during ? during.days : days.length) === 1 ? '' : 's'}`
    + ` &middot; <b>${fmt(units)}</b> unit${units === 1 ? '' : 's'} ordered`
    + (amount ? ` &middot; <b>${fmt(amount)}</b>` : '')
    + (during ? ` &middot; <b>${perDay(during.units)}</b> a day` : '')
    + (weekly ? ' &middot; drawn a week at a time' : '');
  const up = lift(before, during);
  document.getElementById('dayFoot').textContent =
    'Counted on the day the order came in, which is the day the promotion was '
    + `live - not the day it shipped. ${soldOf} sold anything`
    + (best && best.units ? `; the biggest was ${dayLabel(best.key)} with `
                            + `${fmt(best.units)}. ` : '. ')
    + (before || after
       ? 'The two outer bars are the same products on the days either side - a '
         + 'rate per day over the month before and the month after, not the '
         + 'campaign. '
         + (up !== null ? `Through the campaign they ran ${up >= 0 ? 'up' : 'down'} `
                          + `${Math.abs(up).toFixed(0)}% a day on the month before.`
                        : '')
       : '');
  document.getElementById('dayVeil').hidden = false;
  if (dayChart) dayChart.destroy();
  // The window day by day, with a single averaged bar on either side. Those
  // two are a different measure on the same axis - units a day, not units -
  // so they are drawn in another colour and named for what they are.
  const cols = [];
  if (before) {
    cols.push({ label: `${before.days}d before`, units: before.units,
                amount: before.amount, rate: true });
  }
  days.forEach(d => cols.push({
    label: weekly ? `w/c ${dayLabel(d.key)}` : dayLabel(d.key),
    units: d.units, amount: d.amount }));
  if (after) {
    cols.push({ label: `${after.days}d after`, units: after.units,
                amount: after.amount, rate: true });
  }
  dayChart = new Chart(document.getElementById('dayBars'), {
    type: 'bar',
    plugins: [campaignWindow],
    data: {
      labels: cols.map(c => c.label),
      datasets: [{
        label: 'Units ordered', data: cols.map(c => c.units),
        amounts: cols.map(c => c.amount), rates: cols.map(c => !!c.rate),
        backgroundColor: cols.map(c => (c.rate ? C.ink3 : C.gross)),
        borderRadius: 3, borderSkipped: false, maxBarThickness: 26,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 200 },
      plugins: {
        legend: { display: false },
        campaignWindow: {
          from: before ? 1 : 0,
          to: cols.length - 1 - (after ? 1 : 0),
          startLabel: `Launch ${dayLabel(start, yr)}`,
          endLabel: `End ${dayLabel(end, yr)}`,
        },
        tooltip: {
          backgroundColor: C.surface, titleColor: C.ink, bodyColor: C.ink2,
          borderColor: C.grid, borderWidth: 1, padding: 10,
          callbacks: {
            label: c => {
              const r = c.dataset.rates[c.dataIndex];
              const n = c.parsed.y;
              const amt = c.dataset.amounts[c.dataIndex];
              return (r ? `${n.toFixed(n >= 10 ? 0 : 1)} unit(s) a day`
