  // widths, which reads as three sizes rather than as one band wrapping
  // another: the wrap is only visible when what does the wrapping is the same
  // width as everything else and the wrapped band is the one that is narrower.
  const NEST = { 'DTC promotion': 0.52 };
  // Which band is drawn from zero rather than from the top of the one below.
  // That is the whole of the wrap: the nationwide band's rectangle runs the
  // full height of the DTC band it ran over, so it shows past it on both
  // sides, and the narrower DTC band sits inside it. Every top edge is where a
  // plain stack would put it, so the totals and the axis do not move - only
  // the hidden bottom edge of the one band changes.
  const WRAP = new Set(['DTC + Nation-wide']);
  // Both the share and the pixel cap, in step. Setting the share alone left
  // every band on the cap on a one-month chart, where the slot is wide enough
  // that all of them hit it - and the cap alone did nothing on a nine-month
  // chart, where none of them reach it.
  const slotOf = g => (onBands && NEST[g] !== undefined ? NEST[g] : 0.9);
  // Running tops, in the drawn order, so a band can be given its own span.
  const tops = [];
  let run = xs.map(() => 0);
  named.forEach(g => {
    run = run.map((v, j) => v + (scale(raw(g))[j] || 0));
    tops.push([...run]);
  });
  const span = (g, i) => scale(raw(g)).map((v, j) =>
    [WRAP.has(g) ? 0 : (i ? tops[i - 1][j] : 0), tops[i][j]]);
  const band = (g, i) => ({
    label: g,
    // One stack for all of them, always: datasets on different stacks are laid
    // out side by side in the slot rather than over each other, which is the
    // opposite of wrapping. The spans are kept literal by turning the y axis's
    // own stacking off for this one view instead.
    stack: 'a',
    data: onBands ? span(g, i) : scale(raw(g)),
    amounts: raw(g),
    backgroundColor: bandColour(i, g), borderRadius: 3, borderSkipped: false,
    borderWidth: 1, borderColor: C.surface,
    barPercentage: slotOf(g),
    maxBarThickness: 54 * (slotOf(g) / 0.9),
    categoryPercentage: 0.8,
    // The room a number may use: the slot, not the band's own narrowed width.
    labelWidth: onBands ? 54 : undefined,
  });
  // The wrapper goes last in the array, because Chart.js draws the datasets
  // back to front - dataset 0 ends up on top - so last is behind. The legend
  // is built from the logical order further down and is unaffected.
  const drawOrder = onBands
    ? named.map((g, i) => [g, i]).sort((a, b) => WRAP.has(a[0]) - WRAP.has(b[0]))
    : named.map((g, i) => [g, i]);
  const series = pnlMode ? [] : drawOrder.map(([g, i]) => band(g, i));
  if (folded && !pnlMode) {
    const rest = xs.map(r => named.reduce((a, g) => a - (r.row.get(g) || 0),
                                          r.total));
    series.push({
      label: `Other (${members.length - 8})`, stack: 'a',
      data: scale(rest), amounts: rest,
      backgroundColor: C.stack[8], borderRadius: 3, borderSkipped: false,
      borderWidth: 1, borderColor: C.surface, maxBarThickness: 54,
    });
  }

  const at = (i, k) => (k === 'gross' ? (fin[i].gross || 0)
                                      : Math.abs(fin[i][k] || 0));
  // What each block is worth as a share of net sales - the same denominator
  // the profit line is read on, so the bar and the line say one thing. Over
  // gross would have been the bar's own 100%, but nobody quotes cost of goods
  // over gross: the ratio that gets repeated in a meeting is over net, and a
  // chart that prints a different one invites the two to be compared.
  const shareOf = k => xs.map(r => {
    const base = fin[r.mi].net || fin[r.mi].gross;
    return base ? (at(r.mi, k) / base) * 100 : null;
  });
  if (pnlMode) {
    series.push({
      label: label('gross'), stack: 'in',
      data: xs.map(r => at(r.mi, 'gross')), shares: shareOf('gross'),
      backgroundColor: C.gross, borderRadius: 4, borderSkipped: false,
      borderWidth: 2, borderColor: C.surface, maxBarThickness: 64,
    });
    COSTS.forEach(k => series.push({
      label: label(k), stack: 'out', data: xs.map(r => at(r.mi, k)),
      shares: shareOf(k),
      backgroundColor: C[k], borderRadius: 4, borderSkipped: false,
      borderWidth: 2, borderColor: C.surface, maxBarThickness: 64,
    }));
  }
  const denom = has.net !== undefined ? label('net') : label('gross');
  const hasLine = has.profit !== undefined;
  // P&L draws two bars a side, and the cost stack can be taller than the gross
  // bar; everything else is one bar of the figure itself.
  const pnlSide = i => COSTS.reduce((a, k) => a + Math.abs(fin[i][k] || 0), 0);
  const ceiling = xs.map((_, i) => (pnlMode
    ? Math.max(Math.abs(fin[i].gross || 0), pnlSide(i))
    : Math.abs(whole[i])));
  const axisTop = Math.max(0, ...ceiling);
  const axisBottom = Math.min(0, ...(pnlMode ? [0] : whole));
  // How many columns there are decides how tall the plot needs to be.

  // A margin over 80% is not a margin. Operating profit cannot be most of net
  // sales; what makes the figure is the denominator - a band with a few
  // thousand in net sales carrying a cost line that landed somewhere else, and
  // 1,120% comes out. Drawn, it owns the percent axis and flattens every real
  // line on the chart into the same straight row.
  //
  // So the point is left off rather than drawn or clamped: clamping would put
  // a band at 80% and invite someone to read it. Only the positive side is
  // cut - a band really can lose more than it sells, and -200% on a clearance
  // band is a result, not an artefact.
  let overCap = 0;
  let tooSmall = 0;
  const marginOf = f => {
    const base = f.net || f.gross;
    if (!base) return null;
    const m = f.profit / base * 100;
    if (m > MARGIN_CAP) { overCap++; return null; }
    return m;
  };
  if (hasLine) {
    series.push({
      type: 'line', label: `${label('profit')} % of ${denom}`, yAxisID: 'y1',
      data: xs.map(r => marginOf(fin[r.mi])),
      borderColor: C.profit, backgroundColor: C.profit, borderWidth: 2,
      pointRadius: 4, pointHoverRadius: 7, tension: .25, fill: false,
      spanGaps: true, order: -1, labelPoints: true,
    });
    // And one per band, dotted, in the band's own colour. Solid is the slice
    // as a whole; dotted is a member of it. A stacked bar says how big each
    // member is and says nothing about how well it did - two members of the
    // same size can be a long way apart on margin, and that is usually the
    // question the sizes raise.
    if (!pnlMode) {
      named.forEach((g, i) => {
        const a = finBy.get(g);
        if (!a) return;
        if (ordMode && g === ORIGINS[2][1]) return;   // a residual, not a cohort
        // Faint on purpose: the solid line is the answer, and these are the
        // spread around it. At full strength eight of them read as the chart
        // and the bars underneath read as the background, which is backwards.
        // A month where the band is a sliver of the bar gets no point: the
        // margin is a ratio over almost nothing. The band's bar is untouched,
        // and the line simply has nothing to say that month.
        const share = (f, i) => {
          const base = Math.abs(fin[i].net || fin[i].gross || 0);
          const mine = Math.abs((f || {}).net || (f || {}).gross || 0);
          return base ? mine / base : 0;
        };
        series.push({
          type: 'line', label: `${g} margin`, yAxisID: 'y1',
          data: xs.map(r => {
            if (share(a[r.mi], r.mi) < LINE_FLOOR) { tooSmall++; return null; }
            return marginOf(a[r.mi]);
          }),
          borderColor: fade(bandColour(i, g), .75),
          backgroundColor: fade(bandColour(i, g), .75),
          borderWidth: 1.4, borderDash: [4, 3],
          // Points, like the solid line. Without them a dotted line is a shape
          // and nothing else: there is no telling which months it actually has
          // a figure for and which stretch it is only spanning a gap across.
          pointRadius: 3, pointHoverRadius: 6, tension: .25, fill: false,
          spanGaps: true, order: -1, bandLine: true,
        });
      });
    }
  }

  // The legend is a switch: clicking an entry takes that band out of every bar
  // and clicking it again puts it back. Held by label rather than by index, so
  // a band keeps its state while the months and the figure change underneath
  // it, and dropped when it is no longer on the chart at all.
  const shownSeries = series.filter(d => !state.hidden.has(stripMargin(d.label)));
  const legendOrder = series.slice().sort((a, b) =>
    named.indexOf(a.label) - named.indexOf(b.label));
  document.getElementById('stkLegend').innerHTML = legendOrder
    .filter(d => !d.bandLine)        // the band's own colour already names it
    .map(d => `<span class="pick${state.hidden.has(d.label) ? ' off' : ''}" `
      + `data-label="${esc(d.label)}" `
      + `title="click to take it out of the bars, double-click to keep only it">`
      + `<i style="background:${d.type === 'line' ? d.borderColor
      : d.backgroundColor}"></i>${d.label}</span>`).join('');
  // Two things to want from a legend and both of them are wanted: take one
  // band out, or keep only that one. A single click removes, a double click
  // isolates - and a double click on the band that is already alone puts the
  // rest back, so the same gesture is its own undo.
  const all = legendOrder.filter(d => !d.bandLine && d.type !== 'line')
    .map(d => d.label);
  let pending = null;
  document.getElementById('stkLegend').querySelectorAll('.pick').forEach(el => {
    const g = el.dataset.label;
    el.onclick = () => {
      // Held briefly, because a double click fires its clicks first: acting on
      // them at once would hide the band on the way to isolating it.
      clearTimeout(pending);
      pending = setTimeout(() => {
        if (state.hidden.has(g)) state.hidden.delete(g); else state.hidden.add(g);
        render();
      }, 220);
    };
    el.ondblclick = () => {
      clearTimeout(pending);
      const alone = all.every(x => x === g ? !state.hidden.has(x)
                                           : state.hidden.has(x));
      state.hidden = new Set(alone ? [] : all.filter(x => x !== g));
      render();
    };
  });
  // Expanded, the stylesheet gives the plot the window; the inline height set
  // here would win over it, so it steps aside.
  plot.style.height = state.zoom === 'stk' ? ''
    : Math.max(340, Math.min(560, xs.length * 46 + 180)) + 'px';

  // Clicking a segment narrows to it. The x axis does not move - it is time -
  // so the same months come back with only that member in them, which is the
  // comparison the click was asking for.
  // The origins are not a level, so there is nothing under them to open.
  const canDrill = !pnlMode && !ordMode && sl !== undefined;
  if (stkChart) stkChart.destroy();
  stkChart = new Chart(document.getElementById('stkBars'), {
    type: 'bar', data: { labels: xs.map(r => r.name), datasets: shownSeries },
    plugins: [pointLabels, barValues],
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
      // The pointer still drills: a click is a choice, a hover is not.
      interaction: { mode: 'index', intersect: false },
      datasets: { bar: { categoryPercentage: 0.8, barPercentage: 0.95 } },
      onHover: (e, els) => {
        e.native.target.style.cursor = (els.length && canDrill) ? 'pointer' : '';
      },
      onClick(e, els) {
        if (!canDrill) return;
        // The index-mode elements Chart.js hands over are the whole column,
        // line dataset first, so they say which month was clicked and not
        // which band. Asking again for what the pointer is actually inside is
        // the difference between "a bar was clicked" and "MX was clicked".
        const hit = this.getElementsAtEventForMode(
          e, 'nearest', { intersect: true }, true)[0] || els[0];
        const d = hit && this.data.datasets[hit.datasetIndex];
        if (!d || d.type === 'line' || !d.label) return;
        const j = DATA.levels[sl].values.indexOf(d.label);
        if (j < 0) return;                       // the folded Other, not a member
        defer(() => setFilter(sl, j));
      },
      scales: {
        // Two stack names on a stacked axis put the figure and the costs
        // side by side on the same tick; one name leaves a single bar centred.
        // offset is on in both: without it the first and last bars sit hard on
        // the axis ends and lose half their width off the edge of the plot.
        x: { stacked: true, offset: true, grid: { display: false },
             border: { display: false },
             ticks: { color: C.ink2, autoSkip: false, maxRotation: 0 } },
        // Not stacked while the bands are spans: each one already carries the
        // bottom and top it is to be drawn between, and stacking would add the
        // one below to it all over again.
        y: { stacked: !onBands, beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             max: pctMode ? 100 : undefined,
             // Not a hard max: a bar bigger than the slice's own figure - the
             // P&L's cost stack can be - still gets the room it needs.
             suggestedMax: pctMode ? undefined : axisTop,
             suggestedMin: pctMode ? undefined : axisBottom,
             title: { display: true, color: C.ink3,
                      text: pctMode ? 'Share of the bar'
                        : pnlMode ? 'Amount'
                        : (figs.find(x => x.key === state.stkFig) || {}).label },
             ticks: { color: C.ink3,
                      callback: v => (pctMode ? `${v}%`
                                              : Number(v).toLocaleString()) } },
        // The line carries its own value over every point, so the axis it is
        // scaled against has nothing left to tell anyone. It stays as a scale
        // and stops being drawn, which gives the bars the width back.
        ...(hasLine ? { y1: {
          display: false, position: 'right',
          suggestedMin: -10, suggestedMax: 10 } } : {}),
      },
      plugins: {
        legend: { display: false },
        barValues: { on: state.zoom === 'stk', pct: pctMode, share: pnlMode },
      // Expanded, there is room for every line's figures and that is what the
      // room is for; the switch beside the chart takes them away again.
      pointLabels: { all: state.zoom === 'stk' && state.lineVals },
        // Nothing on hover while the chart sits on the page. A figure that
        // appears under the pointer is read by whoever happens to be moving
        // the mouse and by nobody else, and on a page being shown to a room it
        // is a number nobody asked for. Expand is the deliberate step: it
        // gives the chart the window and labels every value at once, for
        // everyone looking at it. So the tooltip belongs to that mode.
        tooltip: { enabled: state.zoom === 'stk',
          backgroundColor: C.surface, titleColor: C.ink,
          bodyColor: C.ink2, borderColor: C.grid, borderWidth: 1, padding: 10,
          // A span's parsed.y is its top edge, not its size, so what the band
          // is worth comes off `amounts` wherever it has one.
          filter: c => (c.dataset.amounts ? c.dataset.amounts[c.dataIndex]
                                          : c.parsed.y) !== 0
                       && c.parsed.y !== null,
          callbacks: {
            label: c => c.dataset.yAxisID === 'y1'
              ? `${c.dataset.label}: ` + (c.parsed.y == null ? 'no net sales'
                  : c.parsed.y.toFixed(1) + '%')
              : pctMode
                ? `${c.dataset.label}: ${c.parsed.y.toFixed(1)}%  (${
                    fmt(c.dataset.amounts[c.dataIndex])})`
                : `${c.dataset.label}: ${fmt(Array.isArray(c.raw)
                    ? c.dataset.amounts[c.dataIndex] : c.parsed.y)}`,
            footer: items => {
              const r = xs[items[0].dataIndex];
              const f = fin[r.mi];
              return [...(pnlMode
                       ? [`Costs: ${fmt(COSTS.reduce(
                           (a, k) => a + Math.abs(f[k] || 0), 0))}`]
                       : [`${(figs.find(x => x.key === state.stkFig) || {}).label}`
                          + `: ${fmt(r.total)}`]),
                      ...(hasLine ? [`${label('profit')}: ${fmt(f.profit || 0)}`]
                                  : []),
                      ...(f.qty ? [`Qty: ${fmt(f.qty)}`] : []),
                      ...(canDrill
                          ? [`click a band to keep only that ${DATA.levels[sl].name}`]
                          : [])];
            } } },
      },
    },
  });

  document.getElementById('stkHint').textContent =
    (ordMode
      ? `${(figs.find(x => x.key === state.stkFig) || {}).label} by ${PER}, `
        + `split by when the order behind it was placed, with what no order `
        + 'could be matched to in grey - so the bar comes to the same total as '
        + 'every other way of stacking it. What the month ships but has not '
        + 'sold yet is not here: it is next month\'s.'
        + (() => {
            const blind = DATA.months.filter(m => !m.carryIn).map(m => m.label);
            return blind.length
              ? ` ${blind.join(', ')} ${blind.length > 1 ? 'are' : 'is'} empty: `
                + 'the month before was not read, so how much came in is '
                + 'unknown rather than nil.'
              : '';
          })()
      : pnlMode
      ? `${label('gross')} beside what it went out on, by ${PER}. Costs are `
        + 'drawn as amounts, and each block carries what it is worth as a '
        + `share of ${denom} - the same denominator as the line, so the bar `
        + 'and the line are read together. Expand adds the amount under it.'
      : sl === undefined
        ? `${(figs.find(x => x.key === state.stkFig) || {}).label} by ${PER}. `
          + `Every ${state.stack} level is narrowed to one value, so there is `
          + 'nothing left to split by - step one back to bring a split back.'
        : `${(figs.find(x => x.key === state.stkFig) || {}).label} by ${PER}, `
          + `each split by ${DATA.levels[sl].name}`
          + (sl === DATA.promoAt
             ? '. The DTC band is drawn narrower, inside the nationwide one it '
               + 'ran under - a drawing, not a different number'
             : '')
          + (pctMode ? `, every ${PER} normalised to its own total - the mix, `
                       + 'not the size. Expand keeps the amount behind each '
                       + 'share'
                     : '')
          + (folded ? `. The eight biggest ${DATA.levels[sl].name.toLowerCase()}s `
                      + `have a colour of their own, the same colour in every `
                      + `${PER}; the rest are folded into Other.` : '.'))
    + (state.cumul ? ` Running totals: every bar is itself plus everything `
                     + `before it, so the last one is the whole span.` : '')
    + (hasLine ? ` The solid line is ${label('profit')} over ${denom} for the `
                 + 'whole slice, each point carrying its own figure'
                 + (pnlMode ? '.'
                    : '; the dotted lines are the same margin for each band, in '
                      + 'the band\'s own colour - two bands the same size can '
                      + 'be a long way apart on it.') : '')
    + (overCap ? ` ${overCap} point${overCap > 1 ? 's' : ''} over `
                 + `${MARGIN_CAP}% ${overCap > 1 ? 'are' : 'is'} left off: `
                 + 'profit cannot be most of net sales, so a margin that high '
                 + 'is a tiny base rather than a result, and drawn it would '
                 + 'own the axis.' : '')
    + (tooSmall ? ` A band under ${(LINE_FLOOR * 100).toFixed(1)}% of its `
                  + `${PER} keeps its bar and loses its margin point - `
                  + `${tooSmall} of them - because a ratio over almost nothing `
                  + 'swings by hundreds of points and says nothing.' : '')
    + (canDrill ? ` Click a band to keep only that ${DATA.levels[sl].name}`
                  + (slNext === null ? '.'
                     // Where the split lands depends on the band: inside MX,
                     // Div 1 and Div 2 are MX again and the drill goes past
                     // them. Naming only the next level would be wrong for
                     // half the bands, and saying neither would hide the rule.
                     : `; the split then steps down to `
                       + DATA.levels[slNext].name
                       + (chain.indexOf(slNext) < chain.length - 1
                          ? ', or past it where it holds one value.' : '.'))
                : '')
    // Two gestures on the legend, and neither is guessable, so both are said.
    + ' A legend entry takes its band out of the bars; double-click one to keep'
    + ' only that band.'
    // The chart says nothing under the pointer, which reads as broken unless
    // the page says where the figures are instead.
    + (state.zoom === 'stk' ? ''
       : ' The bars carry no figures on hover - Expand labels every one of '
         + 'them.');
}

/* The two counts side by side, one pair per member of the level the bars are
   on. Units, not money: both files carry a quantity that means the same thing -
   a unit shipped - while the amounts differ by tax, by currency and by what
   each file calls revenue. The money is in the tooltip, where a systematic
   difference still shows without being mistaken for a reconciling one.

   The overlap is drawn in one colour across both bars, because it is one set of
   units counted twice. What sits above it on each side is what the other side
   does not have. */
/* Which of a pair is which, written over each bar. Two bars on one tick share
   the tick's label, so without this the colours are the only thing saying that
   the left one is the month's sales and the right one the month's orders. */
function renderTable(rows, dimName, ofTotal) {
  document.getElementById('tableCard').hidden = !state.table;
  if (!state.table) return;
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  // The table mirrors the chart, so its total covers the rows charted - say
  // so when that is not all of them, rather than let it read as the whole file.
  const tot = { name: ofTotal > rows.length ? `Total of these ${rows.length}`
                                            : 'Total',
                gross: sum('gross'), profit: sum('profit'),
                net: sum('net'), qty: sum('qty') };
  COSTS.forEach(k => { tot[k] = sum(k); });
  tot.asp = tot.qty ? tot.net / tot.qty : null;
  const head = [dimName, label('gross'),
                ...COSTS.map(k => label(k)), 'Costs',
                label('profit'), 'Profit %',
                ...(has.qty === undefined ? [] : ['Qty (net)', 'ASP'])];
  const cell = v => (v == null ? '-' : fmt(v));
  const line = r => {
    const costs = COSTS.reduce((a, k) => a + r[k], 0);
    const m = r.net ? (r.profit / r.net) * 100 : null;
    const p = r.profit;
    return [`<td>${r.name}</td>`, `<td>${cell(each(r, 'gross'))}</td>`,
            ...COSTS.map(k => `<td>${cell(each(r, k))}</td>`),
            `<td>${cell(costs)}</td>`,
            `<td class="${p < 0 ? 'neg' : ''}">${cell(each(r, 'profit'))}</td>`,
            `<td class="${m < 0 ? 'neg' : ''}">${
              m == null ? '-' : m.toFixed(1) + '%'}</td>`,
            ...(has.qty === undefined ? [] : [
              `<td>${fmt(r.qty)}</td>`,
              `<td>${r.asp == null ? '-' : unitFmt(r.asp)}</td>`])].join('');
  };
  document.getElementById('tableBox').innerHTML = `<table>
    <thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${line(r)}</tr>`).join('')}</tbody>
    <tfoot><tr>${line(tot)}</tr></tfoot></table>`;
}

/* Back widens the deepest narrowing, whichever chain it was in, and puts the
   split back on that level. With time on the x axis there is no level to step
   up from - the narrowing is the whole of where you are. */
/* The narrowing Back would widen: the deepest one in the chain being looked
   at, not the deepest one on the page. Those are different the moment a
   narrowing is left behind in another chain - a SKU picked earlier is still a
   narrowing, and Back from the Customer stack used to widen that and move the
   page to Product, which is not where Back was pressed. */
function backLevel() {
  const chain = CHAINS[state.stack] || [];
  let last = -1;
  chain.forEach(i => { if (state.filter[i] >= 0) last = i; });
  return last;
}

document.getElementById('backBtn').onclick = () => {
  const last = backLevel();
  if (last < 0) return;
  state.filter[last] = -1;
  state.dim = last;
  render();
};
document.getElementById('numbersBtn').onclick = () => {
  state.numbers = !state.numbers; render(); };
document.getElementById('tableBtn').onclick = () => {
  state.table = !state.table; render(); };

/* The campaign's own window, drawn on the chart rather than only written over
   it: a tinted band behind the bars that are inside it, a rule at each edge,
   and the two dates on the rules. The outer bars - the month either side - sit
   outside the tint, which is the whole point of drawing it: what the campaign
   did and what the same products did around it should not need a caption to
   be told apart. */
const campaignWindow = {
  id: 'campaignWindow',
  beforeDatasetsDraw(c) {
    const o = c.options.plugins.campaignWindow;
    if (!o || o.from == null) return;
    const meta = c.getDatasetMeta(0);
    const a = meta.data[o.from], b = meta.data[o.to];
    if (!a || !b) return;
    const { ctx, chartArea } = c;
    const x0 = a.x - a.width / 2 - 2;
    const x1 = b.x + b.width / 2 + 2;
    ctx.save();
    ctx.fillStyle = fade(C.gross, .07);
    ctx.fillRect(x0, chartArea.top, x1 - x0, chartArea.bottom - chartArea.top);
    ctx.restore();
  },
  afterDatasetsDraw(c) {
    const o = c.options.plugins.campaignWindow;
    if (!o || o.from == null) return;
    const meta = c.getDatasetMeta(0);
    const a = meta.data[o.from], b = meta.data[o.to];
    if (!a || !b) return;
    const { ctx, chartArea } = c;
    const x0 = a.x - a.width / 2 - 2;
    const x1 = b.x + b.width / 2 + 2;
    ctx.save();
    ctx.strokeStyle = fade(C.profit, .55);
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 3]);
    [x0, x1].forEach(x => {
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.font = '600 11px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textBaseline = 'middle';
    // Each label hugs its own rule and leans into the window, so neither can
    // be read as belonging to the month outside it.
    const plate = (text, x, align) => {
      const w = ctx.measureText(text).width;
      const left = align === 'left' ? x + 5 : x - w - 5;
      ctx.fillStyle = C.surface;
      ctx.globalAlpha = .9;
      ctx.beginPath();
      ctx.roundRect(left - 4, chartArea.top + 1, w + 8, 17, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.profit;
      ctx.textAlign = 'left';
      ctx.fillText(text, left, chartArea.top + 10);
    };
    plate(o.startLabel, x0, 'left');
    plate(o.endLabel, x1, 'right');
    ctx.restore();
  },
};

/* One campaign, day by day, between the dates the plan says it ran.

   The month chart answers "how big was it"; this answers "how did it go" -
   the shape of a launch, whether a pre-order built or spiked, whether the
   last week was worth running. Both are the same orders, counted on the day
   they came in.

   Nothing is drawn outside the window. A day after the campaign closed is an
   order banded on a line whose dates say otherwise, and a bar there would say
   the campaign was still running. */
let dayChart = null;

function campaignDays(name) {
  const c = (DATA.campaigns || {})[name];
  if (!c) return null;
  const start = c.start, end = c.end;
  if (!start || !end) return null;
  // Every day between the two, so a gap reads as a day with no sales rather
  // than as a day the chart skipped.
  const days = [];
  for (let d = new Date(start + 'T00:00:00');
       d <= new Date(end + 'T00:00:00'); d.setDate(d.getDate() + 1)) {
    const key = d.toISOString().slice(0, 10);
    const v = (c.days || {})[key] || [0, 0];
    days.push({ key, units: v[0], amount: v[1] });
  }
  // Either side, a rate rather than a run of days: what the same products did
  // per day in the month before it opened and the month after it closed. The
  // days outside the window are not the campaign's and are not drawn one by
  // one - the question they answer is whether the campaign moved the rate.
  const rate = v => (v && v[2] ? { units: v[0] / v[2], amount: v[1] / v[2],
                                   total: v[0], days: v[2] } : null);
  const inside = days.reduce((a, d) => a + d.units, 0);
  // A run too long to read a day at a time is read a week at a time. The
  // first bucket starts on the day the campaign opened, so the weeks are the
  // campaign's own and not the calendar's.
  let cols = days, weekly = false;
  if (days.length > DAY_MAX) {
    weekly = true;
    cols = [];
    for (let i = 0; i < days.length; i += 7) {
      const week = days.slice(i, i + 7);
      cols.push({
        key: week[0].key, span: week.length,
        units: week.reduce((a, d) => a + d.units, 0),
        amount: week.reduce((a, d) => a + d.amount, 0),
      });
    }
  }
  return {
    start, end, days: cols, weekly,
    before: rate(c.before), after: rate(c.after),
    during: days.length ? { units: inside / days.length, total: inside,
                            days: days.length } : null,
  };
}

const dayLabel = (iso, year) => {
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul',
    'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()]}`
    // A run that crosses a new year says which: "2 Oct to 31 Dec" over
    // fifteen months reads as a quarter.
    + (year ? ` ${String(d.getFullYear()).slice(2)}` : '');
};

function openCampaign(name) {
  const got = campaignDays(name);
  if (!got) return false;
  readColours();
  const { start, end, days, weekly, before, after, during } = got;
  const units = days.reduce((a, d) => a + d.units, 0);
  const amount = days.reduce((a, d) => a + d.amount, 0);
  const sold = days.filter(d => d.units).length;
  // Counted in whatever the bars are: weeks where the run is drawn weekly,
  // days where it is not. "11 of 29 days" and "4 of 10 weeks" are both true
  // of the same campaign and only one of them matches what is on screen.
  const soldOf = weekly ? `${sold} of ${days.length} weeks`
                        : `${sold} of ${during ? during.days : 0} days`;
  const best = weekly ? null
    : days.reduce((a, d) => (d.units > (a ? a.units : 0) ? d : a), null);
  // A rate under a tenth is still a rate: 6 units over a year is 0.01 a day,
  // and printing 0.0 there says the campaign sold nothing.
  const perDay = v => (v == null ? '-'
    : v.toFixed(v >= 10 ? 0 : v >= 0.1 || v === 0 ? 1 : 2));
  const lift = (a, b) => (a && b && a.units ? ((b.units / a.units - 1) * 100) : null);
  const yr = start.slice(0, 4) !== end.slice(0, 4);
  document.getElementById('dayName').textContent = name;
  document.getElementById('dayWhen').innerHTML =
    `Launched <b>${dayLabel(start, yr)}</b> &middot; ended `
    + `<b>${dayLabel(end, yr)}</b>`
    // The run's own length, which is not the number of bars once a long run
    // is drawn a week at a time.
    + ` &middot; ${during ? during.days : days.length} day`
    + `${(during ? during.days : days.length) === 1 ? '' : 's'}`
    + ` &middot; <b>${fmt(units)}</b> unit${units === 1 ? '' : 's'} ordered`
    + (amount ? ` &middot; <b>${fmt(amount)}</b>` : '')
    + (during ? ` &middot; <b>${perDay(during.units)}</b> a day` : '')
    + (weekly ? ' &middot; drawn a week at a time' : '');
  const up = lift(before, during);
  document.getElementById('dayFoot').textContent =
    'Counted on the day the order came in, which is the day the promotion was '
    + `live - not the day it shipped. ${soldOf} sold anything`
    + (best && best.units ? `; the biggest was ${dayLabel(best.key)} with `
                            + `${fmt(best.units)}. ` : '. ')
    + (before || after
       ? 'The two outer bars are the same products on the days either side - a '
         + 'rate per day over the month before and the month after, not the '
         + 'campaign. '
         + (up !== null ? `Through the campaign they ran ${up >= 0 ? 'up' : 'down'} `
                          + `${Math.abs(up).toFixed(0)}% a day on the month before.`
                        : '')
       : '');
  document.getElementById('dayVeil').hidden = false;
  if (dayChart) dayChart.destroy();
  // The window day by day, with a single averaged bar on either side. Those
  // two are a different measure on the same axis - units a day, not units -
  // so they are drawn in another colour and named for what they are.
  const cols = [];
  if (before) {
    cols.push({ label: `${before.days}d before`, units: before.units,
                amount: before.amount, rate: true });
  }
  days.forEach(d => cols.push({
    label: weekly ? `w/c ${dayLabel(d.key)}` : dayLabel(d.key),
    units: d.units, amount: d.amount }));
  if (after) {
    cols.push({ label: `${after.days}d after`, units: after.units,
                amount: after.amount, rate: true });
  }
  dayChart = new Chart(document.getElementById('dayBars'), {
    type: 'bar',
    plugins: [campaignWindow],
    data: {
      labels: cols.map(c => c.label),
      datasets: [{
        label: 'Units ordered', data: cols.map(c => c.units),
        amounts: cols.map(c => c.amount), rates: cols.map(c => !!c.rate),
        backgroundColor: cols.map(c => (c.rate ? C.ink3 : C.gross)),
        borderRadius: 3, borderSkipped: false, maxBarThickness: 26,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 200 },
      plugins: {
        legend: { display: false },
        campaignWindow: {
          from: before ? 1 : 0,
          to: cols.length - 1 - (after ? 1 : 0),
          startLabel: `Launch ${dayLabel(start, yr)}`,
          endLabel: `End ${dayLabel(end, yr)}`,
        },
        tooltip: {
          backgroundColor: C.surface, titleColor: C.ink, bodyColor: C.ink2,
          borderColor: C.grid, borderWidth: 1, padding: 10,
          callbacks: {
            label: c => {
              const r = c.dataset.rates[c.dataIndex];
              const n = c.parsed.y;
              const amt = c.dataset.amounts[c.dataIndex];
              return (r ? `${n.toFixed(n >= 10 ? 0 : 1)} unit(s) a day`
                        : `${fmt(n)} unit(s)`)
                     + (amt ? `  (${fmt(amt)}${r ? ' a day' : ''})` : '');
            },
          },
        },
      },
      // The window's labels sit along the top of the plot, so the tallest bar
      // needs somewhere to stop short of them.
      layout: { padding: { top: 4 } },
      scales: {
        x: { grid: { display: false }, border: { display: false },
             ticks: { color: C.ink3, autoSkip: true, maxRotation: 0,
                      maxTicksLimit: 16 } },
        y: { beginAtZero: true, grace: '12%', grid: { color: C.grid },
             border: { display: false },
             ticks: { color: C.ink3, precision: 0 } },
      },
    },
  });
  return true;
}

function closeCampaign() {
  document.getElementById('dayVeil').hidden = true;
  if (dayChart) { dayChart.destroy(); dayChart = null; }
}

/* Which levels name a campaign, so picking one can open its days. */
const campaignLevels = () => (DATA.promoAt == null ? []
  : [DATA.promoAt + 1, DATA.promoAt + 2].filter(i => i < DATA.levels.length));

/* Expanding hands one chart the window. Chart.js sizes to its container, and
   the container only changes once the class is on, so the redraw waits a frame
   rather than measuring the old box. */
function setZoom(which) {
  state.zoom = state.zoom === which ? null : which;
  document.body.classList.toggle('zoomed', state.zoom !== null);
  document.getElementById('stkCard').classList.toggle('zoom', state.zoom === 'stk');
  requestAnimationFrame(render);
}
document.getElementById('stkZoom').onclick = () => setZoom('stk');
document.getElementById('stkBack').onclick = () =>
  document.getElementById('backBtn').click();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('dayVeil').hidden) {
    closeCampaign();
    return;
  }
  if (e.key === 'Escape' && state.zoom) setZoom(state.zoom);
});
document.getElementById('stkLineVals').onclick = () => {
  state.lineVals = !state.lineVals; render();
};
document.getElementById('resetBtn').onclick = () => {
  startHere();
  state.stack = 'customer';
  // A band switched off at the legend is as much a narrowing as a filter is,
  // and Reset that leaves one off is a page still hiding something after being
  // told to show everything.
  state.hidden.clear();
  state.lineVals = true;
  render();
};
[['stkCust', 'customer'], ['stkProd', 'product'], ['stkOrd', 'orders'],
 ['stkPromo', 'promo']]
  .forEach(([id, v]) => {
    document.getElementById(id).onclick = () => {
      // Asking for a split is asking to see one, so it leaves the P&L, which
      // has none.
      state.stack = v; state.pnl = false; render();
    };
  });
document.getElementById('cumulBtn').onclick = () => {
  state.cumul = !state.cumul; render(); };
document.getElementById('pnlBtn').onclick = () => {
  state.pnl = !state.pnl; render(); };
[['perMonth', 'month'], ['perQtr', 'quarter']]
  .forEach(([id, v]) => {
    document.getElementById(id).onclick = () => { state.period = v; render(); };
  });
document.getElementById('stkAmt').onclick = () => {
  state.stkScale = 'amount'; render(); };
document.getElementById('stkPct').onclick = () => {
  state.stkScale = 'pct'; render(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);


/* ── the workbook, written here rather than fetched ─────────────────────────
   This page has to stay one file that opens from an email attachment, so the
   .xlsx is built in the browser with no library: an .xlsx is a zip of XML, and
   a stored (uncompressed) zip is a header, the bytes and a central directory.
   The only arithmetic it needs is a CRC32. tools/xlsx.py writes the same four
   parts the same way, so a workbook from the page and one from the toolchain
   open identically.

   What goes in is what is on screen, not the whole file: the same slice the
   filters leave, the same split the chart is drawn by. A download that quietly
   held more than the page showed would be a different report wearing its
   name. */
let CRC = null;
function crc32(bytes) {
  if (!CRC) {
    CRC = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      CRC[n] = c >>> 0;
    }
  }
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], dir = [];
  let at = 0;
  // One timestamp for the whole archive, in the DOS format the zip header
  // wants: seconds have one bit, so they go in pairs.
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name);
    const body = enc.encode(f.data);
    const crc = crc32(body);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true);
    head.setUint16(4, 20, true);
    head.setUint16(6, 0x0800, true);        // names are UTF-8
    head.setUint16(8, 0, true);             // stored
    head.setUint16(10, time, true);
    head.setUint16(12, date, true);
    head.setUint32(14, crc, true);
    head.setUint32(18, body.length, true);
    head.setUint32(22, body.length, true);
    head.setUint16(26, name.length, true);
    head.setUint16(28, 0, true);
    parts.push(new Uint8Array(head.buffer), name, body);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true);
    cen.setUint16(4, 20, true);
    cen.setUint16(6, 20, true);
    cen.setUint16(8, 0x0800, true);
    cen.setUint16(10, 0, true);
    cen.setUint16(12, time, true);
    cen.setUint16(14, date, true);
    cen.setUint32(16, crc, true);
    cen.setUint32(20, body.length, true);
    cen.setUint32(24, body.length, true);
    cen.setUint16(28, name.length, true);
    cen.setUint32(42, at, true);
    dir.push(new Uint8Array(cen.buffer), name);
    at += 30 + name.length + body.length;
  }
  const dirAt = at;
  let dirLen = 0;
  dir.forEach(p => { dirLen += p.length; });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, dirLen, true);
  end.setUint32(16, dirAt, true);
  const all = [...parts, ...dir, new Uint8Array(end.buffer)];
  let total = 0;
  all.forEach(p => { total += p.length; });
  const out = new Uint8Array(total);
  let o = 0;
  all.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}

const xEsc = v => String(v).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const colLetter = n => {
  let s = '';
  while (n) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s;
              n = (n - r - 1) / 26; }
  return s;
};

/* Styles, the same six tools/xlsx.py uses, so the two look alike in Excel. */
const XL_STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="3"><numFmt numFmtId="164" formatCode="#,##0;(#,##0);-"/>
<numFmt numFmtId="165" formatCode="0.0%;(0.0%);-"/>
<numFmt numFmtId="166" formatCode="#,##0.00;(#,##0.00);-"/></numFmts>
<fonts count="2"><font><sz val="11"/><name val="Arial"/></font>
<font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Arial"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF44546A"/>
<bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1"
 applyFill="1" applyAlignment="1"><alignment horizontal="center"
 vertical="center" wrapText="1"/></xf>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

/* A cell carries its type: a number goes in as a number so the sheet can be
   summed, a percentage keeps its format, and everything else is an inline
   string - no shared-string table to keep in step. */
function sheetXml(rows, widths) {
  const body = rows.map((row, r) => {
    const cells = row.map((v, c) => {
      if (v === null || v === undefined || v === '') return '';
      const ref = `${colLetter(c + 1)}${r + 1}`;
      if (r === 0) return `<c r="${ref}" s="1" t="inlineStr"><is><t>${xEsc(v)}</t></is></c>`;
      if (v && typeof v === 'object' && v.pct !== undefined) {
        return Number.isFinite(v.pct)
          ? `<c r="${ref}" s="3"><v>${v.pct / 100}</v></c>` : '';
      }
      // A price, not an amount. The amounts are whole dollars and read better
      // for it; a price is quoted to the cent, and 2,344.33 shown as 2,344 is
      // a figure nobody can tie back to the net and the units it came from.
      if (v && typeof v === 'object' && v.unit !== undefined) {
        return Number.isFinite(v.unit)
          ? `<c r="${ref}" s="4"><v>${v.unit}</v></c>` : '';
      }
      if (typeof v === 'number') {
        return Number.isFinite(v) ? `<c r="${ref}" s="2"><v>${v}</v></c>` : '';
      }
      return `<c r="${ref}" s="0" t="inlineStr"><is><t xml:space="preserve">${
        xEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r + 1}">${cells}</row>`;
  }).join('');
  const cols = (widths || []).map((w, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2"
 activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${body}</sheetData></worksheet>`;
}

function buildXlsx(sheets) {
  const files = [];
  const types = sheets.map((s, i) =>
    `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  files.push({ name: '[Content_Types].xml', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${types}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>` });
  files.push({ name: '_rels/.rels', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` });
  // Excel refuses a sheet name over 31 characters or carrying : \ / ? * [ ]
  const used = new Set();
  const safe = n => {
    let s = String(n).replace(/[:\\\/?*\[\]]/g, ' ').slice(0, 31) || 'Sheet';
    let i = 2;
    while (used.has(s)) s = `${s.slice(0, 28)} ${i++}`;
    used.add(s);
    return s;
  };
  const tabs = sheets.map((s, i) =>
    `<sheet name="${xEsc(safe(s.name))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');
  files.push({ name: 'xl/workbook.xml', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${tabs}</sheets></workbook>` });
  const rels = sheets.map((s, i) =>
    `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  files.push({ name: 'xl/_rels/workbook.xml.rels', data:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${rels}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` });
  files.push({ name: 'xl/styles.xml', data: XL_STYLES });
  sheets.forEach((s, i) => files.push({
    name: `xl/worksheets/sheet${i + 1}.xml`,
    data: sheetXml(s.rows, s.widths) }));
  return zipStore(files);
}

function saveXlsx(name, sheets) {
  const blob = new Blob([buildXlsx(sheets)], { type:
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Every combination in the slice, month by month.

   The chart and the table are the page's own summaries; this is what they are
   summaries of - one row per customer-and-product combination, one column per
   month, so the whole thing can be pivoted without going back to the export.

   One sheet per figure rather than one sheet with the figures interleaved:
   months across the top is only readable while a row means one thing, and a
   header of "Aug 26 Net / Aug 26 Profit / Aug 26 Qty" across nine months is
   not a sheet anybody filters.

   The filters apply. Narrowed to E-STORE, that is the DTC business month by
   month; narrowed further, it is whatever is on screen. Period and Cumulative
   do not: those shape the chart, and a detail sheet that quietly held quarters
   where it says months would be the one table in the book that lies. */
function detailSheets() {
  const S = DATA.series.length;
  const M = DATA.months.length;
  const rows = new Map();
  for (const c of DATA.combos) {
    if (!inSlice(c)) continue;
    const key = c.k.join('\u0001');
    let e = rows.get(key);
    if (!e) { e = { k: c.k, n: 0, v: new Float64Array(M * S) }; rows.set(key, e); }
    e.n += c.n;
    const at = c.m * S;
    for (let j = 0; j < c.v.length; j++) e.v[at + j] += c.v[j];
  }
  if (!rows.size) return [];

  const keep = ['gross', 'deduction', 'cogs', 'opex', 'net', 'profit', 'qty']
    .filter(k => has[k] !== undefined);
  // The cost lines are stored signed and the table shows them positive; the
  // two reading differently about the same number is worse than either.
  const POS = new Set(['deduction', 'cogs', 'opex', 'qty']);
  const names = DATA.levels.map(lv => lv.name);
  const months = DATA.months.map(m => m.label);
  const list = [...rows.values()];

  const sheets = keep.map(k => {
    const j = has[k];
    const sign = POS.has(k) ? Math.abs : (x => x);
    const body = list.map(e => {
      const cells = months.map((_, m) => sign(e.v[m * S + j]));
      const total = cells.reduce((a, b) => a + b, 0);
      return { k: e.k, n: e.n, cells, total };
    });
    // Biggest first, so the sheet opens on what matters rather than on
    // whatever order the combinations happened to be built in.
    body.sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
    const head = [...names, ...months, 'Total', 'Rows'];
    return {
      name: label(k),
      widths: [...names.map(() => 22), ...months.map(() => 14), 14, 8],
      rows: [head, ...body.map(r => [
        ...r.k.map((v, i) => DATA.levels[i].values[v]),
        ...r.cells.map(v => (v === 0 ? '' : v)),
        r.total, r.n])],
    };
  });

  // Two more, and they are prices rather than amounts: the list price the plan
  // set, and what was actually collected per unit. Neither column sums - the
  // summary column is the figure for the whole period, weighted by the units
  // that earned it, which is why it is headed Weighted and Period rather than
  // Total. The gap between the two is the discount, so Off RRP % sits beside
  // the ASP it is read from.
  //
  // RRP comes from the promotion plan by SKU, so it is only as complete as the
  // plan: a product the plan never names has no list price and the cell is
  // left empty rather than filled with the price charged, which would read as
  // a product that sold at list.
  if (has.qty !== undefined && has.net !== undefined && list.length) {
    const jn = has.net, jq = has.qty;
    const body = list.map(e => {
      const asp = [], rrp = [];
      let net = 0, units = 0, w = 0, wq = 0, wnet = 0;
      months.forEach((_, m) => {
        const q = Math.abs(e.v[m * S + jq]);
        const n = e.v[m * S + jn];
        asp.push(q ? { unit: n / q } : '');
        net += n; units += q;
        const r = rrpAt(m, e.k);
        rrp.push(r === null ? '' : { unit: r });
        // Weighted by the units of the month it was the price in, so a price
        // drop halfway through the period lands where the volume was. The
        // months with a list price also keep their own net, because the
        // discount has to be read off the units it covers - a period ASP that
        // included a month the plan says nothing about would divide one basis
        // by another.
        if (r !== null && q) { w += r * q; wq += q; wnet += n; }
      });
      const per = units ? net / units : null;
      const rrpW = wq ? w / wq : null;
      return { k: e.k, n: e.n, asp, rrp, units, per, rrpW,
               off: rrpW ? (1 - (wnet / wq) / rrpW) * 100 : null };
    });
    body.sort((a, b) => b.units - a.units);
    const key = r => r.k.map((v, i) => DATA.levels[i].values[v]);
    const widths = [...names.map(() => 22), ...months.map(() => 14), 14, 10];
    // Only where the plan priced something: without it the discount column is
    // a header over an empty column, which reads as every unit having sold at
    // list rather than as nothing having a list price.
    const priced = body.some(r => r.rrpW !== null);
    if (priced) {
      sheets.push({ name: 'RRP', widths,
        rows: [[...names, ...months, 'Weighted', 'Units'],
               ...body.map(r => [...key(r), ...r.rrp,
                                 r.rrpW === null ? '' : { unit: r.rrpW },
                                 r.units || ''])] });
    }
    sheets.push({ name: 'ASP',
      widths: priced ? [...widths.slice(0, -1), 14, 10] : widths,
      rows: [[...names, ...months, 'Period', ...(priced ? ['Off RRP %'] : []),
              'Units'],
             ...body.map(r => [...key(r), ...r.asp,
                               r.per === null ? '' : { unit: r.per },
                               ...(priced ? [r.off === null
                                             || !Number.isFinite(r.off)
                                             ? '' : { pct: r.off }] : []),
                               r.units || ''])] });
  }
  return sheets;
}

/* RRP, ASP and the gap between them, for whatever is picked.

   The three belong together: a price on its own says nothing, and the one
   figure anyone wants off them - how far under list the slice actually ran -
   is only meaningful if the two sides are read over the same units. They are:
   the discount is the priced units' own ASP over their own list price, and the
   tile says how much of the slice that is whenever it is not all of it.

   ASP is the whole slice, because that one is a fact about the slice rather
   than about the plan's coverage. Where the two bases differ the discount tile
   says so rather than quietly using a different denominator from the tile
   beside it. */
function priceTiles() {
  const card = document.getElementById('priceCard');
  const on = has.qty !== undefined && has.net !== undefined;
  card.hidden = !on;
  if (!on) return;
  const all = totals();
  const r = sliceRrp();
  const qty = Math.abs(all.qty);
  const share = r && qty ? (r.qty / qty) * 100 : null;
  // Said once, under whichever tile it qualifies: the plan does not price
  // everything, and a page built without one prices nothing.
  const anyPlan = (DATA.months || []).some(
    m => m.rrp && Object.keys(m.rrp).length);
  const over = r === null
    ? (anyPlan ? 'nothing picked has a list price' : 'no promotion plan read')
    : share !== null && share < 99.5
      ? `over ${share.toFixed(0)}% of the units`
      : '';
  const off = r ? (1 - r.asp / r.rrp) * 100 : null;
  // With the plan short of a few products the two tiles are over different
  // sets, and a list price that reads lower than the ASP beside it looks like
  // an error until you know why. The discount's own ASP is what explains it,
  // so it is said where the discount is.
  const basis = r && share !== null && share < 99.5
    ? `${over}, whose ASP is ${unitFmt(r.asp)}` : over;
  document.getElementById('priceKpis').innerHTML = [
    ['RRP', r ? unitFmt(r.rrp) : '-', '', over],
    ['ASP', all.asp == null ? '-' : unitFmt(all.asp), '',
     r && share !== null && share < 99.5 ? 'all of the units' : ''],
    // Below list is the normal direction, so it is not marked; above list is
    // either a price rise the plan has not caught up with or a mis-keyed line,
    // and either way it is worth seeing in red.
    ['Average discount %', off === null ? '-' : off.toFixed(1) + '%',
     off !== null && off < 0 ? 'neg' : '', basis],
  ].map(([k, v, cls, note]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v ${cls}">${v}</div>`
    + (note ? `<div class="n">${note}</div>` : '') + '</div>'
  ).join('');
}

/* The plan's list price for one combination in one month, or null.

   By SKU, because that is what a list price is a property of. A row whose
   product level is coarser than the SKU - and every detail row carries the SKU,
   so that is not this page - would have no single answer. */
function rrpAt(m, k) {
  const i = DATA.levels.findIndex(lv => lv.name === 'SKU');
  if (i < 0 || i >= k.length) return null;
  const v = (DATA.months[m].rrp || {})[DATA.levels[i].values[k[i]]];
  return Number.isFinite(v) ? v : null;
}

/* What the whole slice was meant to sell for, weighted by the units that sold.

   The denominator of the discount on the Scope sheet, and it has to be read
   off the same combinations the detail sheets hold or the two would disagree
   about the same slice. */
function sliceRrp() {
  if (has.qty === undefined || has.net === undefined) return null;
  let w = 0, q = 0, net = 0;
  for (const c of DATA.combos) {
    if (!inSlice(c)) continue;
    const r = rrpAt(c.m, c.k);
    if (r === null) continue;
    const u = Math.abs(c.v[has.qty]);
    if (!u) continue;
    w += r * u; q += u; net += c.v[has.net];
  }
  // The net of the same units, so the discount is one basis divided by itself:
  // the slice's own ASP includes whatever the plan never priced, and dividing
  // that by a list price read off the rest is how a book ends up quoting a
  // discount nobody ran.
  return q ? { rrp: w / q, qty: q, asp: net / q } : null;
}

/* What the sheets hold: the figures behind the chart, the breakdown the table
   shows, every combination behind both, and the narrowing in force - so a
   workbook sent on says which slice it is of. */
function exportBook() {
  const pct = v => (v == null || !Number.isFinite(v) ? '' : { pct: v });
  const sheets = [];

  // 1. the chart, exactly as drawn: one row per series, one column per period
  if (stkChart) {
    const labels = stkChart.data.labels || [];
    const rows = [['Series', ...labels]];
    stkChart.data.datasets.forEach(d => {
      if (d.label == null) return;
      // The margin lines are read off the second axis and are percentages;
      // writing them beside the amounts under a thousands format turned 14.4%
      // into "14", which is the one number on the sheet nobody could place.
      const isPct = d.yAxisID === 'y1';
      rows.push([d.label, ...labels.map((_, i) => {
        const v = d.data[i];
        // A band drawn as a floating bar carries [from, to]; its height is
        // what the chart shows, so that is what the sheet gets.
        const n = Array.isArray(v) ? v[1] - v[0] : v;
        if (!Number.isFinite(n)) return '';
        return isPct ? { pct: n } : n;
      })]);
    });
    sheets.push({ name: 'Chart', rows,
                  widths: [34, ...labels.map(() => 14)] });
  }

  // 2. the table, every row of it - the page shows the top twelve because a
  //    screen runs out, which is not a reason for the workbook to stop there
  if (lastTable) {
    const { rows, dimName } = lastTable;
    const head = [dimName, label('gross'), ...COSTS.map(k => label(k)), 'Costs',
                  label('profit'), 'Profit %',
                  ...(has.qty === undefined ? [] : ['Qty (net)', 'ASP'])];
    const line = r => {
      const costs = COSTS.reduce((a, k) => a + r[k], 0);
      const m = r.net ? (r.profit / r.net) * 100 : null;
      return [r.name, each(r, 'gross'), ...COSTS.map(k => each(r, k)), costs,
              each(r, 'profit'), pct(m),
              ...(has.qty === undefined ? []
                  : [r.qty, r.asp == null ? '' : { unit: r.asp }])];
    };
    const out = [head, ...rows.map(line)];
    const tot = totals();
    out.push([]);
    out.push(line({ name: 'Total', ...tot }));
    sheets.push({ name: 'Table', rows: out,
                  widths: [34, ...head.slice(1).map(() => 14)] });
  }

  // 3. everything the two above are summaries of
  const detail = detailSheets();
  detail.forEach(d => sheets.push(d));

  // 4. what was on screen when it was taken
  const all = totals();
  const rrpAll = sliceRrp();
  const scope = DATA.levels
    .map((lv, i) => (state.filter[i] >= 0 ? [lv.name, lv.values[state.filter[i]]] : null))
    .filter(Boolean);
  const sl = splitLevel();
  sheets.push({ name: 'Scope', widths: [26, 46], rows: [
    ['Item', 'Value'],
    ['Report', DATA.title],
    ['Source', DATA.file],
    ['Rows read', DATA.rows],
    ['Taken at', new Date().toLocaleString()],
    [],
    ['Period', state.period === 'quarter' ? 'Quarter' : 'Month'],
    ['Cumulative', state.cumul ? 'Yes' : 'No'],
    ['Stack by', state.stack],
    ['Split by', state.stack === 'orders' ? 'when ordered'
                 : sl === null ? '(none)' : DATA.levels[sl].name],
    ['Scale', state.stkScale === 'pct' ? '% of bar' : 'Amount'],
    [],
    ['Detail rows', detail.length ? detail[0].rows.length - 1 : 0],
    ['Detail sheets', detail.map(d => d.name).join(', ') || '(none)'],
    [],
    ['Filters in force', scope.length ? '' : '(none - the whole file)'],
    ...scope.map(([k, v]) => [k, v]),
    // Not a filter: nothing on the page can bring these back, so a workbook
    // that did not name them would be a slice nobody could reconstruct.
    ...((DATA.dropped || []).length
        ? [[], ['Left out of the build', DATA.dropped.join('; ')]] : []),
    [],
    [label('gross'), each(all, 'gross')],
    ...COSTS.map(k => [label(k), each(all, k)]),
    // Net is on the detail sheets and on the chart's denominator but not in
    // the page's KPI strip, and a total the workbook uses has to be in the
    // workbook's own summary or the two cannot be tied together.
    ...(has.net === undefined ? [] : [[label('net'), all.net]]),
    [label('profit'), each(all, 'profit')],
    ['Profit %', pct(all.margin)],
    ...(has.qty === undefined ? [] : [['Qty (net)', all.qty],
                                      ['ASP', all.asp == null ? ''
                                              : { unit: all.asp }]]),
    // And what it was meant to be. The two together are the discount the slice
    // actually ran at, which is the figure the detail sheets are read for.
    ...(rrpAll === null ? [] : [
      ['RRP (weighted)', { unit: rrpAll.rrp }],
      ['ASP of those units', { unit: rrpAll.asp }],
      ['Off RRP %', pct((1 - rrpAll.asp / rrpAll.rrp) * 100)],
      ['Units with a list price', rrpAll.qty],
    ]),
  ] });

  const stem = (location.pathname.split('/').pop() || 'pnl')
    .replace(/\.html?$/i, '') || 'pnl';
  saveXlsx(`${stem}.xlsx`, sheets);
}

document.getElementById('xlsBtn').onclick = exportBook;
document.getElementById('dayClose').onclick = closeCampaign;
document.getElementById('dayVeil').onclick = e => {
  // Only the veil itself: a click inside the sheet is a click on the chart.
  if (e.target.id === 'dayVeil') closeCampaign();
};
document.getElementById('dayBtn').onclick = () => {
  const i = campaignLevels().find(j => state.filter[j] >= 0);
  if (i !== undefined) openCampaign(DATA.levels[i].values[state.filter[i]]);
};

rebind();
startHere();
render();
</script>
</body>
