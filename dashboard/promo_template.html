<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotions</title>
<style>
:root {
  color-scheme: light;
  --page:#f4f5f7; --surface:#fcfcfb; --line:#e3e4e8; --grid:#ecedf1;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#83827d;
  --accent:#2a78d6; --accent-ink:#fff; --chip:#fff; --neg:#d14343;
  --on-fill:#0b0b0b;
  /* One hue per source of the answer, fixed. Grey is deliberate for "nothing
     fits": an absence is not a fifth category. */
  --s-rule:#2a78d6; --s-voucher:#eb6834; --s-plan:#1baf7a;
  --s-loose:#eda100; --s-none:#a9a8a1;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark;
  --page:#111110; --surface:#1a1a19; --line:#343431; --grid:#2a2a28;
  --ink:#fff; --ink-2:#c3c2b7; --ink-3:#8f8e85;
  --accent:#3987e5; --accent-ink:#0b0b0b; --chip:#232321; --neg:#f08a7a;
  --s-rule:#3987e5; --s-voucher:#d95926; --s-plan:#199e70;
  --s-loose:#c98500; --s-none:#6b6a64; } }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#111110; --surface:#1a1a19; --line:#343431; --grid:#2a2a28;
  --ink:#fff; --ink-2:#c3c2b7; --ink-3:#8f8e85;
  --accent:#3987e5; --accent-ink:#0b0b0b; --chip:#232321; --neg:#f08a7a;
  --s-rule:#3987e5; --s-voucher:#d95926; --s-plan:#199e70;
  --s-loose:#c98500; --s-none:#6b6a64; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink);
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,"Malgun Gothic",sans-serif; }
.wrap { max-width:1180px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:20px; margin:0 0 2px; }
h2 { font-size:14px; margin:0 0 10px; font-weight:650; }
.sub { color:var(--ink-3); font-size:12px; margin-bottom:16px; }
.card { background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end; }
label.f { display:flex; flex-direction:column; gap:3px; font-size:11px;
  color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
select,.btn { font:inherit; color:var(--ink); background:var(--chip);
  border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
select { min-width:150px; max-width:240px; }
.btn { cursor:pointer; } .btn:hover { border-color:var(--accent); }
.btn.active { background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); }
.kpis { display:flex; flex-wrap:wrap; gap:10px; margin:2px 0 14px; }
.kpi { flex:1 1 140px; background:var(--chip); border:1px solid var(--line);
  border-radius:8px; padding:9px 12px; }
.kpi .k { font-size:11px; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kpi .v { font-size:19px; font-weight:650; font-variant-numeric:tabular-nums; }
.kpi .n { font-size:11px; color:var(--ink-3); }
.legend { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:12px;
  color:var(--ink-2); margin-bottom:8px; }
.legend i { width:11px; height:11px; border-radius:3px; display:inline-block;
  margin-right:6px; vertical-align:-1px; }
.chart { position:relative; }
.scope { font-size:12px; color:var(--ink-3); margin:10px 0 0; }
.scope b { color:var(--ink-2); font-weight:600; }
.crumb { display:flex; flex-wrap:wrap; gap:4px; align-items:center;
  font-size:13px; margin-bottom:12px; }
.crumb button { background:none; border:0; color:var(--accent); cursor:pointer;
  font:inherit; padding:2px 5px; border-radius:5px; }
.crumb button:hover { background:var(--grid); }
.crumb .sep { color:var(--ink-3); } .crumb .now { font-weight:600; padding:2px 5px; }
.note { font-style:normal; font-size:10px; color:var(--ink-3);
  text-transform:none; letter-spacing:0; max-width:220px; }
.hint { font-size:12px; color:var(--ink-3); margin-top:10px; }
table { border-collapse:collapse; width:100%; font-size:13px;
  font-variant-numeric:tabular-nums; }
th,td { padding:7px 10px; border-bottom:1px solid var(--grid); text-align:right;
  white-space:nowrap; }
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2) { text-align:left;
  white-space:normal; }
thead th { color:var(--ink-3); font-weight:600; font-size:11px;
  text-transform:uppercase; letter-spacing:.04em; }
tfoot td { font-weight:650; border-top:1px solid var(--line); border-bottom:0; }
.tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px;
  color:var(--on-fill); }
@media (max-width:640px){ select{min-width:0;width:100%} label.f{flex:1 1 100%} }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">Promotions</h1>
  <div class="sub" id="pageSub"></div>

  <div class="card">
    <div class="row" id="filters"></div>
    <div class="scope" id="scope"></div>
  </div>

  <div class="card">
    <h2>How each order line was attributed</h2>
    <div class="kpis" id="kpis"></div>
    <div class="legend" id="legend"></div>
    <div class="chart" id="dayPlot" style="height:240px"><canvas id="dayChart"></canvas></div>
    <div class="hint" id="dayHint"></div>
  </div>

  <div class="card">
    <div class="crumb" id="crumb"></div>
    <div class="row" style="margin-bottom:12px">
      <label class="f"><span>Bars by</span><select id="dimPick"></select></label>
      <button class="btn" id="backBtn">&larr; Back</button>
      <label class="f"><span>Show</span><select id="topPick">
        <option value="15">Top 15</option><option value="30">Top 30</option>
        <option value="0">All</option></select></label>
      <button class="btn" id="hideNone">Hide "nothing fits"</button>
    </div>
    <div class="chart" id="promoPlot"><canvas id="promoChart"></canvas></div>
    <div class="hint" id="promoHint"></div>
  </div>

  <div class="card"><h2>The same, as a table</h2><div id="tableBox"></div></div>

  <div class="card" id="missCard">
    <h2>Why nothing fit</h2>
    <div id="missBox"></div>
    <div class="hint">These are the lines no source could answer for. Each
      reason wants something different done about it.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
const DATA = /*__DATA__*/null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C = {};
function readColours() {
  C = { ink:css('--ink'), ink2:css('--ink-2'), ink3:css('--ink-3'),
        grid:css('--grid'), surface:css('--surface'), onFill:css('--on-fill'),
        rule:css('--s-rule'), voucher:css('--s-voucher'), plan:css('--s-plan'),
        loose:css('--s-loose'), none:css('--s-none') };
}
// Which sources this page has, and what to call them. The simple read has two
// where the long match has five, and a page that names five while four of them
// are structurally zero reads as broken rather than as empty.
const SOURCES = DATA.sourceLabels || [
  ['rule',    "the store's own promotion rule"],
  ['voucher', 'a voucher the plan lists'],
  ['plan',    'inferred from the plan'],
  ['loose',   'inferred, but only on a loosened rule'],
  ['none',    'nothing fits'],
];
const fmt = n => Math.round(n).toLocaleString();
const pct = n => n.toFixed(1) + '%';

const state = {
  filter: DATA.levels.map(() => -1),
  dim: DATA.startDim,
  top: 15,
  hideNone: false,
};

function rowsIn() {
  return DATA.rows.filter(r =>
    state.filter.every((want, i) => want < 0 || r.k[i] === want));
}

/* Which values a level can still offer, given the levels above it in the same
   half - picking a Type should not leave Type2 listing other types' values. */
function optionsFor(level) {
  const group = level < DATA.custDepth ? [0, DATA.custDepth]
                                       : [DATA.custDepth, DATA.levels.length];
  const seen = new Set(), all = new Set(), blame = [];
  for (let i = group[0]; i < level; i++) {
    if (state.filter[i] >= 0) blame.push(DATA.levels[i].name);
  }
  for (const r of DATA.rows) {
    all.add(r.k[level]);
    let ok = true;
    for (let i = group[0]; i < level; i++) {
      if (state.filter[i] >= 0 && r.k[i] !== state.filter[i]) { ok = false; break; }
    }
    if (ok) seen.add(r.k[level]);
  }
  return { seen, hidden: all.size - seen.size, blame };
}

/* Narrowing to a value moves the bars down to the next level; widening back to
   All brings them up. A bar click and a select change go through here, so the
   two cannot disagree. */
function setFilter(i, v) {
  state.filter[i] = v;
  if (v >= 0 && state.dim === i && i + 1 < DATA.levels.length) state.dim = i + 1;
  if (v < 0 && state.dim > i) state.dim = i;
  render();
}

function buildFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  DATA.levels.forEach((lv, i) => {
    const { seen, hidden, blame } = optionsFor(i);
    if (state.filter[i] >= 0 && !seen.has(state.filter[i])) state.filter[i] = -1;
    const wrap = document.createElement('label');
    wrap.className = 'f';
    wrap.innerHTML = `<span>${lv.name}</span>`;
    const sel = document.createElement('select');
    sel.innerHTML = `<option value="-1">All (${seen.size})</option>`
      + lv.values.map((v, j) => seen.has(j)
          ? `<option value="${j}">${v}</option>` : '').join('');
    sel.value = String(state.filter[i]);
    sel.disabled = seen.size <= 1 && state.filter[i] < 0;
    sel.onchange = () => setFilter(i, +sel.value);
    wrap.appendChild(sel);
    // A value missing from the list is usually not missing from the file: it
    // sits under a level above that is narrowed. Say so.
    if (hidden) {
      wrap.insertAdjacentHTML('beforeend',
        `<em class="note">${hidden} more under other ${blame.join(' / ')}</em>`);
    }
    box.appendChild(wrap);
  });
  const reset = document.createElement('button');
  reset.className = 'btn'; reset.textContent = 'Reset';
  reset.onclick = () => {
    state.filter = DATA.levels.map(() => -1);
    state.dim = DATA.startDim;
    render();
  };
  box.appendChild(reset);
}

function render() {
  readColours();
  document.getElementById('pageTitle').textContent = DATA.title;
  document.getElementById('pageSub').textContent =
    `${DATA.orders} · ${DATA.lines.toLocaleString()} order lines`
    + (DATA.cancelled ? ` (${DATA.cancelled.toLocaleString()} cancelled left out)` : '')
    + ` · plan: ${DATA.plan}`;
  buildFilters();

  const picked = DATA.levels
    .map((lv, i) => (state.filter[i] >= 0
      ? `${lv.name} ${lv.values[state.filter[i]]}` : null)).filter(Boolean);
  document.getElementById('scope').innerHTML = picked.length
    ? 'Showing <b>' + picked.join('</b> · <b>') + '</b>'
    : 'Showing every order line the plan could be asked about.';

  const dimSel = document.getElementById('dimPick');
  dimSel.innerHTML = DATA.levels.map((lv, i) =>
    `<option value="${i}">${lv.name}</option>`).join('');
  dimSel.value = state.dim;
  document.getElementById('backBtn').disabled = state.dim === 0;

  /* The path taken so far, then the level the bars are on. */
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = '';
  const step = (text, onclick) => {
    if (crumb.children.length) {
      crumb.insertAdjacentHTML('beforeend', '<span class="sep">&rsaquo;</span>');
    }
    if (!onclick) {
      crumb.insertAdjacentHTML('beforeend', `<span class="now">${text}</span>`);
      return;
    }
    const b = document.createElement('button');
    b.textContent = text; b.onclick = onclick; crumb.appendChild(b);
  };
  step('All', () => {
    state.filter = DATA.levels.map(() => -1);
    state.dim = 0; render();
  });
  DATA.levels.forEach((lv, i) => {
    if (state.filter[i] < 0 || i >= state.dim) return;
    step(lv.values[state.filter[i]], () => {
      for (let j = i; j < state.filter.length; j++) state.filter[j] = -1;
      state.dim = i; render();
    });
  });
  step(`by ${DATA.levels[state.dim].name}`, null);

  const rows = rowsIn();
  const bySource = {}, byDay = {}, byBar = new Map();
  let lines = 0, amount = 0;
  for (const r of rows) {
    lines += r.n; amount += r.a;
    const s = DATA.sources[r.s];
    bySource[s] = bySource[s] || [0, 0];
    bySource[s][0] += r.n; bySource[s][1] += r.a;
    (byDay[r.d] = byDay[r.d] || {})[s] = (byDay[r.d][s] || 0) + r.a;
    const name = DATA.levels[state.dim].values[r.k[state.dim]];
    const cur = byBar.get(name)
      || { name, idx: r.k[state.dim], n: 0, q: 0, a: 0, by: {} };
    cur.n += r.n; cur.q += r.q; cur.a += r.a;
    cur.by[s] = (cur.by[s] || 0) + r.a;
    byBar.set(name, cur);
  }

  const known = lines - (bySource.none ? bySource.none[0] : 0);
  document.getElementById('kpis').innerHTML = [
    ['Order lines', fmt(lines), ''],
    ['Attributed', lines ? pct(known * 100 / lines) : '-', `${fmt(known)} lines`],
    ...SOURCES.map(([s, label, card]) => [
      card || (s === 'none' ? 'Nothing fits'
               : s === 'loose' ? 'Loosened rule' : `By ${s}`),
      fmt(bySource[s] ? bySource[s][1] : 0),
      `${fmt(bySource[s] ? bySource[s][0] : 0)} lines`]),
    ['Revenue in view', fmt(amount), ''],
  ].map(([k, v, n]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>` +
    (n ? `<div class="n">${n}</div>` : '') + '</div>').join('');
  document.getElementById('legend').innerHTML = SOURCES.map(([s, label]) =>
    `<span><i style="background:${C[s]}"></i>${label}</span>`).join('');

  drawDays(byDay);
  drawBars([...byBar.values()], amount);
}

let dayChart = null, barChart = null;
function drawDays(byDay) {
  const days = DATA.days;
  const datasets = SOURCES.map(([s, label]) => ({
    label, stack: 'a', data: days.map(d => (byDay[d] && byDay[d][s]) || 0),
    backgroundColor: C[s], borderRadius: 3, borderSkipped: false,
    borderWidth: 1, borderColor: C.surface, maxBarThickness: 26,
  }));
  if (dayChart) dayChart.destroy();
  dayChart = new Chart(document.getElementById('dayChart'), {
    type: 'bar', data: { labels: days.map(d => d.slice(5)), datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { stacked: true, grid: { display: false }, border: { display: false },
             ticks: { color: C.ink3, maxRotation: 0, autoSkipPadding: 12 } },
        y: { stacked: true, beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             title: { display: true, text: 'Revenue', color: C.ink3 },
             ticks: { color: C.ink3, callback: v => Number(v).toLocaleString() } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: C.surface, titleColor: C.ink,
          bodyColor: C.ink2, borderColor: C.grid, borderWidth: 1, padding: 10,
          callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}` } },
      },
    },
  });
  document.getElementById('dayHint').textContent =
    'Revenue per day, split by what could answer for it. The grey band is what '
    + 'no source explained - its shape over the month is the thing to look at.';
}

/* The total at the end of each bar, so the axis need not be read. */
const endLabels = { id: 'endLabels', afterDatasetsDraw(c) {
  const { ctx } = c, area = c.chartArea;
  const last = c.data.datasets.length - 1;
  ctx.save();
  ctx.font = '600 11px -apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textBaseline = 'middle';
  c.getDatasetMeta(last).data.forEach((bar, i) => {
    let total = 0;
    for (const d of c.data.datasets) total += d.data[i] || 0;
    const t = Math.round(total).toLocaleString();
    const w = ctx.measureText(t).width;
    if (bar.x + 6 + w <= area.right) {
      ctx.fillStyle = C.ink2; ctx.textAlign = 'left';
      ctx.fillText(t, bar.x + 6, bar.y);
    }
  });
  ctx.restore();
} };

function drawBars(all, totalAmount) {
  const lv = DATA.levels[state.dim];
  let rows = all.slice();
  if (state.hideNone) {
    rows = rows.filter(r => !/nothing fits|no customer match/i.test(r.name));
  }
  rows.sort((a, b) => b.a - a.a);
  const shown = state.top ? rows.slice(0, state.top) : rows;
  const canDrill = state.dim + 1 < DATA.levels.length;

  // One bar per member, stacked by which source answered for it - so a mixed
  // bar shows at a glance how much of that offer needed inferring.
  const datasets = SOURCES.map(([s, label]) => ({
    label, stack: 'a', data: shown.map(r => r.by[s] || 0),
    backgroundColor: C[s], borderRadius: 3, borderSkipped: false,
    borderWidth: 1, borderColor: C.surface, maxBarThickness: 22,
  }));
  document.getElementById('promoPlot').style.height =
    Math.max(220, shown.length * 28 + 60) + 'px';
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('promoChart'), {
    type: 'bar', data: { labels: shown.map(r => r.name), datasets },
    plugins: [endLabels],
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      animation: { duration: 200 }, layout: { padding: { right: 104 } },
      interaction: { mode: 'index', intersect: false },
      onHover: (e, els) => {
        e.native.target.style.cursor = (els.length && canDrill) ? 'pointer' : '';
      },
      onClick: (e, els) => {
        if (!canDrill || !els.length) return;
        setFilter(state.dim, shown[els[0].index].idx);
      },
      scales: {
        x: { stacked: true, beginAtZero: true, grid: { color: C.grid },
             border: { display: false },
             ticks: { color: C.ink3, callback: v => Number(v).toLocaleString() } },
        y: { stacked: true, grid: { display: false }, border: { display: false },
             ticks: { color: C.ink2, autoSkip: false, callback(v) {
               const t = this.getLabelForValue(v);
               return t.length > 42 ? t.slice(0, 41) + '\u2026' : t; } } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: C.surface, titleColor: C.ink,
          bodyColor: C.ink2, borderColor: C.grid, borderWidth: 1, padding: 10,
          filter: c => c.parsed.x !== 0,
          callbacks: {
            label: c => `${c.dataset.label}: ${fmt(c.parsed.x)}`,
            footer: items => {
              const r = shown[items[0].dataIndex];
              return [`${fmt(r.a)} in all (${pct(totalAmount
                        ? r.a * 100 / totalAmount : 0)})`,
                      `${fmt(r.n)} line(s), ${fmt(r.q)} unit(s)`,
                      ...(canDrill ? [`click to open by ${
                        DATA.levels[state.dim + 1].name}`] : [])];
            } } },
      },
    },
  });

  // Whether this level can divide revenue at all, said where it is being read.
  // A stacked bar is a claim that every unit is in exactly one band, and for
  // every level but the nationwide campaign that claim is false - so the levels
  // inside it say so, and the campaign says how well it holds.
  const f = DATA.fit;
  let fitLine = '';
  if (f && state.dim === DATA.campaignDim) {
    fitLine = ` This level divides the revenue: every unit is in one campaign. `
      + `${f.split}% of units sit on an order whose plan lines gave more than one `
      + `answer, so that much is a precedence; ${f.lost}% are in the residual `
      + `only because the line that best fits the price names no campaign. `
      + `Of ${f.rows} product-and-portal rows, ${f.pure}% sit on one campaign `
      + `and the biggest holds ${f.biggest}% on average - that is how close a `
      + `profit chart stacked this way would be to a measurement.`;
  } else if (f && state.dim > DATA.campaignDim) {
    fitLine = ` This level does not divide the revenue - an order can be in `
      + `several at once - so read the bars as what the band is a mixture of, `
      + `not as a split of it.`;
  }
  document.getElementById('promoHint').textContent =
    `${shown.length} of ${rows.length} ${lv.name.toLowerCase()}(s), biggest first. `
    // Named rather than coloured: which source is first - and so which colour
    // means "answered" - is the page's, not this sentence's.
    + `Each bar is split by which source answered, so a bar that is mostly `
    + `"${SOURCES[0][1]}" needed no inference.`
    + (canDrill ? ` Click a bar to open it by ${DATA.levels[state.dim + 1].name}.`
                : ' This is the last level; Back steps out.')
    + fitLine;

  const tot = shown.reduce((a, r) => ({ n: a.n + r.n, q: a.q + r.q, a: a.a + r.a }),
                           { n: 0, q: 0, a: 0 });
  document.getElementById('tableBox').innerHTML = `<table>
    <thead><tr><th>${lv.name}</th><th>Mostly from</th><th>Lines</th>
      <th>Units</th><th>Revenue</th><th>Share</th></tr></thead>
    <tbody>${shown.map(r => {
      const top = Object.entries(r.by).sort((x, y) => y[1] - x[1])[0];
      return `<tr><td>${r.name}</td>
        <td><span class="tag" style="background:${C[top[0]]}">${top[0]}</span></td>
        <td>${fmt(r.n)}</td><td>${fmt(r.q)}</td><td>${fmt(r.a)}</td>
        <td>${pct(tot.a ? r.a * 100 / tot.a : 0)}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td>${shown.length < rows.length
      ? `Total of these ${shown.length}` : 'Total'}</td><td></td>
      <td>${fmt(tot.n)}</td><td>${fmt(tot.q)}</td><td>${fmt(tot.a)}</td>
      <td></td></tr></tfoot></table>`;
}

document.getElementById('dimPick').onchange = e => {
  state.dim = +e.target.value;
  for (let j = state.dim; j < state.filter.length; j++) state.filter[j] = -1;
  render();
};
document.getElementById('backBtn').onclick = () => {
  if (state.dim === 0) return;
  state.dim -= 1;
  for (let j = state.dim; j < state.filter.length; j++) state.filter[j] = -1;
  render();
};
document.getElementById('topPick').onchange = e => {
  state.top = +e.target.value; render(); };
document.getElementById('hideNone').onclick = e => {
  state.hideNone = !state.hideNone;
  e.target.classList.toggle('active', state.hideNone); render(); };

/* Why nothing fit - a fixed list from the build, not affected by the filters. */
const miss = document.getElementById('missBox');
if (DATA.reasons && DATA.reasons.length) {
  const tot = DATA.reasons.reduce((a, r) => a + r[1], 0);
  miss.innerHTML = `<table><thead><tr><th>Reason</th><th>Lines</th>
    <th>Share of the misses</th></tr></thead><tbody>${
    DATA.reasons.map(([why, n]) => `<tr><td>${why}</td><td>${fmt(n)}</td>
      <td>${pct(n * 100 / tot)}</td></tr>`).join('')}</tbody></table>`;
} else {
  document.getElementById('missCard').hidden = true;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
render();
</script>
</body>
</html>
